хоз (надмірне оволосіння вушних раковин), виявлено, що ця ознака зустрічається в усіх поколіннях тільки у чоловіків і успадковується від батька до сина. Який тип успадкування гіпертрихозу?",["Зчеплений з Х-хромосомою домінантний","Зчеплений з Х-хромосомою рецесивний","Аутосомно-рецесивний","Зчеплений з Y-хромосомою","Аутосомно-домінантний"],3],["Хлопчику 7 років встановлено діагноз – дальтонізм. Батьки здорові, кольоровий зір нормальний. Але у дідуся по материнській лінії така ж аномалія. Який тип успадкування цієї аномалії?",["Рецесивний, зчеплений зі статтю","Аутосомно-домінантний","Неповне домінування","Домінантний, зчеплений зі статтю","Аутосомно-рецесивний"],0],["Генеалогічний метод антропогенетики передбачає збирання інформації, складання та аналіз родоводів. Як називається особа, родовід якої необхідно скласти?",["Пробанд","Сибс","Респондент","Суб’єкт дослідження","Хворий"],0],["У подружжя народився син, хворий на гемофілію. Батьки здорові, а дідусь за материнською лінією також хворий на гемофілію. Визначте тип успадкування ознаки.",["Рецесивний, зчеплений зі статтю","Аутосомно-рецесивний","Домінантний, зчеплений зі статтю","Неповне домінування","Аутосомно-домінантний"],0],["Близнюковий метод діагностики використовують для:",["Оцінки ступеня впливу генотипу і зовнішнього середовища на розвиток ознаки","Діагностики хромосомних захворювань","Діагностики захворювань обміну речовин","Визначення характеру успадкування ознаки","Діагностики захворювань, які успадковуються зчеплено зі статтю"],0],["Під час медико-генетичного консультування родини зі спадковою патологією виявлено, що аномалія проявляється через покоління у чоловіків. Який тип успадкування притаманний для цієї спадкової аномалії?",["Х-зчеплене рецесивне","Аутосомне домінантне","Аутосомне рецесивне","Х-зчеплене домінантне","Y-зчеплене"],0],["При аналізі родоводу лікар-генетик встановив, що хвороба зустрічається в осіб чоловічої та жіночої статей, не в усіх поколіннях, і що у здорових батьків можуть народжуватися хворі діти. Який тип успадкування хвороби?",["Аутосомно-рецесивний","Аутосомно-домінантний","Х-зчеплений домінантний","Х-зчеплений рецесивний","Y-зчеплений"],0],["Чоловік, що страждає на спадкову хворобу, одружився із здоровою жінкою. У них було 5 дітей, три дівчинки і два хлопчики. Усі дівчата успадкували хворобу батька. Який тип успадкування цього захворювання?",["Домінантний, зчеплений з Х-хромосомою","Аутосомно-рецесивний","Аутосомно-домінантний","Зчеплений з Y-хромосомою","Рецесивний, зчеплений з Х-хромосомою"],0],["Під час обстеження 12-річного хлопчика, який відстає у рості, виявлена ахондроплазія: непропорційна тілобудова з помітним вкороченням рук і ніг, внаслідок порушення росту епіфізарних хрящів довгих трубчастих кісток. Дане захворювання є:",["Спадковим за домінантним типом","Спадковим за рецесивним типом","Спадковим, зчепленим зі статтю","Вродженим","Набутим"],0],["При диспансерному обстеженні хлопчику 7-ми років встановлено діагноз – синдром Леша-Наяна (хворіють тільки хлопчики). Батьки здорові, але у дідуся за материнською лінією таке саме захворювання. Який тип успадкування захворювання?",["Рецесивний, зчеплений із статтю","Домінантний, зчеплений із статтю","Аутосомно-рецесивний","Аутосомно-домінантний","Неповне домінування"],0],["У чоловіка виявлене захворювання, яке зумовлене домінантним геном, локалізованим у Х-хромосомі. У кого із дітей буде це захворювання, якщо дружина здорова?",["Тільки у дочок","У всіх дітей","Тільки у синів","У половини синів","У половини дочок"],0],["При аналізі родоводу пробанда виявлено, що ознака проявляється з однаковою частотою у представників обох статей і хворі наявні у всіх поколіннях (по вертикалі), а по горизонталі – у сибсів (братів і сестер пробанда) з відносно великих родин. Який тип успадкування досліджуваної ознаки?",["Автосомно-домінантний","Автосомно-рецесивний","Зчеплений з Х-хромосомою, домінантний","Зчеплений з Х-хромосомою, рецесивний","Зчеплений з Y-хромосомою"],0],["У чоловіка і його сина інтенсивно росте волосся по краю вушних раковин. Це явище спостерігалося також у батька і дідуся за батьківською лінією. Який тип успадкування зумовлює це?",["Зчеплений з Y-хромосомою","Рецесивний, зчеплений з Х-хромосомою","Аутосомно-рецесивний","Аутосомно-домінантний","Домінантний, зчеплений з Х-хромосомою"],0],["Хворий звернувся до медико-генетичної консультації з приводу захворювання дальтонізмом. Лікар-генетик, вивчивши родовід хворого, прийшов до висновку, що це спадкове захворювання. Який коефіцієнт спадковості хвороби?",["H = 1,0","H = 0,0","H = 0,55","H = 0,23","H = 0,8"],0],["Аналіз родоводу дитини з міотонічною дистрофією дозволив встановити, що захворювання виявляється у кожному поколінні, однаково у осіб обох статей, батьки в однаковій мірі передають захворювання дітям. Якщо один з батьків хворий (гетерозигота), а другий – здоровий, ризик народження хворої дитини буде 50%. Визначте тип успадкування захворювання:",["Аутосомно-рецесивний","Y-зчеплене успадкування","Х-зчеплене рецесивне успадкування","Х-зчеплене домінантне успадкування","Аутосомно-домінантний"],4],["Трихо-денто-кістковий синдром є однією з ектодермальних дисплазій, яка виявляється в ураженні зубів, волосся та кісток. Аналіз родоводу встановив наявність патології в кожному поколінні у чоловіків і жінок. За яким типом успадковується цей синдром?",["Аутосомно-домінантним","Рецесивним, зчепленим з Х-хромосомою","Аутосомно-рецесивним","Домінантним, зчепленим з Х-хромосомою","Зчепленим з Y-хромосомою"],0],["У чоловіка, його сина та дочки відсутні малі корінні зуби. Така аномалія спостерігалася також у дідуся по батьківській лінії. Який найбільш імовірний тип успадкування цієї аномалії?",["Аутосомно-домінантний","Аутосомно-рецесивний","Домінантний, зчеплений з Х-хромосомою","Рецесивний, зчеплений з Х-хромосомою","Зчеплений з Y-хромосомою"],0],["Дівчина 16 років звернулася до стоматолога з приводу темної емалі зубів. При вивченні родоводу встановлено, що вказана патологія передається від батька всім дівчаткам, а від матері – 50% хлопчикам. Для якого типу успадкування характерні ці особливості?",["Домінантний, зчеплений з Х-хромосомою","Рецесивний, зчеплений з Х-хромосомою","Рецесивний, зчеплений з Y-хромосомою","Аутосомно-домінантний","Аутосомно-рецесивний"],0],["Гіпоплазія емалі зумовлена домінантним геном, локалізованим в Х-хромосомі. Мати має нормальну емаль зубів, а у батька спостерігається гіпоплазія емалі. У кого з дітей буде виявлятися ця аномалія?",["Тільки у дочок","У всіх дітей","Тільки у синів","У половини дочок","У половини синів"],0],["Вивчається родовід сім’ї, в якій спостерігаються надмірно великі зуби. Ця ознака трапляється в усіх поколіннях тільки у чоловіків і успадковується від батька до сина. Визначте тип успадкування:",["Зчеплений з Y-хромосомою","Автосомно-рецесивний","Автосомно-домінантний","Зчеплений з Х-хромосомою рецесивний","Зчеплений з Х-хромосомою домінантний"],0],["При прийнятті на роботу у хіміко-фармацевтичне підприємство виявлено декілька чоловіків, які не відчували запаху синильної кислоти. За яким типом спадкується ця аномалія?",["Зчеплений з Х-хромосомою, рецесивний","Зчеплений з Y-хромосомою","Зчеплений з Х-хромосомою, домінантний","Аутосомно-рецесивний","Аутосомно-домінантний"],0],["Батько і син мають різні мітохондріальні геноми. Це пояснюється тим, що ці геноми:",["Не успадковуються","Мають високий рівень мутабільності","Успадковуються від матері","Підлягають комбінативній мінливості","Мають різну експресивність"],2],["У молодого подружжя народилася дитина з енцефалопатією. Лікар встановив, що хвороба пов’язана з порушенням мітохондріальної ДНК. Як успадковуються мітохондріальні патології?",["Від матері всіма дітьми","Від матері тільки синами","Від батька тільки дочками","Від батька тільки синами","Від обох батьків усіма дітьми"],0],["In course of prophylactic medical examination a 7-year-old boy was diagnosed to have color blindness. Parents are healthy, color vision is normal. But grandfather from the mother’s side has the same disorder. What is the type of inheriting of this anomaly?",["Autosomal-dominant","Autosomal-recessive","Dominant, sex-linked","Incomplete domination","Recessive, sex-linked"],4],["After the genealogy analysis a geneticist came to the conclusion: a feature is manifested in each generation, men and women inherit the feature with equal frequency. Parents in the equal way give this feature to their offspring. What type of inheritance does the investigated feature have?",["Autosomal-dominant","X-linked dominant inheritance","X-linked recessive inheritance","Autosomal-recessive","Y-linked inheritance"],0],["The study of the genealogy of a family with hypertrichosis (helix excessive pilosis) demonstrated that this feature is manifested in all generations only in men and is inherited by son from his father. What is the type of the hypertrichosis inheritance?",["X-linked recessive chromosome","X-linked dominant chromosome","Y-linked chromosome","Autosome-recessive","Autosome-dominant"],2],["A healthy woman has three sons affected by color blindness who were born after her two marriages. Both of her husbands are healthy. What is the most possible pattern of inheritance of this disease?",["Y-linked","X-linked recessive","Autosomal dominant","X-linked dominant","Autosomal recessive"],1],["A genetics specialist analyzed the genealogy of a family and found that both males and females may have the illness, but not across all the generations, and that healthy parents may have ill children. What is the type of illness inheritance?",["Autosomal recessive","Y-linked","Autosomal dominant","X-linked dominant","X-linked recessive"],0],["A man suffering from a hereditary disease married a healthy woman. They got 5 children, three girls and two boys. All the girls inherited their father’s disease. What is the type of the disease inheritance?",["Recessive, X-linked","Autosomal dominant","Y-linked","Dominant, X-linked","Autosomal recessive"],3],["A 16-year-old girl consulted a dentist about dark colour of tooth enamel. Analysis of her pedigree revealed that this pathology was inherited by all girls from father and by 50% of boys from mother. What mode of inheritance are these peculiarities typical for?",["Dominant, X-linked","Recessive, X-linked","Recessive, Y-linked","Autosomal and dominant","Autosomal and recessive"],0],["Prophylactic medical examination of a 7-year-old boy revealed that the boy had Lesch-Nyhan syndrome (only boys can be affected). His parents are healthy but his grandfather by his mother’s side has the same diagnosis. What is the type of disease inheritance?",["Recessive, sex-linked","Dominant, sex-linked","Autosomally recessive","Autosomally dominant","Semidominance"],0],["Enamel hypoplasia is caused by a dominant gene localized in the X chromosome. Mother has a normal enamel, and father has enamel hypoplasia. Which of children will have this anomaly?",["Only the daughters","All the children","Only the sons","Half of the daughters","Half of the sons"],0],["If a trait is determined mostly by genetic factors, the percentage of concordance between the twins is higher in monozygotic twins than in dizygotic ones. What is the percentage of blood group concordance in monozygotic twins?",["100%","75%","50%","25%","0%"],0],["A young couple has a child with encephalopathy. A doctor determined this disease to be caused by mitochondrial DNA disorder. In what way are mitochondrial pathologies inherited?",["From mother to all her children","From mother to son","From father to daughter","From father to son","From both parents to all their children"],0],["A patient with Leber’s hereditary optic neuropathy comes for genetic counseling. After the family history taking, the genetic counselor constructs pedigree, which displays a distinct mode of inheritance: his disease is transmitted only from affected females to their offspring. Both males and females are affected. None of the offspring of an affected male is affected. Which of the following modes of inheritance is identified by the counselor?",["Mitochondrial","X-linked recessive","Autosomal dominant","X-linked dominant","Autosomal recessive"],0],["Genealogical study of a family with hereditary enamel hypoplasia has revealed that the disease occurs in every generation. In women, the anomaly occurs more frequently than in men. Male patients only pass this trait to their daughters. What type of inheritance takes place in this case?",["X-linked dominant","Autosomal dominant","Autosomal recessive","Y-linked","X-linked recessive"],0],["The parents with normal hearing have two daughters and a son, who are congenitally deaf. Their other 5 children are healthy. What is the pattern of deafness inheritance in this case?",["X-linked recessive","X-linked dominant","Autosomal recessive","Autosomal dominant","Y-linked"],2],["Analysis of the family history of children with Van der Woude syndrome revealed that in their families one of the parents had the typical for this syndrome defects (cleft lip and palate, lip pits regardless of gender). What is the type of inheritance of this syndrome?",["Autosomal dominant","X-linked recessive","X-linked dominant","Autosomal recessive","Multifactorial"],0],["Genealogical analysis of a child with myotonic dystrophy determined that this disease is present in every generation, equally presented by the relatives of both genders, the risk of inheriting this disease is equal no matter which parent is affected. If one of the parents is heterozygous for this disease and the other parent is healthy, the risk of them giving birth to a sick child is 50%. What type of disease inheritance is it?",["Autosomal dominant","Autosomal recessive","X-linked dominant","X-linked recessive","Y-linked"],0],["A genetics specialist analyzed the pedigree of a family (three generations) with hemophilia. He found that a trait affects 2 males (in the first and third generations). The disease does not pass from father to son. What is the type of illness inheritance?",["X-linked recessive","X-linked dominant","Autosomal-recessive","Autosomal-dominant","Y-linked"],0],["A genetics specialist analyzed the pedigree of a family (three generations) with polydactyly. He found that a trait affects males and females (in all generations). Mother or father of child with polydactyly is ill. What is the type of illness inheritance?",["Autosomal-dominant","X-linked dominant","Autosomal-recessive","X-linked recessive","Y-linked"],0],["After pedigree analysis of the family a doctor has found that a trait manifests in every generation, and is inherited both after fathers and mothers, both by daughters and sons, frequency of cases among men and women is alike. What is the type of inheritance?",["Autosomal dominant","Y-linked","Autosomal recessive","X-linked recessive","X-linked dominant"],0],["The man who suffers from the hereditary disease has married the healthy woman. They had five children: three girls and two boys. All the girls have inherited their father’s disease. What is the type of the disease inheritance?",["X-linked dominant","Y-linked","Autosomal recessive","X-linked recessive","Autosomal dominant"],0],["A large, 3-generation family in whom multiple members are affected with a rare, undiagnosed disease is being studied. Affected males never produce affected children, but affected females do produce affected children of both sexes when they mate with unaffected males. What is the most likely mode of inheritance?",["Autosomal dominant, with expression limited to females","Y-linked","Mitochondrial","X-linked dominant","X-linked recessive"],2],["Досліджується велика родина, що включає 3 покоління, в якій декілька членів уражені рідкісним недіагностованим захворюванням. У хворих чоловіків ніколи не народжуються хворі діти, але у шлюбах хворих жінок зі здоровими чоловіками народжуються хворі діти обох статей. Який найімовірніший спосіб успадкування?",["Автосомно-домінантний, з обмеженим проявом у жінок","Y-зчеплене","Мітохондріальне","Х-зчеплений домінантний","Х-зчеплений рецесивний"],2],["A 10-year-old girl is admitted to the hospital because of a recurrent neurologic disorder. Her right arm and leg have become limp, and she is found to have lactic acidosis. Two months earlier, the girl had a grand mal seizure followed by cortical blindness with slow resolution. Muscle biopsy revealed ragged red muscle fibers and abnormal mitochondria. Which of the following types of inheritance is most likely related to her disease? (pedigrees shown in the figure)",["Inheritance is likely to be a new mutation, but it may be a recessive feature that has missed several generations","Mitochondrial inheritance","Autosomal-recessive inheritance","X-linked recessive inheritance","X-linked dominant inheritance"],1,"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAZABkAAD/2wBDAA4KCw0LCQ4NDA0QDw4RFiQXFhQUFiwgIRokNC43NjMuMjI6QVNGOj1OPjIySGJJTlZYXV5dOEVmbWVabFNbXVn/2wBDAQ8QEBYTFioXFypZOzI7WVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVn/wAARCAHWAggDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD0iiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigArmPE2q3FpqFsltK0YgHnSgAkOCcBT+vWunqv8AYoDJcSFMtcALJk9QBjH5UATqwdQykFSMgg8EUtVbPT7ayLm3QruVVOWJ4UYHWrVABRRRQAUUUUAFUNWluI4IVtZEjllmWPey5AB9qv1l68ypDZM7BVF5ESScADNAE08eol2MNxAE/hDRnP5 характерно для синдрому:",["Дауна","Трипло-Х","Клайнфельтера","Трипло-Y","Шерешевського-Тернера"],2],["У новонародженого хлопчика виявлена полідактилія, мікроцефалія, незрощення верхньої губи та піднебіння, а також вади серця і судин. Під час каріотипування діагностовано синдром Патау. Яка причина цієї патології?",["Моносомія Х","Нерозходження статевих хромосом","Трисомія 13-ї хромосоми","Трисомія 18-ї хромосоми","Трисомія 21-ї хромосоми"],2],["У подружжя народилася дитина з розщепленнями губи та піднебіння, аномаліями великих пальців кисті та мікроцефалією. Каріотип дитини: 47,18+. Який тип мутації спричинив цю спадкову хворобу?",["Моносомія за Х-хромосомою","Моносомія за аутосомою","Поліплоїдія","Трисомія за аутосомою","Нулісомія"],3],["При обстеженні букального епітелію чоловіка було виявлено статевий хроматин. Для якої хромосомної хвороби це характерно?",["Хвороби Дауна","Трисомії за Х-хромосомою","Синдрому Шерешевського-Тернера","Гіпофосфатемічного рахіту","Синдрому Клайнфельтера"],4],["У дитини зі спадково обумовленими вадами відразу після народження спостерігався характерний синдром, який називають «крик кішки». При цьому у ранньому дитинстві малюки мають «нявкаючий» тембр голосу. Що було виявлено під час дослідження каріотипу цієї дитини?",["Додаткову Y-хромосому","Додаткову 21-шу хромосому","Додаткову Х-хромосому","Делецію короткого плеча 5-ї хромосоми","Нестачу Х-хромосоми"],3],["При обстеженні 2-місячного хлопчика педіатр звернув увагу, що плач дитини схожий на нявкання кішки, відзначаються мікроцефалія і вада серця. За допомогою цитогенетичного методу був встановлений каріотип – 46,XY,5p-. На якій стадії мітозу досліджували каріотип хворого?",["Метафаза","Прометафаза","Профаза","Анафаза","Телофаза"],0],["У родині зростає дочка 14 років, у якої спостерігаються деякі відхилення від норми: зріст її нижче, ніж у однолітків, відсутні ознаки статевого дозрівання, шия дуже коротка, плечі широкі. Інтелект у нормі. Яке захворювання можна припустити?",["Синдром Клайнфельтера","Синдром Дауна","Синдром Едвардса","Синдром Шерешевського-Тернера","Синдром Патау"],3],["У чоловіка 32-х років високий зріст, гінекомастія, жіночий тип оволосіння, високий голос, розумова відсталість, безпліддя. Попередній діагноз – синдром Клайнфельтера. Що необхідно дослідити для його уточнення?",["Каріотип","Лейкоцитарна формула","Сперматогенез","Група крові","Родовід"],0],["При обстеженні юнака з розумовою відсталістю виявлено євнухоїдну будову тіла, недорозвиненість статевих органів. У клітинах порожнини рота – статевий хроматин. Який метод генетичного дослідження слід застосувати для уточнення діагнозу?",["Клініко-генеалогічний","Цитологічний","Популяційно-статистичний","Дерматогліфіки","Біохімічний"],1],["У медико-генетичну консультацію звернулася вагітна жінка, яка працювала на шкідливому виробництві. Після проведення амніоцентезу стало питання про переривання вагітності. Лікарі пояснили жінці, що її майбутня дитина не буде життєздатною та матиме вади в будові серця, нирок, травної системи, розщеплення м’якого та твердого піднебіння, недорозвиток або відсутність очей. Про яке порушення в каріотипі йшла мова в цьому випадку?",["Трисомія – 13","Трисомія – 21","Моносомія – Х","Трисомія – Y","Полісомія – Х"],0],["Каріотип чоловіка 47 хромосом, в ядрі соматичної клітини виявлене тільце Барра. Спостерігається ендокринна недостатність: недорозвиток сім’яників, відсутність сперматогенезу. Про яке захворювання свідчить даний фенотип?",["Синдром Клайнфельтера","Синдром Патау","Синдром Едвардса","Синдром Шерешевського-Тернера","Синдром Дауна"],0],["Мати і батько здорові. Методом амніоцентезу у клітинах епітелію плода визначено каріотип 45,X0. Діагноз?",["Синдром Шерешевського-Тернера","Синдром Едвардса","Синдром Патау","Синдром «котячого крику»","Синдром «супержінка»"],0],["Під час дослідження клітин букального епітелію слизової оболонки щоки у пацієнта чоловічої статі виявлені 2 тільця Барра. Можливий діагноз:",["Синдром Клайнфельтера","Синдром Шерешевського-Тернера","Синдром Патау","Синдром «супержінки»","Синдром «суперчоловіка»"],0],["За допомогою методу каріотипування у новонародженої дитини з множинними дефектами черепа, кінцівок і внутрішніх органів виявлено три хромосоми 13-ї пари. Було встановлено діагноз:",["Синдром Патау","Синдром Едвардса","Синдром Клайнфельтера","Синдром Дауна","Синдром Шерешевського-Тернера"],0],["У пологовому будинку народилась дитина з численними порушеннями як зовнішнього вигляду, так і з боку внутрішніх органів – серця, нирок, травної системи. Був встановлений діагноз – синдром Едвардса. Яким методом генетики людини можливо підтвердити цей діагноз?",["Цитогенетичним","Дерматогліфіки","Близнюковим","Генеалогічним","Біохімічним"],0],["При обстеженні дівчинки 18 років знайдені ознаки: недорозвинення яєчників, вузький таз, вкорочення нижніх кінцівок, «шия сфінкса», широкі плечі, розумовий розвиток не порушено. Встановлено діагноз – синдром Шерешевського-Тернера. Яким методом це встановлено?",["Цитогенетичним","Дерматогліфіки","Близнюковим","Генеалогічним","Біохімічним"],0],["У жінки 45 років народився хлопчик з розщепленням верхньої щелепи («заяча губа») та «вовча паща». Під час додаткового обстеження виявлені значні порушення з боку нервової, серцево-судинної систем та зору. При дослідженні каріотипу діагностована трисомія по 13 хромосомі. Який синдром має місце у хлопчика?",["Патау","Дауна","Клайнфельтера","Шерешевського-Тернера","Едвардса"],0],["У дівчини виявлена диспропорція тіла, крилоподібні складки на шиї. При цитогенетичному дослідженні в ядрах лейкоцитів не виявлені «барабанні палички», а в ядрах букального епітелію щоки відсутні тільця Барра. Який найбільш вірогідний діагноз?",["Синдром Шерешевського-Тернера","Синдром Клайнфельтера","Синдром Дауна","Синдром Патау","Синдром Едвардса"],0],["Чоловік 26-ти років скаржиться на безпліддя. Об’єктивно: зріст 186 см, довгі кінцівки, гінекомастія, гіпоплазія яєчок, у зіскрібку слизової оболонки щоки знайдені тільця Барра. Діагностований синдром Клайнфельтера. Який механізм хромосомної аномалії має місце при даному захворюванні?",["Нерозходження гетерохромосом у мейозі","Нерозходження хроматид у мітозі","Транслокація","Інверсія хромосоми","Делеція хромосоми"],0],["При розтині трупа новонародженого хлопчика виявлені полідактилія, мікроцефалія, незрощення верхньої губи та твердого піднебіння, а також гіпертрофія паренхіматозних органів. Вказані вади відповідають синдрому Патау. Яка найбільш вірогідна причина даної патології?",["Трисомія 13-ї хромосоми","Трисомія 18-ї хромосоми","Трисомія 21-ї хромосоми","Нерозходження статевих хромосом","Часткова моносомія"],0],["У новонародженого хлопчика спостерігається деформація мозкового та лицевого черепа, вовча паща тощо. Каріотип дитини – 47,XY,13+. Про яку хворобу йдеться?",["Синдром Патау","Синдром Клайнфельтера","Синдром Едвардса","Синдром Дауна","Синдром Шерешевського-Тернера"],0],["До гінеколога звернулася жінка 28-ми років з приводу безпліддя. При обстеженні знайдено: недорозвинені яєчники та матка, нерегулярний менструальний цикл. При дослідженні статевого хроматину в більшості соматичних клітин виявлено два тільця Барра. Яка хромосомна хвороба найбільш вірогідна у жінки?",["Синдром трипло-Х","Синдром Едвардса","Синдром Патау","Синдром Клайнфельтера","Синдром Шерешевського-Тернера"],0],["У жінки під час гаметогенезу (в мейозі) статеві хромосоми не розійшлися до протилежних полюсів клітини. Яйцеклітина була запліднена нормальним сперматозоїдом. Яке хромосомне захворювання може бути у дитини?",["Синдром Шерешевського-Тернера","Синдром Дауна","Синдром Патау","Синдром Едвардса","Синдром котячого крику"],0],["У здорових батьків, спадковість яких не обтяжена, народилась дитина з численними вадами розвитку. Цитогенетичний аналіз виявив в соматичних клітинах дитини трисомію за 13-ю хромосомою (синдром Патау). З яким явищем пов’язане народження такої дитини?",["Порушення гаметогенезу","Соматична мутація","Рецесивна мутація","Домінантна мутація","Хромосомна мута
