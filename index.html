n хромосом. Який механізм їх виникнення?",["Ендомітоз","Політенія","Мітоз","Амітоз","Мейоз"],0],["Під час поділу клітини досліднику вдалося спостерігати фазу, при якій були відсутні мембрани ядра та ядерце, а центріолі знаходились на полюсах клітини. Хромосоми мали вигляд клубка ниток, які вільно розташовувались у цитоплазмі. Для якої фази мітотичного циклу це характерно?",["Анафази","Телофази","Профази","Метафази","Інтерфази"],2],["За допомогою шпателя зроблено зшкріб зі слизової оболонки рота людини. В незруйнованих епітеліальних клітинах забарвленого мазка добре видно овальні ядра, неоднакові за розмірами. Яким шляхом відбувався поділ цих клітин?",["Мейозом","Бінарним поділом","Мітозом","Шизогонією","Амітозом"],4],["У клітині, яка мітотично ділиться, спостерігається розходження дочірніх хроматид до полюсів клітини. На якій стадії мітотичного циклу знаходиться клітина?",["Анафаза","Профаза","Метафаза","Інтерфаза","Телофаза"],0],["У клітині, які здатні до поділу, відбуваються процеси росту, формування органел, їх накопичення, завдяки активному синтезу білків, РНК, ліпідів, вуглеводів. Як називається період мітотичного циклу, в якому відбуваються вказані процеси, але не синтезується ДНК?",["Пресинтетичний","Синтетичний","Премітотичний","Телофаза","Анафаза"],0],["Дочірні хроматиди починають розходитись до полюсів клітини на стадії:",["Анафази","Метафази","Телофази","Профази","Інтерфази"],0],["Другий поділ мейозу дуже нагадує мітоз. У тім присутні деякі відмінності. Чим відрізняється метафаза мітозу від метафази другого поділу мейозу у людини?",["В метафазній пластинці другого поділу мейозу 23 хромосоми, а в метафазній пластинці мітозу – 46 хромосом","В метафазній пластинці другого поділу мейозу 46 хромосом, а в метафазній пластинці мітозу – 23 хромосоми","В метафазі мейозу йде додатковий синтез ДНК","В метафазі мейозу до полюсів йдуть хромосоми, а в метафазі мітозу – хроматиди","Другий поділ мейозу дуже нагадує мітоз. В тім присутні деякі відмінності"],0],["На протязі доби у фазу синтезу ДНК мітотичного циклу ввійшло на 20% менше клітин, ніж до мітозу. Куди поділися клітини?",["Залишилися в пресинтетичному періоді, або ввійшли до G0-фази","Ввійшли до G2-фази","Загинули апоптозом","Загинули некрозом","Залишилися в мітозі"],0],["У мітозі розрізняють чотири фази. В якій фазі клітина людини має 92 однохроматидні хромосоми?",["Анафаза","Телофаза","Метафаза","Профаза","Інтерфаза"],0],["Під час вивчення фаз мітотичного циклу коріння цибулі знайдено клітину, в якій хромосоми лежать в екваторіальній площині, утворюючи зірку. На якій стадії мітозу перебуває клітина?",["Метафаза","Профаза","Анафаза","Телофаза","Інтерфаза"],0],["У життєвому циклі клітини відбувається процес самоподвоєння ДНК. В результаті цього однохроматидні хромосоми стають двохроматидними. У який період клітинного циклу спостерігається це явище?",["S","G0","G1","G2","M"],0],["Проводиться вивчення максимально спіралізованих хромосом каріотипу людини. При цьому процес поділу клітини припинили на стадії:",["Метафази","Профази","Інтерфази","Анафази","Телофази"],0],["Експериментальне вивчення нового медичного препарату виявило блокуючий ефект на збирання білків-тубулінів, які є основою веретена поділу в клітинах, що діляться. Який етап клітинного циклу порушується цим препаратом?",["Анафаза мітозу","Синтетичний період","Телофаза мітозу","Постмітотичний період інтерфази","Премітотичний період інтерфази"],0],["Досліджуються клітини червоного кісткового мозку людини, які належать до клітинного комплексу, що постійно ділиться. Який процес забезпечує генетичну ідентичність цих клітин:",["Мітоз","Мейоз","Репарація","Мутація","Трансплантація"],0],["В овоциті I порядку з’явились 3 нові мутантні гени. Вкажіть максимальне число зигот, які можуть отримати ці гени.",["Одна","Дві","Три","Чотири","Жодна"],0],["Відомо, що статеве розмноження – це поєднання в одній клітині генетичного матеріалу двох різних особин, яке властиве як одноклітинним, так і багатоклітинним організмам. Яка основна форма статевого розмноження характерна для людини?",["Копуляція","Спороутворення","Брунькування","Кон’югація","Шизогонія"],0],["З метою одержання каріотипу людини на клітини в культурі тканини подіяли колхіцином – речовиною, яка блокує скорочення ниток веретена поділу. На якій стадії припиняється мітоз?",["Метафази","Інтерфази","Анафази","Профази","Телофази"],0],["У бактерій встановлений процес кон’югації, при якому між бактеріями утворюється цитоплазматичний місток, по якому з клітини-донора до клітини-реципієнта надходять плазміди і фрагменти молекули ДНК. Яке значення цього процесу?",["Забезпечує обмін генетичного матеріалу","Забезпечує обмін речовинами між клітинами","Сприяє активізації мутаційного процесу","Підвищує гетерозиготність","Ліквідує небажані мутації"],0],["Згідно правила сталості числа хромосом, кожний вид більшості тварин має певне і стале число хромосом. Механізмом, що підтримує цю сталість при статевому розмноженні організмів, є:",["Мейоз","Шизогонія","Амітоз","Регенерація","Брунькування"],0],["При дослідженні культури тканин злоякісної пухлини виявили поділ клітин, який відбувається без ахроматинового апарату шляхом утворення перетяжки ядра, при якому зберігались ядерна оболонка та ядерце. Який тип поділу клітин відбувався у злоякісній пухлині, що вивчалась?",["Амітоз","Ендомітоз","Мітоз","Екзомітоз","Мейоз"],0],["Вивчається мітотичний поділ клітин епітелію ротової порожнини. Встановлено, що в клітині диплоїдний набір хромосом. Кожна хромосома складається з двох максимально спіралізованих хроматид. Хромосоми розташовані у площині екватора клітини. Ця картина характерна для такої стадії мітозу:",["Метафаза","Прометафаза","Профаза","Анафаза","Телофаза"],0],["У гістологічному препараті видно окремі епітеліальні клітини, в яких хромосоми формують «пластинку», що розташована в екваторіальній площині. В якому періоді клітинного циклу перебувають такі клітини?",["Метафаза","Інтерфаза","Профаза","Анафаза","Телофаза"],0],["На одній з фаз сперматогенезу спостерігаються зміни ядра та цитоплазми сперматид, які призводять до утворення зрілих статевих клітин. Яка це фаза гаметогенезу?",["Розмноження","Росту","Формування","Дозрівання","Проліферації"],2],["Під час постсинтетичного періоду мітотичного циклу було порушено синтез білків-тубулінів, які беруть участь у побудові веретена поділу. Це може призвести до порушення:",["Розходження хромосом","Спіралізації хромосом","Цитокінезу","Деспіралізації хромосом","Тривалості мітозу"],0],["Під час постсинтетичного періоду мітотичного циклу було порушено синтез білків тубулінів. До яких наслідків це може призвести?",["Порушення формування веретена поділу","Порушення цитокінезу","Порушення спіралізації хромосом","Порушення репарації ДНК","Скорочення тривалості мітозу"],0],["У літніх людей підвищується частота виникнення пухлин. Що є однією з основних причин цього?",["Зростання кількості порушень під час мітозу","Зниження інтенсивності утворення антитіл","Зниження активності клітинного імунітету","Підвищення активності утворення антитіл","Підвищення активності клітинного імунітету"],0],["During studying of human testes seminiferous tubule specimen student saw secondary spermatocytes. What is the zone that corresponds to certain spermatogenesis stage?",["Maturation","Reproduction","Growth","Formation","Pellucid"],0],["During studying of human ovary at low magnification student saw a secondary oocyte. How many chromosomes does oocyte nucleus have?",["23","24","22","44","46"],0],["Дослідник при мікроскопічному і електронно-мікроскопічному вивченні печінки звернув увагу, що деякі окремо розташовані клітини розпалися на дрібні фрагменти, оточені мембраною. У деяких з них наявні органели, інші включають фрагменти ядра, що розпалося. Запальна реакція навколо відсутня. Дослідник розцінив ці зміни як:",["Апоптоз","Атрофія","Некроз","Гіпоплазія","Дистрофія"],0],["Досліджуються клітини червоного кісткового мозку людини, які належать до клітинного комплексу, що постійно ділиться. Який процес забезпечує генетичну ідентичність цих клітин:",["Мітоз","Мейоз","Репарація","Мутація","Трансплантація"],0],["Прокаріотичні та еукаріотичні клітини характеризуються здатністю до поділу. Поділ прокаріотичних клітин відрізняється від поділу еукаріотичних, але існує молекулярний процес, який лежить в основі цих поділів. Який це процес?",["Реплікація ДНК","Транскрипція","Репарація","Трансляція","Ампліфікація генів"],0],["A team of medical students is performing research on phases of cell cycle. During one of the mitotic phases the cell is nearly done dividing, the chromosomes decondense and two nuclei begin to form around them. Which of the following phases most likely takes place in the cell?",["Telophase","Metaphase","Anaphase","Prophase","Interphase"],0],["In chromosomal disorders, to study the karyotype, the cell culture during mitosis is processed with colchicine. This substance blocks contractions of the fibers that form mitotic spindle. At what stage will the mitosis be interrupted?",["Telophase","Interphase","Prophase","Metaphase","Anaphase"],3],["The study of mitotic cycle phases of onion root revealed the cell, in which the chromosomes are situated in the equatorial plane, forming a star. What stage of cell mitosis is it?",["Interphase","Metaphase","Prophase","Anaphase","Telophase"],1],["Moving of the daughter chromatids to the poles of the cell is observed in the mitotically dividing cell. On what stage of the mitotic cycle is this cell?",["Interphase","Telophase","Metaphase","Prophase","Anaphase"],4],["There are maximally spiralized chromosomes in human cell. When the process of cell division was stopped for studying of human karyotype?",["Interphase","Prophase","Metaphase","Telophase","Anaphase"],2],["Normally, actively dividing cells of human red bone marrow are analyzed. What number of cells’ chromosomes is typical for G1 period of interphase?",["23","47","48","45","46"],4],["According to the law of constant chromosome number, each species of most animals has a definite and constant number of chromosomes. The mechanism providing this constancy in sexual reproduction of the organisms is called:",["Meiosis","Shizogony","Amitosis","Regeneration","Gemmation"],0],["An electronic micrograph presents a cell that has no nucleole and nuclear membrane. Chromosomes have free position, centrioles migrate to the poles. What phase of cell cycle is it typical for?",["Prophase","Anaphase","Metaphase","Telophase","Interphase"],0],["Histologic specimen of endometrium demonstrates isolated epithelial cells with chromosomes that form a «plate» located in the equatorial plane of the cell. What stage of the cell cycle is it?",["Metaphase","Interphase","Prophase","Anaphase","Telophase"],0],["Life cycle of a cell includes the process of DNA autoreduplication. As a result of it monochromatid chromosomes turn into bichromatid ones. What period of cell cycle does this phenomenon fall into?",["S","G0","G1","G2","M"],0],["The organisms to be identified have a nucleus surrounded by a nuclear membrane. Genetic material is concentrated predominantly in the chromosomes which consist of DNA strands and protein molecules. These cells divide mitotically. Identify these organisms:",["Eukaryotes","Bacteriophages","Prokaryotes","Viruses","Bacteria"],0],["In the life cycle of a cell during mitosis a natural change in the amount of genetic material occurs. The DNA doubles at the following stage:",["Interphase","Prophase","Metaphase","Anaphase","Telophase"],0],["Students study the stages of gametogenesis. They analyze a cell with haploid number of chromosomes, with each chromosome consisting of two chromatids. The chromosomes are located in the equatorial plane of the cell. Such situation is typical of the following stage of meiosis:",["Metaphase of the second division","Metaphase of the first division","Anaphase of the first division","Anaphase of the second division","Prophase of the first division"],0],["At a certain stage of cell cycle chromosomes reach cellular poles, undergo despiralization; nuclear membranes are being formed around them; nucleolus is restored. What stage of mitosis is it?",["Telophase","Prophase","Prometaphase","Metaphase","Anaphase"],0],["Boy-and-girl twins both begin to undergo puberty at age 14. In the development of their reproductive systems, which of the following characteristics is most similar for their respective spermatogenesis and oogenesis?",["Age at which meiosis begins","Amount of cytoplasm retained","DNA replication during meiosis","Length of prophase I","Transmission to fetus of mitochondrial DNA"],2],["Human karyotype is represented by the 22 pairs of autosomes and the 1 pair of sex chromosomes (either XX or XY) totaling 46 chromosomes. The chromosomes of each pair have characteristic size and shape. Thus, the chromosomes have individuality and are recognizable. What is the name of a pair of chromosomes with the same gene loci in the same order of genes?",["Homologous","Telocentric","Acrocentric","Submetacentric","Metacentric"],0],["During the postsynthetic period of mitotic cycle the synthesis of tubulin proteins was disturbed. These proteins take part in construction of division spindle. It can lead to the disturbance of:",["Chromosome disjunction","Spiralization of chromosomes","Cytokinesis","Despiralization of chromosomes","Mitosis duration"],0],["The formation of sex cells and the growth of a young animal into an adult involves cell multiplication. Which of the following statements concerning meiosis is correct?",["Pairing of homologous chromosomes occurs in prophase I of meiosis I","Separation of chromatids occurs during anaphase I of meiosis I","Non disjunction can only occur in meiosis II","Crossing over of genetic material occurs in metaphase I of meiosis I","Pairing of homologous chromosomes occurs in metaphase I of meiosis I"],0],["The growth of a young animal or plant into an adult involves cell multiplication. Cell division is a method by which new cells are originated from pre-existing cells. What function does the centrosome carry out in a dividing cell?",["Forms mitotic spindle","Provides division of cytoplasm","Destroys nuclear envelope","Coils chromosomes","Secretion of proteins"],0],["Двійнята хлопчик і дівчинка досягають статевої зрілості у віці 14 років. У процесі розвитку їх репродуктивної системи, яка з наведених нижче характеристик найбільш схожа на процес сперматогенезу та овогенезу?",["Вік, у якому починається мейоз","Збережена кількість цитоплазми","Реплікація ДНК під час мейозу","Тривалість профази I","Передача плоду мітохондріальної ДНК"],2],["An infant is evaluated for cognitive and physical birth defects. The geneticist suspects a rare genetic disorder that leads to gene duplication due to unequal crossing over during meiosis. This abnormality would most likely occur during the division of which of the following cells?",["Primary spermatocytes","Secondary spermatocytes","Spermatids","Spermatogonia","Spermatozoa"],0],["Дитину оглядають з приводу когнітивних і фізичних вроджених вад. Генетик підозрює рідкісне генетичне порушення, що призводить до подвоєння генів через нерівномірний кросинговер під час мейозу. Під час поділу яких із наступних клітин, скоріше за все, відбудеться ця аномалія?",["Первинних сперматоцитів","Вторинних сперматоцитів","Сперматид","Сперматогоній","Сперматозоїдів"],0]]},{"n":"Заняття №5","q":[["У хлопчика спостерігається велика щілина між різцями. Відомо, що ген, відповідальний за розвиток такої аномалії, домінантний. У рідної сестри цього хлопчика зуби звичайного положення. За генотипом дівчинка буде:",["Дигетерозигота","Гетерозигота","Тригетерозигота","Гомозигота домінантна","Гомозигота рецесивна"],4],["Під час хірургічної операції виникла необхідність масивного переливання крові. Група крові потерпілого III (B) Rh+. Якого донора треба вибрати?",["III (B) Rh+","III (B) Rh−","IV (AB) Rh−","II (A) Rh+","I (O) Rh−"],0],["Жінка з I (0) Rh− групою крові вийшла заміж за чоловіка з IV (AB) Rh+ групою крові. Який варіант групи крові та резус-фактора можна очікувати у дітей?",["I (O) Rh−","III (B) Rh+","IV (AB) Rh+","I (0) Rh+","IV (AB) Rh−"],1],["При всіх формах розмноження (статеве та нестатеве) елементарними дискретними одиницями спадковості є:",["Одна пара нуклеотидів","Один ген","Два ланцюги молекули ДНК","Один нуклеотид","Один ланцюг молекули ДНК"],1],["У клінічно здорових людей в умовах високогір’я виявляються ознаки анемії. При аналізі крові виявляють серповидні клітини. Який генотип цих людей?",["X^C X^C","X^C X^c","Aa","AA","aa"],2],["При яких групах крові батьків за системою резус можлива резус-конфліктна ситуація під час вагітності?",["Жінка Rh+, чоловік Rh+ (гетерозигота)","Жінка Rh−, чоловік Rh−","Жінка Rh+, чоловік Rh− (гомозигота)","Жінка Rh−, чоловік Rh+ (гомозигота)","Жінка Rh+ (гетерозигота), чоловік Rh+ (гомозигота)"],3],["Резус-негативна жінка з I групою крові вийшла заміж за резус-позитивного чоловіка з IV групою крові. В якому випадку можливий розвиток у новонародженого гемолітичної хвороби?",["Дитина резус-позитивна","Дитина резус-негативна","Батько жінки гетерозиготний за геном резус-фактора","Батько жінки гомозиготний за геном резус-фактора","Жодна відповідь не відповідає умові"],0],["У жінки з III (B), Rh− групою крові народилась дитина з II (A) групою крові. У дитини діагностовано гемолітичну хворобу новонародженого внаслідок резус-конфлікту. Яка група крові за системою AB0 та резус-належність можливі у батька?",["II (A), Rh+","I (0), Rh+","III (B), Rh+","I (0), Rh−","II (A), Rh−"],0],["У хлопчика I (I^O I^O) група крові, а в його сестри IV (I^A I^B). Які групи крові у батьків цих дітей?",["II (I^A I^O) та III (I^B I^O)","II (I^A I^A) та III (I^B I^O)","I (I^O I^O) та IV (I^A I^B)","III (I^B I^O) та IV (I^A I^B)","I (I^O I^O) та III (I^B I^O)"],0],["Фенілкетонурія – це захворювання, яке зумовлено рецесивним геном, що локалізується в аутосомі. Батьки є гетерозиготами за цим геном. Вони вже мають двох хворих синів і одну здорову доньку. Яка імовірність, що четверта дитина, яку вони очікують, народиться теж хворою?",["25%","0%","50%","75%","100%"],0],["У батьків, хворих на гемоглобінопатію (аутосомно-домінантний тип успадкування), народилася здорова дівчинка. Які генотипи батьків?",["Обоє гетерозиготні за геном гемоглобінопатії","Мати гетерозиготна за геном гемоглобінопатії, у батька цей ген відсутній","Обоє гомозиготні за геном гемоглобінопатії","Батько гетерозиготний за геном гемоглобінопатії, у матері цей ген відсутній","У обох батьків ген гемоглобінопатії відсутній"],0],["Фенілкетонурія успадковується як аутосомно-рецесивна ознака. У здорових батьків народилася дитина, хвора на фенілкетонурію. Які генотипи батьків?",["Aa × Aa","AA × AA","AA × Aa","Aa × aa","aa × aa"],0],["Альбінізм успадковується як аутосомна рецесивна ознака. У родині, де обоє батьків здорові, народилася дитина-альбінос. Яка ймовірність народження здорової дитини у цієї пари?",["75%","50%","100%","25%","10%"],0],["Цитогенетичні основи другого закону Г. Менделя говорять про те, що гібриди першого покоління F1 (Аа) при мейозі утворюють яйцеклітини та спермії двох типів – А та а, поєднання яких при схрещуванні дає три типи зигот: АА, Аа, аа. Чому не може бути одноманітності гібридів у F2?",["Тому що в основі закону розщеплення лежить закон чистоти гамет","Тому що відбувається кросинговер","Тому що спостерігається повне домінування","Тому що в основі закону розщеплення лежить дигібридне схрещування","Тому що спостерігається кодомінування"],0],["У медико-генетичну консультацію звернулася вагітна жінка, у якої є 5-річна дочка з галактоземією (аутосомно-рецесивне захворювання з повною пенетрантністю). За допомогою УЗД визначено чоловічу стать плода. Вагітна жінка та її чоловік не страждають цим захворюванням. Яка ймовірність народження дитини, хворої на галактоземію, в результаті даної вагітності?",["25%","0%","50%","75%","100%"],0],["У жінки з резус-негативною кров’ю А (II) групи народилася дитина з АВ (IV) групою, у якої діагностували гемолітичну хворобу внаслідок резус-конфлікту. Яка група крові можлива у батька дитини?",["III (B), резус-позитивна","I (0), резус-позитивна","II (A), резус-позитивна","IV (AB), резус-негативна","III (B), резус-негативна"],0],["У гетерозиготних батьків з А (II) і В (III) групами крові за системою АВ0 народилась дитина. Яка імовірність наявності у неї 0 (I) групи крові?",["100%","0%","50%","75%","25%"],4],["Аналізуються діти в одній сім’ї. Один з батьків гомозиготний по домінантному гену полідактилії, а другий – здоровий (гомозиготний по рецесивному гену). У цьому випадку у дітей проявиться закон:",["Одноманітності гібридів першого покоління","Зчеплене успадкування","Чистоти гамет","Розщеплення гібридів","Незалежного спадкування"],0],["У одного з батьків запідозрили носійство рецесивного гена фенілкетонурії. Який ризик народження у цій сім’ї дитини, хворої на фенілкетонурію?",["0%","25%","50%","75%","100%"],0],["A woman with III (B), Rh− blood group has a child with II (A) blood group. The child is diagnosed with hemolytic disease of newborn as a result of rhesus incompatibility. What blood group is the child’s father likely to have?",["II (A), Rh+","I (0), Rh+","III (B), Rh+","I (0), Rh−","II (A), Rh−"],0],["A boy has I (I^O I^O) blood group and his sister has IV (I^A I^B) blood group. What blood groups do their parents have?",["I (I^O I^O) and IV (I^A I^B)","I (I^O I^O) and III (I^B I^O)","III (I^B I^O) and IV (I^A I^B)","II (I^A I^O) and III (I^B I^O)","II (I^A I^A) and III (I^B I^O)"],3],["A family of students who came from Africa got a child with anemia signs. The child died soon. Examination revealed the child’s erythrocytes have abnormal semilunar shape. What are the genotypes of the child’s parents?",["AA × AA","Aa × aa","Aa × AA","Aa × Aa","aa × aa"],3],["One of the parents is suspected of having inborn phenylketonuria, if the other is heterozygous for this gene. What is the risk of giving birth to a child with this pathology?",["75%","25%","50%","100%","0%"],2],["A wide cleft between incisors of both mother and father is the dominant feature. They are both homozygous. What genetic regularity will their children have?",["Uniformity of first generation hybrids","Hybrid segregation by phenotype","Independent inheritance of feature","Non-linked inheritance","Linked inheritance"],0],["Heterozygous parents with A(II) and B(III) blood group according to the AB0 system have got a child. What is the probability that the child has 0(I) blood group?",["25%","100%","75%","50%","0%"],0],["Premolar teeth absence is inherited as an autosomal dominant factor. Heterozygous parents give birth to a child with premolar teeth absence. What is the probability of giving birth to children with this pathology (%) in this family?",["75%","50%","25%","12,5%","0%"],0],["Phenylketonuria is a disease caused by a recessive gene that is localized in the autosome. The parents are heterozygous for this gene. They already have two sons with phenylketonuria and one healthy daughter. What is the probability that their fourth child will have the disease too?",["25%","0%","50%","75%","100%"],0],["A woman with A (II), Rh-negative blood had a child with B (III), Rh-positive blood. The child was diagnosed with congenital anaemia of newborns. What is the most likely cause of its development?",["Rhesus incompatibility","Hereditary chromosomal pathology","AB0-incompatibility","Intrauterine intoxication","Intrauterine infection"],0],["A girl is diagnosed with primary microcephaly that is a monogenic autosomal recessive disease. Her natural brother develops normally. What genotypes do the parents of these children have?",["Aa × Aa","AA × AA","aa × aa","AA × aa","AABB × AABB"],0],["Examination of newborns in one of the Ukrainian cities revealed a baby with phenylketonuria. The baby’s parents don’t suffer from this disease and have two other healthy children. Specify the most likely parents’ genotype with phenylketonuria gene:",["Aa × Aa","AA × aa","aa × aa","Aa × aa","Aa × AA"],0],["Both of the parents are suspected of having phenylketonuria recessive gene. What is the risk of giving birth to a child with inborn phenylketonuria?",["75%","25%","50%","100%","0%"],1],["An underage patient has signs of achondroplasia (dwarfism). It is known that this is a monogenic disease and the gene that is responsible for the development of such abnormalities is a dominant one. The development of that child’s brother is normal. Specify the genotype of the healthy child:",["aa","AA","Aa","AaBb","AABB"],0],["A person with the fourth blood group (genotype I^A I^B) has in erythrocytes both antigen A controlled by allele I^A and antigen B controlled by allele I^B. This phenomenon is an example of the following gene interaction:",["Codominance","Complementarity","Semidominance","Polymery","Epistasis"],0],["Cystinuria manifests itself in a human as cystine stones in the kidneys (homozygous individuals) or increased cystine content in the urine (heterozygous individuals). Cystinuria is a monogenic disorder. Determine the type of interaction between the genes of cystinuria and normal urine cystine excretion:",["Incomplete dominance","Epistasis","Complete dominance","Complementarity","Codominance"],0],["A 25-year-old woman at her third pregnancy with impending miscarriage was brought to the hospital. What combination of Rh-factor of the mother and the fetus can be the cause of this condition?",["Mother Rh (−), fetus Rh (+)","Mother Rh (−), fetus Rh (−)","Mother Rh (+), fetus Rh (−)","Mother Rh (+), fetus Rh (+)","Mother Rh (+), father Rh (+)"],0],["A female with Rh-negative blood of A (II) type has a child with AB (IV) type who has been diagnosed with hemolytic disease resulting from Rh-conflict. What blood type may the baby’s father have?",["III (B), Rh-positive","I (0), Rh-positive","II (A), Rh-positive","IV (AB), Rh-negative","III (B), Rh-negative"],0],["Three common alleles for the same gene of 9 chromosome control the inheritance of 4 ABO blood types. These alleles determine the presence or absence of antigens on the surface of the red blood cells (RBC). What is a name of this condition where a single characteristic may appear in several different forms controlled by three or more alleles?",["Multiple alleles","Superdominance","Incomplete dominance","Codominance","Epistasis"],0]]},{"n":"Заняття №6","q":[["У жінки, що має 0 (I) групу крові, народилася дитина з групою крові АВ. Чоловік цієї жінки має групу крові А. Які з наведених нижче видів взаємодії генів пояснюють це явище?",["Епістаз рецесивний","Кодомінування","Полімерія","Неповне домінування","Комплементарність"],0],["У хворого в анамнезі відмічено тривалий ріст кінцівок, видовжені «павукові» пальці, підвивих кришталика ока, аномалії серцево-судинної системи. Інтелект в нормі. Які фенотипічні ознаки ще можуть бути у цього хворого?",["Плоске обличчя та широке перенісся","Недорозвинення нижньої щелепи","Недорозвинення гонад","Порушення розвитку сполучної тканини","Розщеплення м’якого та твердого піднебіння"],3],["Неспецифічне успадкування крові, відоме як «бомбейський феномен», зумовлене:",["Рецесивним епістазом","Кодомінуванням","Комплементарністю","Домінуванням","Домінантним епістазом"],0],["У юнака 18-ти років діагностовано хворобу Марфана. При дослідженні встановлено порушення розвитку сполучної тканини, будови кришталика ока, аномалії серцево-судинної системи, арахнодактилію. Прикладом якого генетичного явища є ця хвороба?",["Плейотропія","Комплементарність","Кодомінування","Множинний алелізм","Неповне домінування"],0],["У чоловіка діагностовано спадкове захворювання – арахнодактилію. Відомо, що ген, який відповідає за виникнення цієї хвороби, викликає порушення розвитку сполучної тканини, зміни будови кришталика ока, аномалії органів серцево-судинної системи. Про який тип взаємодії генів можна говорити у даному випадку?",["Плейотропна дія гена","Комплементарність","Домінантний епістаз","Рецесивний епістаз","Полімерія"],0],["Відомо, що у представників негроїдної раси темну шкіру визначають переважно домінантні алелі, а у представників європеоїдної раси – здебільшого рецесивні. Мулати мають проміжну пігментацію, але при шлюбах мулатів у них можлива поява як більш, так і менш пігментованих нащадків. Прояв якого типу взаємодії генів спостерігається у даному випадку?",["Полімерія","Комплементарність","Домінантний епістаз","Рецесивний епістаз","Плейотропна дія гена"],0],["Хвороба Хартнупа зумовлена точковою мутацією лише одного гена, наслідком чого є порушення всмоктування амінокислоти триптофану в кишечнику та реабсорбції її в канальцях нирок. Це призводить до одночасних розладів у травній і сечовидільній системах. Яке генетичне явище спостерігається в цьому випадку?",["Плейотропія","Комплементарна взаємодія","Полімерія","Кодомінування","Неповне домінування"],0],["Ріст людини контролюється декількома парами незчеплених генів, причому дуже низькорослі – гомозиготи домінантні, найвищі – гомозиготи рецесивні. До якого типу відносять це явище?",["Полімерія","Плейотропія","Кодомінування","Наддомінування","Комплементарність"],0],["У дитини, хворої на серповидно-клітинну анемію, спостерігається кілька патологічних ознак: анемія, збільшення селезінки, ураження шкіри, серця, нирок і мозку. Як називається множинна дія одного гена?",["Плейотропія","Епістаз","Полімерія","Кодомінування","Комплементарність"],0],["Біохіміки встановили, що гемоглобін дорослої людини містить 2 альфа- і 2 бета-поліпептидні ланцюги. Гени, що кодують ці ланцюги, розміщені в різних парах гомологічних хромосом. Яка форма взаємодії спостерігається між генами?",["Епістаз","Комплементарність","Полімерія","Наддомінування","Повне домінування"],1],["Інтенсивність пігментації шкіри в людини контролюють кілька незалежних домінантних генів. Встановлено, що при збільшенні кількості цих генів пігментація стає інтенсивнішою. Який тип взаємодії між цими генами?",["Полімерія","Плейотропія","Епістаз","Кодомінування","Комплементарність"],0],["У юнака 18-ти років діагностована м’язова дистрофія. Підвищення в сироватці крові вмісту якої речовини найбільш імовірне при цій патології?",["Креатинін","Міоглобін","Міозин","Лактат","Аланін"],0],["A woman with 0 (I) blood group has born a child with AB blood group. This woman’s husband has A blood group. What genetic interaction explains this phenomenon?",["Incomplete dominance","Codominance","Polymery","Recessive epistasis","Complementation"],3],["Hartnup disease is caused by point mutation of only one gene which results in disturbance of tryptophane absorption in the bowels and its resorption in the renal tubules. It is the reason for disorder of both digestive and urination systems. What genetic phenomenon is observed?",["Codominance","Pleiotropy","Polymery","Semidominance","Complementary interaction"],1],["Pigmentation intensity of human skin is controlled by a few independent dominant genes. It is known that pigmentation is the more intensive, the bigger quantity of these genes. What is the type of interaction between these genes?",["Polymery","Pleiotropy","Epistasis","Codominancy","Complementarity"],0],["Human X chromosome contains a dominant gene that is responsible for normal blood clotting. An autosomal dominant gene plays a similar role. Lack of any of these genes leads to the coagulation disorder. The form of interaction between these genes is called:",["Complementarity","Epistasis","Polymerism","Codominance","Pleiotropy"],0],["The height of a person is controlled by several non-allelic dominant genes. If the number of these genes is increased, the height of a person increases as well. What type of interaction occurs between these genes?",["Polymery","Epistasis","Pleiotropy","Codominance","Complementarity"],0],["An 18-year-old male has been diagnosed with Marfan syndrome. Examination revealed a developmental disorder of connective tissue and eye lens structure, abnormalities of the cardiovascular system, arachnodactylia. What genetic phenomenon caused the development of this disease?",["Pleiotropy","Complementarity","Codominance","Multiple allelism","Incomplete dominance"],0],["Deaf parents with genotypes DDee and ddEE gave birth to a child with normal hearing. Specify the interaction of D and E genes:",["Complementary interaction","Complete dominance","Epistasis","Polymery","Overdominance"],0],["Котре з перерахованих нижче є зчепленим з Х-хромосомою рецесивним захворюванням?",["Гостра порфірія","М’язова дистрофія Дюшена","Хвороба Хантінгтона","Синдром Марфана"],1],["For normal hearing two dominant alleles (D and E) are required. Gene D controls the acoustic nerve. Gene E controls cochlea. What is the type of interaction between these genes?",["Complementarity","Incomplete dominance","Complete dominance","Epistasis","Codominance"],0],["A woman was diagnosed with arachnodactylia, which is a hereditary disease. The gene that is responsible for the occurrence of this disease causes developmental disorders of connective tissue, changes in the structure of the eye lens, anomalies of the organs of the cardiovascular system. What type of gene interaction is in question in this case?",["Pleiotropy","Complementarity","Dominant epistasis","Recessive epistasis","Polymery"],0],["It is known that people with dark skin determined mainly by a dominant allele, and the people with light skin – mostly recessive. Mulattos have an intermediate pigmentation. When the marriage of the mulattos happened, may appear as more or less pigmented child. The manifestation of what type of gene interaction is observed in this case?",["Polymery","Complementarity","Dominant epistasis","Recessive epistasis","Pleiotropy"],0],["A 25-year-old woman has mild expression of hemophilia A. A genetic diagnosis reveals that she is a heterozygous carrier of a mutation in the X-linked factor VIII gene. What is the most likely explanation for mild expression of the disease in this individual?",["A high proportion of the X chromosomes carrying the mutation are active in this woman","Her father is affected, and her mother is a heterozygous carrier","Nonsense mutation causing truncated protein","One of her X chromosomes carries the SRY gene","X inactivation does not affect the entire chromosome"],0],["In assessing a patient with osteogenesis imperfecta, a history of bone fractures, as well as blue sclerae, are noted. These findings are an example of:",["Allelic heterogeneity","Gain-of-function mutation","Locus heterogeneity","Multiple mutations","Pleiotropy"],4]]},{"n":"Заняття №7","q":[["У п’ятирічної дитини діагностовано міопатію Дюшена. Батьки здорові. Дядько дитини і син тітки за материнською лінією також хворі на міопатію. Визначте тип успадкування захворювання.",["Рецесивний, зчеплений з Y-хромосомою","Автосомно-домінантний","Рецесивний, зчеплений з Х-хромосомою","Автосомно-рецесивний","Домінантний, зчеплений з Х-хромосомою"],2],["У медико-генетичну консультацію звернулася жінка з приводу захворювання на гемофілію у свого сина. Її чоловік страждає на дане захворювання з народження. Жінка та її батьки здорові стосовно гемофілії. Яка вірогідність появи хвороби у хлопчика в даній сім’ї?",["Всі хлопчики будуть здорові","25% хлопчиків будуть хворими","75% хлопчиків будуть хворими","50% хлопчиків будуть хворими","Всі хлопчики будуть хворі"],0],["Надмірне оволосіння вушних раковин (гіпертрихоз) визначається геном, локалізованим у Y-хромосомі. Цю ознаку має батько. Яка вірогідність народження хлопчика з такою аномалією?",["100%","0%","25%","35%","75%"],0],["До медико-генетичної консультації звернулася жінка з приводу оцінки ризику захворювання гемофілією у її дітей. Її чоловік страждає гемофілією. Під час збору анамнезу виявилося, що у сім’ї жінки не було випадків гемофілії. Яка ймовірність народження хворої дитини?",["Відсутня","25%","50%","75%","100%"],0],["У людини відсутність потових залоз кодується рецесивним геном, локалізованим в Х-хромосомі. У медико-генетичну консультацію звернулося майбутнє подружжя: здоровий юнак одружується з дівчиною, батько якої страждав на відсутність потових залоз, а мати та її родичі були здорові. Яка імовірність прояву даної ознаки в синів від цього шлюбу?",["50%","100%","75%","25%","0%"],0],["До медико-генетичної консультації звернулася жінка з приводу ризику захворювання на гемофілію у свого сина. Її чоловік страждає на це захворювання від народження. Жінка та її родичі не страждали на це захворювання. Визначте вірогідність народження хлопчика з гемофілією у цій сім’ї.",["0%","100%","50% хлопчиків будуть хворими","25% хлопчиків будуть хворими","75% хлопчиків будуть хворими"],0],["До медико-генетичної консультації звернулося подружжя з питаннями про вірогідність народження у них дітей, хворих на гемофілію. Подружжя здорове, але батько дружини хворий на гемофілію. В цій родині на гемофілію можуть захворіти:",["Половина синів","Сини та дочки","Тільки дочки","Половина дочок","Всі діти"],0],["Закон незалежного комбінування ознак, встановлений Г. Менделем, проявляється за умови, якщо гени досліджуваних ознак знаходяться в різних парах хромосом. Проте число генів значно перевищує число хромосом. Отже, в одній хромосомі локалізовано багато генів. Як називаються гени, які розташовані в одній хромосомі?",["Зчеплені","Споріднені","Рецесивні","Гомологічні","Домінантні"],0],["Дуже великі зуби – ознака, зчеплена з Y-хромосомою. У матері зуби нормальної величини, а у її сина – дуже великі. Яка буде вірогідність наявності дуже великих зубів у батька?",["100%","50%","75%","12,5%","25%"],0],["До медико-генетичної консультації звернувся чоловік з кольоровою сліпотою. Дальтонізм – це зчеплена з Х-хромосомою рецесивна ознака. Яка імовірність появи в його родині дітей-дальтоників, якщо в генотипі його дружини такий алель відсутній?",["0%","25%","50%","75%","100%"],0],["Вітамін D-резистентний рахіт визначається домінантним геном, який локалізований в Х-хромосомі. Який генотип має здоровий хлопчик у родині, де мати здорова, а у батька діагностовано дану форму рахіту?",["XᵃY","Aa","aa","XᴬY","AA"],0],["У медико-генетичну консультацію звернулася вагітна жінка, якій за допомогою УЗД визначено чоловічу стать плода. Чоловік пацієнтки страждає гемофілією, у родині пацієнтки хворих на гемофілію не було. Яка ймовірність народження хворої на гемофілію дитини в результаті даної вагітності?",["0%","25%","50%","75%","100%"],0],["A woman applied to the medico-genetic consulting center for information about the risk of hemophilia in her son. Her husband has been suffering from this disease since birth. The woman and her parents are healthy (don’t have hemophilia). Is the boy likely to have the disease in this family?",["25% of the boys will be ill","All boys will be ill","All boys will be healthy","50% of the boys will be ill","75% of the boys will be ill"],2],["A couple came for medical genetic counseling. The man has hemophilia, the woman is healthy and there were no cases of hemophilia in her family. What is the risk of having a sick child in this family?",["100%","50%","75%","25%","0%"],4],["The study of the genealogy of a family with hypertrichosis (helix excessive pilosis) demonstrated that this feature is manifested in all generations only in men and is inherited by son from his father. What is the type of the hypertrichosis inheritance?",["X-linked recessive chromosome","X-linked dominant chromosome","Y-linked chromosome","Autosome-recessive","Autosome-dominant"],2],["Excessive hairiness of auricles (hypertrichosis) is determined by a gene which is localized in Y-chromosome. Father has this feature. What is the probability of the fact that the boy will be born with such anomaly?",["100%","0%","25%","35%","75%"],0],["Very big teeth is a Y-linked sign. Mother’s teeth are of normal size, and her son’s teeth are very big. Probability of father’s having very large teeth is:",["100%","75%","50%","25%","12,5%"],0],["A married couple consulted a specialist at the genetic consultation about probability of having children with hemophilia. Both spouses are healthy, but the wife’s father has hemophilia. In this family hemophilia may be passed to:",["Half of sons","Both sons and daughters","Daughters only","Half of daughters","All the children"],0],["Hypertrichosis is the Y-linked character. The father has hypertrichosis, and the mother is healthy. In this family, the probability of having a child with hypertrichosis is:",["0,5","0,25","0,125","0,625","1"],0],["Which of the following is an X-linked recessive disease?",["Acute intermittent porphyria","Duchenne muscular dystrophy","Huntington disease","Marfan syndrome"],1],["Котре з перерахованих нижче є зчепленим з Х-хромосомою рецесивним захворюванням?",["Гостра порфірія","М’язова дистрофія Дюшена","Хвороба Хантінгтона","Синдром Марфана"],1],["A couple has a son with haemophilia. The parents are healthy but the maternal grandfather also has haemophilia. Specify the type of inheritance.",["Recessive sex-linked","Recessive autosomal","Dominant sex-linked","Semidominance","Autosomal dominant"],0],["Genes, which are situated in the same chromosome form a group of linkage. The number of linkage groups is equal to the haploid set of chromosomes. How many groups of linkage are there in a healthy woman?",["23","22","2","24","46"],0],["The albino woman with normal blood clotting and I (O) group applied to the genetic consultation office. Which of these genotypes are the most possible for this woman?",["aa ii X^H X^H","Aa I^A i X^H X^H","aa I^A I^A X^h X^h","AA ii X^H X^h","AA I^A I^B X^H X^H"],0],["In human embryos, the undifferentiated gonad has the potential of developing either into a testis or an ovary. Determination of the developmental pathway depends on a male inducer associated with the short arm of the Y chromosome. If this gene is absent, the gonad becomes an ovary and female structures develop. What is the name of the gene for sex differentiation during embryonic development in human?",["SRY","ZW","XY","TDF","ABO"],0],["A 25-year-old woman has mild expression of hemophilia A. A genetic diagnosis reveals that she is a heterozygous carrier of a mutation in the X-linked factor VIII gene. What is the most likely explanation for mild expression of the disease in this individual?",["A high proportion of the X chromosomes carrying the mutation are active in this woman","Her father is affected, and her mother is a heterozygous carrier","Nonsense mutation causing truncated protein","One of her X chromosomes carries the SRY gene","X inactivation does not affect the entire chromosome"],0],["У 25-річної жінки спостерігається легка форма гемофілії А. Виявлено, що вона є гетерозиготним носієм мутації в Х-зв’язаному гені фактора VIII. Яке найімовірніше пояснення легкого прояву захворювання у даної особи?",["Висока частка Х-хромосом, що несуть мутацію, активна у цієї жінки","Хворим є її батько, і її мати є гетерозиготним носієм","Нонсенс-мутації, що викликають синтез вкороченого білка","Одна з її Х-хромосом несе ген SRY","Інактивація не впливає на всю хромосому"],0],["A man who is affected with hemophilia A (X-linked recessive) mates with a woman who is a heterozygous carrier of this disorder. What proportion of this couple’s daughters will be affected, and what proportion of the daughters will be heterozygous carriers?",["0%; 50%","100%; 0%","0%; 100%","50%; 50%","2/3; 1/3"],3],["Чоловік, який страждає гемофілією А (рецесивною Х-зчепленою хворобою), одружився із жінкою, яка є гетерозиготним носієм цього гена. Яка кількість дочок цієї пари буде хворою і яку частину становитимуть дочки – гетерозиготні носії?",["0%; 50%","100%; 0%","0%; 100%","50%; 50%","2/3; 1/3"],3],["A 25-year-old woman who is 19 weeks pregnant comes to the office for a prenatal examination. Her father had classic hemophilia. A karyotype obtained from an amniotic fluid sample of the patient shows that the fetus is XY. Which of the following should you tell the patient regarding her infant?",["The infant will neither have hemophilia nor be a carrier","The infant has a 50% risk for hemophilia","The infant has a 50% risk for being a carrier","The infant has a 75% risk for hemophilia","The infant has a 75% risk for being a carrier"],1],["25-річна жінка, яка має 19 тижнів вагітності, приходить до лікарні для проведення пренатального обстеження. У її батька була класична гемофілія. Каріотип, отриманий з проби амніотичної рідини пацієнтки, показує, що плід XY. Що з наведеного нижче ви скажете пацієнтці щодо немовляти?",["Дитина не матиме гемофілії та не є носієм","Ризик становить 50% для розвитку гемофілії","Дитина має 50% ризику бути носієм","Дитина має ризик розвитку гемофілії 75%","Дитина має 75% ризику, що вона є носієм"],1]]},{"n":"Заняття №8","q":[["Вади розвитку плода можуть бути наслідками таких хвороб матері, як краснуха, сифіліс, токсоплазмоз, цитомегалія, герпес, хламідіоз. До якої форми мінливості належать такі вади розвитку?",["Модифікаційна","Комбінативна","Мутаційна","Епімутаційна","Геномного імпринтингу"],0],["При дії ультрафіолетових променів у людини темніє шкіра, що є захисною реакцією. Яка захисна речовина синтезується в клітинах шкіри під впливом вказаного фактора?",["Аргінін","ДНК","Вітамін Д","Триптофан","Меланін"],4],["У матерів, які перенесли під час вагітності деякі хвороби (токсоплазмоз, краснуха), велика ймовірність народження дітей з вадами та каліцтвами (вовча паща, заяча губа та ін.). Проявом чого це є?",["Фенокопії","Генокопії","Геномні мутації","Хромосомні мутації","Генні мутації"],0],["Внаслідок впливу гамма-випромінювання ділянка ланцюга ДНК повернулась на 180°. Який з перелічених видів мутацій відбувся в ланцюзі ДНК?",["Інверсія","Делеція","Дуплікація","Транслокація","Реплікація"],0],["Внаслідок дії гамма-випромінювання на послідовність нуклеотидів ДНК загублені 2 нуклеотиди. Який з перелічених видів мутацій відбувся в ланцюзі ДНК?",["Делеція","Дуплікація","Інверсія","Транслокація","Реплікація"],0],["Після дії мутагену в метафазній пластинці людини виявлено відсутність трьох хромосом у каріотипі. До чого належить вказана мутація?",["Інверсія","Політенія","Поліплоїдія","Анеуплоїдія","Транслокація"],3],["Зміни хімічної структури гена можуть виникати в різних його ділянках. Якщо такі зміни сумісні з життям, тобто не призводять до загибелі організмів, то вони зберігаються в генофонді виду. Як називають різні варіанти одного гена?",["Множинні алелі","Фенокопії","Генокопії","Цистрони","Плазміди"],0],["Фенілкетонурія є спадковою хворобою, що зумовлена точковою мутацією. Це зміна:",["Молекулярної структури гена","Кількості хромосом у диплоїдному наборі","Кількості хромосомних наборів","Структури хромосоми","Числа генів"],0],["При цитогенетичному дослідженні в клітинах абортованого ембріона виявлено 44 хромосоми, відсутність обох хромосом третьої пари. Яка мутація відбулась:",["Нулісомія","Хромосомна аберація","Генна (точкова)","Полісомія","Моносомія"],0],["У 50-х роках у Західній Європі від матерів, які приймали як снотворне талідомід, народилося кілька тисяч дітей з відсутністю або недорозвиненням кінцівок, порушенням будови скелета, іншими вадами. Яка природа даної патології?",["Фенокопія","Трисомія","Моносомія","Триплоїдія","Генна мутація"],0],["При дослідженні хромосомного набору дівчинки з помітними психічними вадами виявлено скорочення плеча 20 хромосоми. Як називається цей вид мутації?",["Делеція","Дуплікація","Інверсія","Транслокація","Радіація"],0],["У районах Південної Африки у людей розповсюджена серпоподібно-клітинна анемія, при якій еритроцити мають форму серпа внаслідок заміни в молекулі гемоглобіну амінокислоти глутаміну на валін. Чим викликана ця хвороба?",["Генна мутація","Порушення механізмів реалізації генетичної інформації","Кросинговер","Геномні мутації","Трансдукція"],0],["Тривале вживання деяких лікарських засобів, що передують вагітності, збільшує ризик народження дитини з генетичними вадами. Як називається ця дія?",["Мутагенний ефект","Ембріотоксичний ефект","Тератогенний ефект","Фетотоксичний ефект","Бластомотоксичний ефект"],0],["Батьки – глухонімі, але глухота у дружини залежить від аутосомно-рецесивного гена, а у чоловіка виникла внаслідок тривалого прийому антибіотиків у дитинстві. Яка імовірність народження глухої дитини в родині, якщо батько гомозиготний за алелею нормального слуху?",["0%","10%","25%","75%","100%"],0],["Юнак 15-ти років скаржиться на загальну слабкість, запаморочення, швидку стомлюваність. При обстеженні виявлено еритроцити зміненої форми, кількість їх знижена. Попередній діагноз: серпоподібноклітинна анемія. Який тип мутації зумовлює розвиток цього патологічного стану?",["Точкова мутація","Мутація зсуву рамки зчитування","Делеція","Інверсія","Хромосомна аберація"],0],["У 50-х роках у Західній Європі від матерів, які приймали як снотворний препарат талідомід, народилася кілька тисяч дітей з відсутністю або недорозвитком кінцівок, порушенням будови скелета, іншими вадами. Яка природа даної патології?",["Тератогенна дія","Генна мутація","Трисомія","Моносомія","Триплоїдія"],0],["В ділянці хромосоми гени розташовані в такій послідовності: ABCDEFG. В результаті дії радіоактивного випромінювання відбулася перебудова, після чого ділянка хромосоми має наступний вигляд: ABDEFG. Назвіть вид мутації:",["Делеція","Інверсія","Дуплікація","Транспозиція","Транслокація"],0],["При дослідженні каріотипу 5-річної дівчинки виявлено 46 хромосом. Одна з хромосом 15-ї пари довша від звичайної, тому що до неї приєдналась хромосома з 21-ї пари. Який вид мутації має місце у цієї дівчинки?",["Поліплоїдія","Інверсія","Дуплікація","Делеція","Транслокація"],4],["Під час гаметогенезу в мейозі відбулося нерозходження хромосом 21 пари до полюсів клітини. Утворилися овоцити із 24 та 22 хромосомами. Який це вид мутації?",["Генеративна","Соматична","Тетрасомія","Поліплоїдія","Генна"],0],["У ділянці хромосоми гени розташовані у такій послідовності: abcdef. Після перебудови ділянка хромосоми має наступний вигляд: abedcf. Про який вид мутації йдеться?",["Інверсія","Делеція","Дуплікація","Симетрична транслокація","Асиметрична транслокація"],0],["Відомо, що аскорбінова кислота підсилює дію циклофосфаміду, збільшуючи пошкодження ДНК у культурі лейкоцитів людини. Як у цьому випадку можна назвати вітамін С?",["Комутагеном","Мутагеном","Антимутагеном","Фенокопією","Генокопією"],0],["Мутації часто впливають на життєздатність та якість життя людини. Так, втрата ділянки 21-ї хромосоми викликає розвиток гострого лейкозу. Як називається дана мутація?",["Летальна","Напівлетальна","Стерильна","Ембріональна","Генеративна"],0],["Мультифакторіальні захворювання, до яких відносять цукровий діабет, гіпертонічну хворобу, виразкову хворобу шлунка, атеросклероз, ішемічну хворобу серця, бронхіальну астму, посідають одне з провідних місць серед хронічних неінфекційних хвороб людини. Які фактори впливають на механізм розвитку даних захворювань?",["Спадковість, вплив навколишнього середовища","Генетичні","Зовнішнього середовища","Медикаменти","Мінливість"],0],["До розвитку певних спадкових хвороб призводять міссенс- і нонсенс-мутації, інсерції, а також мутації, що призводять до порушення процесів сплайсингу. До якої групи мутацій належать вказані зміни генетичного апарату?",["Генні","Геномні","Хромосомні аберації","Трисомії","Моносомії"],0],["Дієтотерапія може запобігти клінічному прояву ряду спадкових хвороб (фенілкетонурія, галактоземія тощо) або полегшити їх перебіг. Яка форма мінливості проявляється при такому лікуванні?",["Модифікаційна","Корелятивна","Комбінативна","Спадкова","Мутаційна"],0],["У пацієнта для підтвердження діагнозу лімфоми Беркітта було проведене цитогенетичне дослідження. Виявлено перенесення локусу гена, розташованого у хромосомі 8, на хромосому 14. Така мутація називається:",["Делеція","Анеуплоїдія","Дуплікація","Інверсія","Транслокація"],4],["У здорових батьків народився син із фенілкетонурією, але завдяки спеціальній дієті дитина розвивалась нормально. З якими формами мінливості пов’язані його хвороба та одужання?",["Хвороба – з рецесивною мутацією, одужання – з комбінативною мінливістю","Хвороба – з домінантною мутацією, одужання – з модифікаційною мінливістю","Хвороба – з рецесивною аутосомною мутацією, одужання – з модифікаційною мінливістю","Хвороба – з комбінативною мінливістю, одужання – з генокопією","Хвороба – з хромосомною мутацією, одужання – з фенотиповою мінливістю"],2],["У мешканців Закарпаття внаслідок дефіциту йоду в харчових продуктах і воді часто зустрічається ендемічний зоб. Який вид мінливості спричиняє таке захворювання?",["Модифікаційна","Мутаційна","Співвідносна","Комбінативна","Онтогенетична"],0],["Зареєстровано народження дитини з такими аномаліями: розщеплення верхньої губи та піднебіння, дефекти органів серцево-судинної системи, мікроцефалія. Каріотип дитини: 2n = 46. Під час вивчення історії хвороби породіллі з’ясувалося, що в період вагітності вона перехворіла на краснуху. Прикладом чого може бути патологія, що виникла у дитини?",["Трисомії 13-ї хромосоми","Трисомії 21-ї хромосоми","Моносомії","Фенокопії","Трисомії 18-ї хромосоми"],3],["Дитина народилася з багатьма вадами розвитку: незрощення верхньої губи і піднебіння, мікрофтальмія, синдактилія, вади серця, нирок. Вона померла у віці одного місяця. Під час каріотипування у неї виявлено: 47,XX,13+. Який вид мутації спричинив це захворювання?",["Поліплоїдія","Дуплікація","Інверсія","Трисомія","Транслокація"],3],["Вживання тетрациклінів у першій половині вагітності призводить до виникнення аномалій органів і систем плода, в тому числі до гіпоплазії зубів, зміни їх кольору. До якого виду мінливості належить захворювання дитини?",["Модифікаційна","Комбінативна","Мутаційна","Спадкова","Рекомбінантна"],0],["Лікар виявив у дитини рахіт, зумовлений нестачею вітаміну D, але за своїм проявом подібний до спадкового вітаміностійкого рахіту (викривлення трубчастих кісток, деформація суглобів нижніх кінцівок, зубні абсцеси). Як називаються вади розвитку, які нагадують спадкові, але не успадковуються?",["Фенокопії","Генокопії","Моносомії","Трисомії","Генні хвороби"],0],["Відомо, що ген, відповідальний за розвиток груп крові системи MN, має два алельних стани. Якщо ген М вважати вихідним, то поява алельного йому гена N відбулася внаслідок:",["Мутації","Комбінації генів","Репарації ДНК","Реплікації ДНК","Кросинговеру"],0],["У клітині відбулася мутація першого екзону структурного гена. В ньому зменшилася кількість пар нуклеотидів – замість 290 пар стало 250. Визначте тип мутації:",["Делеція","Інверсія","Дуплікація","Транслокація","Нонсенс-мутація"],0],["Під час цитогенетичного обстеження пацієнта з порушеною репродуктивною функцією виявлено в деяких клітинах нормальний каріотип 46, XY, але у більшості клітин – каріотип синдрому Клайнфельтера 47, XXY. Яку назву носить таке явище неоднорідності клітин?",["Мозаїцизм","Інверсія","Транспозиція","Дуплікація","Мономорфізм"],0],["У генетичній лабораторії під час роботи з молекулами ДНК білих щурів лінії Вістар замінили один нуклеотид на інший. При цьому отримали заміну лише однієї амінокислоти у пептиді. Такий результат буде наслідком наступної мутації:",["Трансверсія","Делеція","Дуплікація","Зміщення рамки зчитування","Транслокація"],0],["У деяких районах тропічної Африки поширене таке захворювання, як серпоподібноклітинна анемія, при якому еритроцити мають форму, схожу на серп. Яким генетичним явищем зумовлене це захворювання?",["Генна мутація","Геномна мутація","Транскрипція","Трансдукція","Хромосомна аберація"],0],["A mutation has occurred in a cell in the first exon of the structural gene. The number of nucleotide pairs changed from 290 to 250. Name this type of mutation:",["Deletion","Duplication","Translocation","Nullisomy","Inversion"],0],["За умов тривалої інтоксикації тварин тетрахлорметаном було визначене суттєве зниження активності аміноацил-тРНК-синтетаз в гепатоцитах. Який метаболічний процес порушується в цьому випадку?",["Посттрансляційна модифікація пептидів","Реплікація ДНК","Посттранскрипційна модифікація РНК","Біосинтез білків","Транскрипція РНК"],3],["Кросинговер – це обмін ділянками гомологічних хромосом у процесі клітинного поділу, переважно в профазі першого мейотичного поділу, іноді в мітозі. Від чого залежить частота кросинговеру?",["Від зовнішніх факторів","Від типу хромосоми","Від кількості хромосом","Від відстані між генами","Від довжини хромосоми"],3],["Cytogenetic analysis allowed to determine the patient’s karyotype – 47, XY, +21/46, XY. Name this condition:",["Translocation","Phenocopy","Mosaicism","Deletion","Genocopy"],2],["A woman who had been sick with rubella during the pregnancy gave birth to a deaf child with hare lip and cleft palate. An example of which congenital defect is it?",["Edward’s syndrome","Patau’s syndrome","Phenocopy","Genocopy","Down’s syndrome"],2],["Continuous taking of some drugs during pregnancy increases the risk of giving birth to a child with genetic defects. What is this effect called?",["Embryotoxic effect","Blastomogenic effect","Mutagenic effect","Fetotoxic effect","Teratogenic effect"],4],["It is known that the gene responsible for development of blood groups according to ABO system has three allele variants. What of the following variability forms is shown when a man has IV blood group?",["Genocopy","Phenotypic","Combinative","Phenocopy","Mutational"],2],["A cell at the stage of mitosis anaphase was stimulated by colchicine that inhibits chromosome separation to the poles. What type of mutation will be caused?",["Duplication","Inversion","Translocation","Deletion","Polyploidy"],4],["Tetracycline taking in the first half of pregnancy causes abnormalities of fetus organs and systems, including tooth hypoplasia and alteration of their colour. What type of variability is the child’s disease related to?",["Modification","Combinative","Mutational","Hereditary","Recombinant"],0],["As a result of iodine deficiency in foodstuffs Transcarpathian people often have endemic goiter. This disease is caused by the following type of variability:",["Modification","Mutational","Combinatorial","Ontogenetic","Correlative"],0],["It is known that the gene responsible for the development of the MN blood groups has two allelic states. If the gene M is considered as the initial gene, the allelic gene N appeared due to:",["Mutations","Gene combinations","DNA repair","DNA replication","Crossing over"],0],["A woman got infected with rubella during pregnancy. The child was born with malformations, namely cleft lip and palate. The child’s genotype is normal. These malformations are a manifestation of:",["Modification variability","Polyploidies","Combinatory variability","Chromosomal mutations","Aneuploidies"],0],["A woman who had been consuming alcohol excessively during her pregnancy had a child with cleft palate and upper lip. These presentations are indicative of some chromosomal anomalies. What process do they result from?",["Teratogenesis","Carcinogenesis","Mutagenesis","Phylogenesis","Ontogenesis"],0],["A woman had been taking synthetic hormones during her pregnancy. Her newborn girl presents with excessive hairiness which has formal resemblance to adrenogenital syndrome. This sign of variability is called:",["Phenocopy","Mutation","Recombination","Heterosis","Replication"],0],["Fetal malformations can be caused by such maternal diseases as rubella, syphilis, toxoplasmosis, cytomegaly, herpes, and chlamydiosis. These malformations belong to the following type of variability:",["Modification","Epimutational","Mutational","Genomic imprinting","Combinative"],0],["Part of the DNA chain turned about 180 degrees due to gamma radiation. What type of mutation took place in the DNA chain?",["Replication","Deletion","Inversion","Doubling","Translocation"],2],["In a genetical laboratory in course of work with DNA molecules of white rats of Wistar’s line a nucleotide was substituted for another one. At that only one amino acid was substituted in the peptide. This result is caused by the following mutation:",["Transversion","Deletion","Duplication","Displacement of reading frame","Translocation"],0],["As a result of treatment of viral RNA with nitrous acid, UCA triplet mutated to UGA triplet. What kind of mutation occurred?",["Transition","Nucleotide deletion","Missense","Nucleotide insertion","Inversion"],0],["The cell was exposed to mutagenic factor which resulted in DNA molecule losing 2 nucleotide pairs. What type of mutation occurred in the DNA?",["Deletion","Duplication","Inversion","Translocation","Replication"],0],["Cells of a person working in the Chornobyl Exclusion Zone have undergone a mutation in DNA molecule. However, with time the damaged interval of DNA molecule has been restored to its initial structure with a specific enzyme. In this case the following occurred:",["Repair","Replication","Transcription","Reverse transcription","Translation"],0],["A woman who was infected with toxoplasmosis during the pregnancy has a child with multiple congenital defects. Result of what is it?",["Biological mutagenesis","Cancerogenesis","Recombination","Teratogenesis","Chemical mutagenesis"],3],["In some regions of South Africa there is a spread of sickle-shaped cell anemia, in which erythrocytes have the shape of a sickle as a result of substitution of glutamine by valine in the hemoglobin molecule. What is the cause of this disease?",["Transduction","Gene mutation","Genomic mutation","Crossing-over","Disturbance of mechanism of genetic information realization"],1],["An alcoholic woman has born a girl with mental and physical developmental lag. Doctors diagnosed the girl with fetal alcohol syndrome. What effect is the cause of the girl’s state?",["Teratogenic","Mutagenic","Malignization","Carcinogenic","Mechanic"],0],["46 chromosomes were revealed on karyotype examination of the 5-year-old girl. One of the 15th pair of chromosomes is longer than usual due to connected chromosome from the 21 pair. What type of mutation does this girl have?",["Translocation","Deletion","Inversion","Insufficiency","Duplication"],0],["An 8-week-pregnant woman with acute respiratory disease and temperature rise up to 39,0 °C has called a doctor. The doctor insisted on her avoiding taking paracetamol, because in this period of pregnancy there is a risk of its:",["Teratogenicity","Embryotoxicity","Fetotoxicity","Hepatotoxicity","Allergenicity"],0],["A child with a normal karyotype is diagnosed with cleft lip and hard palate, defects of the cardiovascular system, microcephaly. The child’s mother suffered rubella during pregnancy. This pathology in the child may be an example of:",["Genocopy","Trisomy","Phenocopy","Monosomy","–"],2],["During pregnancy a woman has been taking an antiepileptic drug – sodium valproate. It resulted in her child developing a vertebral column malformation – spina bifida. Name the described effect of the drug:",["Teratogenic effect","Immunosuppressive effect","Acquired tolerance","Dependence","Sensitizing effect"],0],["In the segment of a chromosome genes are located in this order: abcdef. After rebuilding the segment of a chromosome has the following form: abedcf. What type of mutation is it?",["Inversion","Deletion","Duplication","Symmetric translocation","Asymmetric translocation"],0],["A 10-year-old boy with severe progressive skin ulceration, decreased resistance to infection, and impaired cognitive ability has been diagnosed with a genetic deficiency of the enzyme prolidase. Mutation analysis has identified a single base substitution at the 3’ end of intron 6 of the mutant allele as well as deletion of a 45-base exon (exon 7) in the prolidase cDNA. Which type of gene mutation was most likely inherited by this boy?",["Frameshift mutation","In-frame mutation","Missense mutation","Nonsense mutation","Splice site mutation"],4],["У 10-річного хлопчика з важкою прогресуючою виразкою шкіри, зниженою резистентністю до інфекції та порушеною когнітивною здатністю діагностували генетичний дефіцит ферменту пролідази. Аналіз мутацій ідентифікував заміщення однієї основи на 3’-кінці інтрона 6 мутантного алеля, а також видалення 45-основног й хромосомний матеріал на короткому плечі однієї з хромосом 18 на смузі 11.2. Всі інші хромосоми нормальні. Яка найбільш вірогідна причина виникнення каріотипу у цього плоду?",["Збалансована реципрокна транслокація в одного з батьків","Збалансована робертсонівська транслокація в одного з батьків","Ізохромосома 18i(p) у одного з батьків","Нерозходження хромосом під час мейозу 1 у одного з батьків","Нерозходження хромосом під час мейозу 2 у одного з батьків"],0],["A scientist exposes a culture of a bacterium with minimal nutritional requirements to a chemical mutagen, then streaks out the bacteria on plates filled with a complex medium supplemented with all necessary nutrients. When the bacteria begin growing, she isolates individual colonies and tests each one for the ability to grow on a minimal medium. Cells derived from colonies unable to grow on a minimal medium are considered mutants, and their genome is sequenced. In one case, she finds that a 2-nucleotide segment of DNA has been deleted. This deletion would most likely give rise to which of the following?",["Conservative mutation","Frameshift mutation","Missense mutation","Nonsense mutation","Silent mutation"],1],["Науковець виділила культуру бактерій, які мають мінімальні потреби в живленні, і подіяла на них хімічним мутагеном. Потім було здійснено посів бактерій на середовище з повноцінним вмістом поживних речовин. Коли колонії бактерій почали рости, науковець ізолювала окремі колонії та тестувала кожну на можливість росту на середовищі з мінімальним вмістом нутрієнтів. Клітини колоній, які не мали здатності рости на мінімальному поживному середовищі, розглядались як мутанти, і їх геном було секвеновано. Науковець виявила, що в одному випадку відбулась делеція 2-х нуклеотидів ДНК. Який вид мутації описано?",["Консервативна мутація","Фреймшифт-мутація","Міссенс-мутація","Нонсенс-мутація","Сайлент-мутація"],1],["A 26-year-old woman and her 29-year-old husband have been trying to have a child for the past 3 yea
