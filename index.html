<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажер тестів</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap&subset=cyrillic">
<style>
:root{color-scheme:light dark;--bg:#f3f5fb;--card:#fff;--tx:#1b1f3a;--mut:#7a7f9c;--bd:#e4e7f3;--ac:#5b5bd6;--ac2:#8a5cf6;--act:#fff;--ok:#12a05c;--okb:#e4f7ec;--er:#e5484d;--erb:#fdeaea;--sh:0 6px 24px rgba(40,50,120,.08);--rbg:rgba(255,255,255,.25);--rfg:#fff;--rt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12131c;--card:#1c1e2c;--tx:#eceefb;--mut:#9094b3;--bd:#2c2f45;--ac:#8c8cf5;--ac2:#b08cff;--act:#12131c;--ok:#4fd18b;--okb:#12301f;--er:#ff7a7f;--erb:#3a1c20;--sh:0 6px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12131c;--card:#1c1e2c;--tx:#eceefb;--mut:#9094b3;--bd:#2c2f45;--ac:#8c8cf5;--ac2:#b08cff;--act:#12131c;--ok:#4fd18b;--okb:#12301f;--er:#ff7a7f;--erb:#3a1c20;--sh:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
#app{max-width:640px;margin:0 auto;padding:14px 16px 40px}
#app.q{padding-bottom:110px}
button{font:inherit;color:var(--tx);cursor:pointer;border:0;background:none;padding:0}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:26px;padding:22px 20px;box-shadow:0 12px 32px rgba(91,91,214,.35);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero small{opacity:.85;font-weight:600}.hero h1{margin:2px 0 16px;font-size:26px;font-weight:800;letter-spacing:-.3px}
.hrow{display:flex;gap:18px;align-items:center;position:relative;z-index:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;text-align:center}
.stats b{display:block;font-size:24px;font-weight:800;line-height:1.1}.stats span{font-size:12px;opacity:.85}
.ring .bg{stroke:var(--rbg)}.ring .fg{stroke:var(--rfg);transition:stroke-dasharray .6s}.ring text{fill:var(--rt)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:16px 0 4px;padding-bottom:4px}
.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--bd);font-weight:600;font-size:14px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.mode{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--sh);border:1px solid var(--bd);transition:transform .15s}
.mode:active{transform:scale(.98)}.mode:disabled{opacity:.5}
.mode .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--bg);flex:none}
.mode b{display:block;font-size:16px}.mode span.s{font-size:13px;color:var(--mut)}
.mode .n{margin-left:auto;font-weight:800;font-size:20px;color:var(--mut)}
.mode.hot{background:linear-gradient(135deg,#ff7a59,#ff4d6d);color:#fff;border:0}.mode.hot .ic{background:rgba(255,255,255,.22)}.mode.hot .s,.mode.hot .n{color:rgba(255,255,255,.9)}
.seg{display:flex;align-items:center;gap:8px;margin:8px 0}.seg span{font-size:14px;font-weight:700;min-width:74px}.seg button{flex:1;padding:9px 6px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-weight:600;font-size:14px}.seg button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.opt.sel{outline:2px solid var(--ac);outline-offset:2px}
.opt:not(:disabled):hover{border-color:var(--ac)}
kbd{margin-left:auto;font-family:inherit;font-weight:600;font-size:12px;line-height:1;color:var(--mut);border:1px solid var(--bd);border-radius:6px;padding:3px 7px;background:var(--bg)}
.hint{color:var(--mut);font-size:13px;text-align:center;margin:18px 0 0}
@media (hover:none){kbd,.hint{display:none}}
@media (min-width:900px){#app{max-width:780px;padding-top:28px}html,body{font-size:17px}.qc{font-size:19px}.hero h1{font-size:30px}}
.tg{position:relative;width:56px;height:30px;border-radius:999px;background:var(--card);border:1px solid var(--bd);padding:0;flex:none;box-shadow:var(--sh);cursor:pointer}
.tg b{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--bd);display:grid;place-items:center;font-size:13px;line-height:1;transition:transform .25s}
.tg.on b{transform:translateX(26px)}
.hero .tg{position:absolute;right:16px;top:16px;z-index:2}
.tcard{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;box-shadow:var(--sh)}
.tgc{flex-wrap:wrap;overflow:visible;margin:0}
.tn{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tn button{padding:14px 6px;border-radius:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:800;font-size:24px;line-height:1.1;box-shadow:0 8px 20px rgba(91,91,214,.3);text-align:center}
.tn button:disabled{opacity:.4}
.tn small{display:block;font-size:12px;font-weight:600;opacity:.9;margin-top:2px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}.trow .tag{margin:0}
.star{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-size:22px;line-height:1;color:var(--mut);flex:none;display:grid;place-items:center}
.star.on{color:#f5a623;border-color:#f5a623}
.fi{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 62px 14px 16px;margin:10px 0;box-shadow:var(--sh)}
.fi .star{position:absolute;right:12px;top:12px}
.fm{font-size:12px;font-weight:700;color:var(--ac);margin-bottom:6px}.ft{font-weight:600;font-size:15px}.fa{margin-top:8px;font-size:14px;color:var(--ok);font-weight:600}
.go:disabled{opacity:.5;cursor:default}
.mode.sp{padding:0;gap:0;align-items:stretch;overflow:hidden}
.mode.sp .mb{flex:1;display:flex;gap:14px;align-items:center;text-align:left;padding:16px;background:none;border:0;color:inherit;min-width:0;margin:0;width:auto;border-radius:0}
.mode.sp .mb:disabled{cursor:default}.mode.sp.off{opacity:.5}
.eyeb{width:64px;flex:none;display:grid;place-items:center;background:none;border:0;border-left:1px solid var(--bd);color:var(--mut);border-radius:0;margin:0;padding:0}
.mode.hot .eyeb{border-left-color:rgba(255,255,255,.35);color:#fff}
.rwrap{text-align:center}.rcap{font-size:12px;font-weight:600;opacity:.9;margin-top:-2px}
.rdr+.rdr{margin-top:14px}.rdt{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}.rdt b{font-size:22px}
.rbar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:6px 0 4px}.rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--ac))}
.lc{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.lh{display:flex;gap:10px;align-items:flex-start}.lq{flex:1;font-weight:700;font-size:16px;line-height:1.45}.ln{color:var(--mut)}
.lo{margin-top:12px}.lopt{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;border:1px solid transparent;color:var(--mut);font-size:15px}
.lopt b{min-width:1.8em}.lopt.c{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:700}.lopt i{margin-left:auto;font-style:normal;font-weight:800}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:10px;margin:8px 0}
.cell{position:relative;height:48px;border-radius:14px;border:0;font-weight:800;font-size:16px;color:#fff;padding:0}
.cell.ok{background:#12a05c}.cell.er{background:#e5484d}.cell.gr{background:var(--bd);color:var(--mut)}
.cell.cur{outline:3px solid var(--ac);outline-offset:2px}
.cs{position:absolute;top:-7px;right:-4px;font-style:normal;font-size:16px;color:#f5b800;text-shadow:0 0 2px rgba(0,0,0,.45)}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600}
.lgd span{display:flex;align-items:center;gap:6px}.dt{width:14px;height:14px;border-radius:5px;display:inline-block;font-style:normal;font-size:13px;line-height:14px;text-align:center}
.dt.ok{background:#12a05c}.dt.er{background:#e5484d}.dt.gr{background:var(--bd)}.dt.fv{color:#f5b800;width:auto}
.okt{color:#12a05c;font-weight:700}.ert{color:#e5484d;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:grid;place-items:center;padding:16px}
.mc{background:var(--bg);border-radius:24px;padding:18px;width:100%;max-width:560px;max-height:84vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.mh{display:flex;align-items:center;justify-content:space-between;font-size:18px}
.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:26px 4px 8px}
.hist{background:var(--card);border-radius:18px;border:1px solid var(--bd);box-shadow:var(--sh);overflow:hidden}
.hi{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd);font-size:14px}.hi:last-child{border:0}
.hi i{flex:1;height:6px;border-radius:6px;background:var(--bd);overflow:hidden}.hi i u{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.hi em{font-style:normal;color:var(--mut);min-width:72px}.hi b{min-width:48px;text-align:right}
.link{display:block;margin:26px auto 0;color:var(--mut);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.back{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-size:20px;line-height:1;flex:none}
.pb{flex:1;height:10px;background:var(--bd);border-radius:10px;overflow:hidden}.pb i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .35s}
.cnt{font-weight:700;font-size:14px;color:var(--mut);min-width:54px;text-align:right}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--ac);background:var(--bg);border:1px solid var(--bd);padding:3px 10px;border-radius:999px;margin:12px 0 0}
.qc{background:var(--card);border-radius:22px;padding:20px;margin:10px 0 14px;box-shadow:var(--sh);border:1px solid var(--bd);font-size:17px;font-weight:600;line-height:1.5;animation:in .3s}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:12px 14px;margin:9px 0;transition:all .15s;animation:in .3s both}
.opt:not(:disabled):active{transform:scale(.985)}
.opt .l{width:32px;height:32px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;color:var(--mut)}
.opt.ok{background:var(--okb);border-color:var(--ok);animation:pop .35s}.opt.ok .l{background:var(--ok);color:#fff}
.opt.er{background:var(--erb);border-color:var(--er);animation:shake .4s}.opt.er .l{background:var(--er);color:#fff}
.opt.dim{opacity:.5}
.fig{display:block;max-width:100%;border-radius:14px;margin:0 0 12px;background:#fff;border:1px solid var(--bd)}
.fb{border-radius:16px;padding:12px 14px;margin:12px 0;font-size:15px;animation:in .3s}.fb.ok{background:var(--okb);color:var(--ok)}.fb.er{background:var(--erb);color:var(--er)}.fb b{color:var(--tx)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);z-index:5}
.navrow{display:flex;gap:10px;max-width:608px;margin:0 auto}
.nb{flex:0 0 34%;padding:15px 8px;border-radius:16px;background:var(--card);border:1px solid var(--bd);font-weight:700;font-size:16px;box-shadow:var(--sh);text-align:center}
.nb.f{flex:1}.nb:disabled{opacity:.4;cursor:default}
.navrow .go{flex:1;width:auto;margin:0;max-width:none}
.go{display:block;width:100%;max-width:608px;margin:0 auto;padding:15px;border-radius:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:800;font-size:16px;box-shadow:0 8px 22px rgba(91,91,214,.4)}
.btn{display:block;width:100%;padding:15px;border-radius:16px;margin:10px 0;font-weight:700;background:var(--card);border:1px solid var(--bd)}
.res{text-align:center;padding:30px 20px;background:var(--card);border-radius:26px;box-shadow:var(--sh);border:1px solid var(--bd);margin-top:20px}
.res{--rbg:var(--bd);--rfg:var(--ac);--rt:var(--tx)}.res h1{margin:10px 0 2px}.res .e{font-size:44px}
.res .two{display:flex;justify-content:center;gap:34px;margin-top:14px}.res .two b{display:block;font-size:26px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px 12px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mut);font-weight:700}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@keyframes pop{50%{transform:scale(1.025)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div>
<script>
const G=[{"n":"Заняття №1","q":[["У живильне середовище, де вирощуються клітини тварини, додали амінокислоти лейцину з радіоактивною міткою. Через деякий час методом радіоавтографії виявили високу концентрацію міченої амінокислоти біля певних органел. Які це органели?",["Рибосоми","Лізосоми","Гладка ендоплазматична сітка","Клітинний центр","Апарат Гольджі"],0],["У крові хворого виявлено низький рівень альбумінів і фібриногену. Зниження активності яких органел гепатоцитів печінки найбільш вірогідно обумовлює це явище?",["Агранулярної ендоплазматичної сітки","Мітохондрій","Гранулярної ендоплазматичної сітки","Комплексу Гольджі","Лізосом"],2],["У культурі тканин ядерним опроміненням пошкоджені ядерця ядер. Відновлення яких органел у цитоплазмі клітин стає проблематичним?",["Ендоплазматичної сітки","Комплексу Гольджі","Рибосом","Лізосом","Мікротрубочок"],2],["Клітину лабораторної тварини піддали надмірному рентгенівському опроміненню. У результаті утворились білкові фрагменти в цитоплазмі. Який органоїд клітини візьме участь у їх утилізації?",["Рибосоми","Лізосоми","Клітинний центр","Ендоплазматичний ретикулум","Комплекс Гольджі"],1],["У процесі обміну речовин приймають участь внутрішньоклітинні структури, які мають кулясту форму, розміри від 0.2 до 1 мкм. Вони утворюються в комплексі Гольджі і відіграють суттєву роль в індивідуальному розвитку організму. Їх поділяють на групи, в залежності від вмісту і функцій. Пошкодження цих органел дуже шкідливе для клітини. Назвіть ці органели:",["Лізосоми","Рибосоми","Ендоплазматична сітка","Мітохондрії","Центросома"],0],["У світловому мікроскопі у вигляді диференційованої ділянки цитоплазми, що звичайно розташована біля ядра, міститься органела, яка має вигляд сітки, скупчення сплющених циліндрів, з потовщеннями на кінцях і пухирцями, які відходять від них. У цій органелі відбувається концентрація, зневоднення і ущільнення продуктів внутрішньоклітинної секреції, які надходять ззовні і призначені для виділення з клітини. З цією органелою пов’язані синтез полісахаридів, ліпідів, утворення зерен жовтка при дозріванні овоцитів. Назвіть органелу?",["Комплекс Гольджі","Центросома","Мітохондрія","Рибосома","Вакуоля"],0],["У клітинах тварин є довгі циліндри діаметром близько 24 нм. Вони формуються з чергування димерів білка тубуліну і відіграють важливу роль у підтримані певної форми клітини і її органоїдів, а також беруть участь у транспорті макромолекул і органел. При поділі клітини забезпечують розходження хромосом. Визначте ці органели:",["Мікротрубочки","Пластиди","Мітохондрії","Ендоплазматичний ретикулум","Мікрофіламенти"],0],["Вкажіть органоїди, які є в клітинах бактерій:",["Рибосоми","Мітохондрії","Хлоропласти","Травна вакуоль","Ядро"],0],["Різні клітинні органели характеризуються не однаковим набором ензимів, що пов’язане із специфічністю виконуваних ними функцій. Яка органела містить тільки травні ферменти?",["Лізосома","Комплекс Гольджі","Ендоплазматичний ретикулум","Мітохондрія","Рибосома"],0],["При деяких захворюваннях в клітинах виникають зміни, які супроводжуються порушеннями цілісності мембран лізосом. Які зміни відбудуться в клітинах?",["Відбудеться аутоліз","Порушиться процес мітозу","Порушиться процес трансляції","Відбудеться порушення процесу транскрипції","Відбудеться накопичення речовин клітиною"],0],["Існують клітинні і неклітинні форми життя. Які з нижче вказаних форм належать до неклітинних.",["Віруси","Синьозелені водорості","Бактерії","Мікоплазми","Найпростіші"],0],["У клініку надійшов хворий з отруєнням. Встановлено, що в його організмі порушені механізми детоксикації. Зі зміною функцій яких з перелічених органоїдів пов’язаний цей дефект?",["Ендоплазматична сітка (ЕПС)","Ядро","Мітохондрія","Комплекс Гольджі","Лізосоми"],0],["У хворого знижена секреція глікопротеїну муцину, який утворює слиз. Порушення функцій якого з перелічених органоїдів може викликати це явище",["Комплекс Гольджі","Ядро","Мітохондрії","Ендоплазматична сітка (ЕПС)","Лізосоми"],0],["Хворому внутрішньовенно ввели гіпертонічний розчин глюкози. Це підсилить рух води:",["З клітини до міжклітинної рідини","З міжклітинної рідини до капілярів","З міжклітинної рідини до клітин","З капілярів до міжклітинної рідини","Змін руху води не буде"],0],["На практичному занятті студенти вивчали забарвлений мазок крові миші з бактеріями, фагоцитованими лейкоцитами. Яка органела клітини завершує перетравлення цих бактерій?",["Лізосоми","Мітохондрії","Гранулярна ендоплазматична сітка","Апарат Гольджі","Рибосоми"],0],["Комплекс Гольджі виводить речовини із клітини завдяки злиттю мембранного мішечка з мембраною клітини. При цьому вміст мішечка виливається назовні. Який процес тут проявляється?",["Екзоцитоз","Ендоцитоз","Активний транспорт","Полегшена дифузія","Жодна відповідь невірна"],0],["При проведені наукового експерименту дослідник зруйнував структуру однієї з частин клітини, що порушило здатність клітини до поділу. Яка структура була зруйнована найбільш імовірно?",["Центросома","Глікокалікс","Пластичний комплекс","Мікрофібрили","Мітохондрії"],0],["Під час електронномікроскопічного дослідження біоптату гепатоцитів на біліарному полюсі виявлено велику кількість плоских цистерн, сплющених у центральній частині й розширених на периферії, та дрібних міхурців із секреторними гранулами. Назвіть цю структуру:",["Комплекс Гольджі","Лізосома","Ендоплазматична сітка","Піноцитозні міхурці","Мікротрубочки"],0],["Встановлено, що в клітинах організмів відсутні мембранні органели та їх спадковий матеріал не має нуклеосомної організації. Що це за організми?",["Прокаріоти","Віруси","Аскоміцети","Еукаріоти","Найпростіші"],0],["У процесі зовнішнього дихання відбувається переміщення невеликих полярних (CO₂) і неполярних (O₂) молекул за градієнтом концентрації. Про яку форму транспорту йде мова у даному випадку?",["Просту дифузію","Полегшену дифузію","Осмос","Ендоцитоз","Екзоцитоз"],0],["У результаті впливу сполук важких металів на організм у тканинах спостерігаються зміни структури клітин. Одним із проявів впливу ксенобіотиків є деструкція органел. Яка органела виконує функцію аутофагоцитозу зруйнованих структур?",["Лізосома","Пероксисома","Мітохондрія","Комплекс Гольджі","Гранулярна ендоплазматична сітка"],0],["Одна з функцій тонкої кишки полягає в гідролізі неперетравлених поживних речовин. Цьому сприяють секрети підшлункової залози, що містять у своєму складі біологічно активні речовини білкової природи – ферменти. Яку функцію в даному випадку виконують білки?",["Каталітичну","Регулюючу","Рецепторну","Транспортну","Енергетичну"],0],["Серед патологічних змін клітини можна відзначити порушення структури та проникності мембран клітинних органел. При авітамінозі Е відбувається вихід гідролітичних ферментів у цитоплазму, що призводить до часткового чи повного руйнування клітини. Підвищення проникності мембрани якої органели спостерігається при цьому?",["Лізосоми","Мітохондрії","Ендоплазматична сітка","Рибосоми","Комплекс Гольджі"],0],["Хімічний фактор подіяв на цитоплазматичну мембрану еукаріотичної клітини. У результаті цього клітина втратила властивість міжклітинного розпізнавання. Який шар плазмолеми взяв у цьому участь?",["Глікокалікс","Бішар ліпідів","Біліпідний","Підмембранний","Кортикальний"],0],["У дитини чотирьох років зі спадковою хворобою в клітинах організму виявлені аномальні біополімери. Про порушення функції яких органел йде мова?",["Лізосом","Пероксисом","Рибосом","Мітохондрій","Гранулярної ендоплазматичної сітки"],4],["Еукаріотичну клітину обробили хімічними речовинами, які порушили конформацію білків, що входять до складу біомембрани. Які функції цитоплазматичної мембрани будуть порушені?",["Транспортна та рецепторна","Захисна","Утворення органел","Утворення міжклітинних контактів","Бар’єрна"],0],["Процес тканинного дихання супроводжується окисненням органічних сполук і синтезом макроергічних молекул. У яких органелах відбувається цей процес?",["Мітохондріях","Пероксисомах","Рибосомах","Комплексі Гольджі","Лізосомах"],0],["На електронній мікрофотографії клітини видно дві різних органели, які руйнують білки. Що це за органели?",["Лізосоми та протеасоми","Ендоплазматична сітка та мікрофіламенти","Пероксисоми та рибосоми","Рибосома","Комплекс Гольджі та мікротрубочки"],0],["У людини трапляються хвороби, пов’язані з порушенням розщеплення і накопичення у клітинах глікогену, ліпідів та ін. Причиною виникнення цих спадкових хвороб є відсутність відповідних ферментів у:",["Ендоплазматичній сітці","Мікротрубочках","Мітохондріях","Ядрі","Лізосомах"],4],["При деяких спадкових хворобах (наприклад синдром Кернса-Сейра) спостерігається деструкція мітохондрій. Які процеси у клітині можуть бути порушені внаслідок цього?",["Поділ ядра","Синтез АТФ","Гліколіз","Кросинговер","Синтез амінокислот"],1],["Після видалення зуба у чоловіка віком 40 років відбулася активна регенерація ранової поверхні. Враховуючи функції органел клітини, визначте, які з них найперші забезпечили процес регенерації:",["Мітохондрії","Рибосоми","Лізосоми","Пероксисоми","Комплекс Гольджі"],1],["На клітину подіяли речовиною, яка спричинила порушення цілісності мембран лізосом. Який процес відбуватиметься з клітиною у цьому разі?",["Автоліз","Трансформація","Спеціалізація","Диференціація","Дегенерація"],0],["Миші тривалий час плавали у басейні. При морфологічному дослідженні їх скелетних м’язів виявлено збільшення кількості мітохондрій з багатьма кристами і просвітленим матриксом. Яка функція клітини знаходиться у надзвичайно напруженому стані?",["Енергетична","Секреторна","Синтетична","Захисна","Транспортна"],0],["У хлопця віком 18 років виявлено збільшення щитоподібної залози, що супроводжується підвищеним обміном речовин та збільшенням частоти пульсу. Ці ознаки спостерігаються при гіперсекреції гормону тироксину. Які органели клітин щитоподібної залози найбільш відповідальні за секрецію та виділення гормонів?",["Комплекс Гольджі","Мітохондрії","Рибосоми","Лізосоми","Центросоми"],0],["Тривалий вплив на організм людини токсичних речовин призвів до руйнування органел, які відповідають за синтез білків у гепатоцитах печінки. Які органели здійснюють синтез білків у гепатоцитах?",["Лізосоми","Пероксисоми","Рибосоми","Мітохондрії","Агранулярна ендоплазматична сітка"],2],["Привушна слинна залоза у своєму складі має кінцеві секреторні відділи, які утворені сероцитами. Які органели цих клітин забезпечують синтез та секрецію компонентів слини?",["Мітохондрії, комплекс Гольджі","Агранулярна ендоплазматична сітка, комплекс Гольджі","Комплекс Гольджі","Гранулярна ендоплазматична сітка, комплекс Гольджі","Лізосоми"],3],["У клініку госпіталізований хворий з отруєнням. Встановлено, що в печінці порушені механізми детоксикації. Які з органел гепатоцитів в першу чергу обумовили цей стан?",["Агранулярна ендоплазматична сітка","Рибосоми","Мітохондрії","Комплекс Гольджі","Гранулярна ендоплазматична сітка"],0],["Шкідливі екологічні чинники призвели до різкого падіння ендоцитозу та екзоцитозу в клітинах печінки та крові. Який шар плазмолеми постраждав насамперед?",["Кортикальний","Інтегральний","Глікокалікс","Ліпопротеїновий","Надмембранний"],0],["При ревматизмі у хворої людини спостерігається руйнування та порушення функцій клітин хрящів. Яка з клітинних органел бере найбільш активну участь у цьому патологічному процесі?",["Клітинний центр","Комплекс Гольджі","Рибосома","Лізосома","Мікротрубочка"],3],["У дитини 2 років часто спостерігаються запальні процеси легень. З порушенням функцій яких органел клітин покривного епітелію бронхів це може бути пов’язано?",["Мітохондрій","Мікроворсинок","Лізосом","Війок","Ендоплазматичної сітки"],3],["У 50-річної жінки на місці видаленого зуба регенерувала нова тканина. Які органели клітин, виходячи з їх функцій, є найбільш активними при відновленні тканини?",["Рибосоми","Центросоми","Постлізосоми","Гладка ЕПС","Лізосоми"],0],["У клітинах усіх організмів присутні безмембранні органели, що складаються з двох неоднакових за розміром частинок. Вони мають мікроскопічний розмір та беруть участь у синтезі білків. Як називаються ці органели?",["Рибосоми","Лізосоми","Комплекс Гольджі","Клітинний центр","Мітохондрії"],0],["Під час мікроскопії клітин серцевого м’яза людини знайдені органели овальної форми, оболонка яких утворена двома мембранами: зовнішня – гладенька, а внутрішня утворює кристи. Біохімічно встановлено наявність ферменту АТФ-синтетази. Які органели досліджувалися?",["Мітохондрії","Лізосоми","Рибосоми","Ендоплазматична сітка","Центросоми"],0],["При електронно-мікроскопічному вивченні клітини виявлені кулясті пухирці, які обмежені мембраною і містять безліч різноманітних гідролітичних ферментів. Відомо, що ці органели забезпечують внутрішньоклітинне травлення, захисні реакції клітини. Назвіть ці органели?",["Лізосоми","Центросоми","Ендоплазматична сітка","Рибосоми","Мітохондрії"],0],["У цитоплазмі клітин підшлункової залози в процесі секреторного циклу в апікальній частині з’являються і зникають гранули секрету. До яких структурних елементів можна віднести ці гранули?",["Включення","Мікрофіламенти","Лізосоми","Екзоцитозні вакуолі","Гранулярна ендоплазматична сітка"],0],["Речовини виводяться з клітини внаслідок з’єднання мембранної структури апарату Гольджі з цитолемою. Уміст такої структури викидається за межі клітини. Цей процес має назву:",["Осмос","Ендоцитоз","Піноцитоз","Полегшена дифузія","Екзоцитоз"],4],["Експериментально (дією мутагенних факторів) у клітині порушено формування субодиниць рибосом. На якому метаболічному процесі це позначиться?",["Біосинтез білка","Біосинтез вуглеводів","Синтез АТФ","Фотосинтез","Біологічне окиснення"],0],["Клітина піддалась впливу іонізуючого випромінювання при дефіциті вітаміну Е. Це сприяло посиленому виходу гідролітичних ферментів у цитоплазму і призвело до повного руйнування внутрішньоклітинних структур – аутолізу. Які органели клітини призвели до цього явища?",["Лізосоми","Ендоплазматична сітка","Комплекс Гольджі","Мікротільця","Мітохондрії"],0],["Організми мають ядро, оточене ядерною мембраною. Генетичний матеріал зосереджений переважно в хромосомах, які складаються з ниток ДНК і білкових молекул. Діляться ці клітини мітотично. Це:",["Еукаріоти","Бактеріофаги","Прокаріоти","Віруси","Бактерії"],0],["Цитохімічне дослідження виявило високий вміст гідролітичних ферментів у цитоплазмі. Про активність яких органел із наведених свідчить цей факт?",["Клітинного центру","Ендоплазматичної сітки","Полісоми","Лізосом","Мітохондрій"],3],["При електронній мікроскопії у цитоплазмі клітини, поблизу ядра, виявлена мембранна органела, яка складається з 5-10 плоских цистерн, з розширеними периферичними ділянками, від яких від’єднуються маленькі пухирці – лізосоми. Назвіть цю органелу:",["Комплекс Гольджі","Рибосома","Мітохондрія","Цитоскелет","Клітинний центр"],0],["Яка група організмів має кільцеві та лінійні молекули ДНК, що формують хромосоми простої будови (не мають гістонів)?",["Бактерії","Віруси","Найпростіші","Гриби","Бактеріофаги"],0],["При дослідженні біологічного матеріалу пацієнта, хворого на грип, виявлено збудника, якого відносять до неклітинної форми життя. У своєму складі збудник містить РНК, оточену білками оболонки. Даний збудник належить до:",["Вірусів","Пріонів","Бактерій","Грибів","Гельмінтів"],0],["У хворого на хронічний гепатит в аналізі крові на білкові фракції виявили зниження загальної кількості білка. Це означає, що у клітинах печінки порушена функція таких органел:",["Гранулярна ендоплазматична сітка","Цитоскелет","Комплекс Гольджі","Лізосоми","Мітохондрії"],0],["Під час електронномікроскопічного дослідження біоптату гепатоцитів на біліарному полюсі виявлено велику кількість плоских цистерн, сплющених у центральній частині й розширених на периферії, та дрібних міхурців із секреторними гранулами. Назвіть цю структуру:",["Комплекс Гольджі","Лізосома","Ендоплазматична сітка","Піноцитозні міхурці","Мікротрубочки"],0],["Вивчаючи під електронним мікроскопом клітини підшлункової залози, було знайдено структури, які поділяють клітину на велику кількість комірок, каналів, цистерн та поєднані із плазмолемою. Укажіть ці органели:",["Рибосоми","Комплекс Гольджі","Ендоплазматична сітка","Центросоми","Мітохондрії"],2],["Встановлено, що токсична дія ціанідів виявляється у гальмуванні клітинного дихання. Який органоїд клітини є найбільш чутливим до цих отрут?",["Рибосоми","Комплекс Гольджі","Мітохондрії","Лізосоми","Клітинний центр"],2],["Labeled aminoacids alanine and tryptophane were introduced to a mouse in order to study localization of protein biosynthesis in its cells. Around what organelles will the accumulation of labeled aminoacid be observed?",["Cell centre","Lysosomes","Ribosomes","Smooth endoplasmic reticulum","Golgi apparatus"],2],["One of the cell organelles is the place, where protein molecules are being built and packaged with carbohydrates and fats, before they are transported from the cell via exocytosis. What organelle is it?",["Mitochondrion","Lysosome","Ribosome","Golgi apparatus","Centrosome"],3],["A cell with vitamin E deficiency was exposed to ionizing radiation. It resulted in intensified release of hydrolytic enzymes into the cytoplasm and a complete destruction of intracellular structures – autolysis. What organelles caused this phenomenon?",["Mitochondrion","Lysosome","Ribosome","Endoplasmic reticulum","Centrosome"],1],["A biology graduate student is performing an experiment in the immunology laboratory. He studies a blood cell count from a patient with acute appendicitis, which shows an increase in the number of cells having a multilobed nucleus and multiple cytoplasmic granules. These cells engulf pathogens or necrotic tissue and help in the degradation of foreign products. Which of the following processes is seen in the cell described above?",["Osmosis","Parietal digestion","Phagocytosis","Passive diffusion","Pinocytosis"],2],["Oval and round organelles with double wall are seen at the electron micrograph. The outer membrane is smooth, the inner membrane folded into cristae contain enzyme ATPase synthetase. What he liver hepatocytes can most probably cause it?",["Lysosomes","Rough endoplasmic reticulum","Agranular endoplasmic reticulum","Golgi complex","Mitochondrions"],1],["Golgi complex exports substances from a cell due to the fusion of the membrane sacs with cell membrane. The sacs content flows out. What process is it?",["All answers are false","Facilitated diffusion","Exocytosis","Active transport","Endocytosis"],2],["At the laboratory experiment the leukocyte culture was mixed with staphylococci. Neutrophile leukocytes engulfed and digested bacterial cells. What is name of this process?",["Diffusion","Pinocytosis","Osmosis","Phagocytosis","Facilitated diffusion"],3],["A 50-year-old woman had her tooth extracted. The tissue regenerated. Which of the following organella are the most active during tissue regeneration?",["Ribosomes","Centrosomes","Postlysosomes","Agranular endoplasmic reticulum","Lysosomes"],0],["Examination of a patient with hepatolenticular degeneration revealed that synthesis of ceruloplasmin protein has a defect. What organelles is this defect connected with?",["Granular endoplasmic reticulum","Agranular endoplasmic reticulum","Mitochondrions","Golgi complex","Lysosomes"],0],["Microscopic analysis of human heart cells revealed some oval organelles, their tunic being formed by two membranes: the external one is smooth, and the internal one forms crista. Biochemical analysis determined the presence of ATP-synthetase enzyme. What organelles were analysed?",["Mitochondrions","Lysosomes","Ribosomes","Endoplasmic reticulum","Centrosomes"],0],["Electron microscopic study of a cell revealed roundish bubbles confined by a membrane and containing a lot of various hydrolytic enzymes. It is known that these organelles provide intracellular digestion and protective functions. These elements are:",["Lysosomes","Centrosomes","Endoplasmic reticulum","Ribosomes","Mitochondria"],0],["Analysis of an electron diffraction pattern of a cell revealed mitochondrion destruction. This might result in abnormal course of the following cell process:",["Oxidation of organic substances","Nuclear division","Crossingover","Cleavage","-"],0],["Nucleoli of nuclei have been damaged due to tissue culture nuclear irradiation. Regeneration of the following organelles becomes hampered in cytoplasm:",["Ribosomes","Lysosomes","Endoplasmic reticulum","Microtubules","Golgi apparatus"],0],["A 36-year-old patient underwent tooth extraction at a dental clinic. After two weeks the stratified squamous epithelium regenerated at the site of extraction. What organelles were involved in the restoration of the mucous membrane?",["Ribosomes","Centrosomes","Postlysosomes","Smooth EPR","Mitochondria"],0],["Cytochemical investigation revealed high content of hydrolytic enzymes in the cytoplasm. This phenomenon indicates the activity of the following organelles:",["Lysosomes","Endoplasmic reticulum","Mitochondria","Polysomes","Cell center"],0],["A molecular-level process of spontaneous passive transport of water-soluble molecules across a cell membrane is modeled. The molecules move across cell membranes from an area of higher concentration toward an area of lower concentration via specific transmembrane integral proteins. This transport does not directly require chemical energy from ATP hydrolysis. Which of the following transport mechanisms is most likely mentioned?",["Facilitated diffusion","Pinocytosis","Osmosis","Active transport","Exocytosis"],0],["Human organism is composed of the million different types of eukaryote cells. Which of the listed answers describes the general plan of the cell structure most completely?",["Cytoplasm, cell membrane, nucleus","Cytoplasm, organelles, inclusions","Cell membrane, cytoplasm, organelles","Nucleus, cytoplasm, organelles","Cytoplasm, cell membrane"],0],["Each organism is composed of the million eukaryote cells. Each cell is bounded by plasma membrane, which regulates what enters and leaves the cell. Which of the following statements concerning the structure of the plasma membrane is correct?",["Carbohydrates attached to some proteins and lipids form the glycocalyx on the external side of the plasmalemma","Proteins are located in glycocalix","Carbohydrates are located within the lipid bilayer","Cholesterol increases the fluidity of the lipid bilayer","The proteins can only be associated with the membrane as peripheral proteins"],0],["Each organism is composed of the million eukaryote cells. Each cell is bounded by plasma membrane, which regulates what enters and leaves the cell. Which layer of the plasma membrane is associated with carbohydrates?",["Glycocalix","Biological membrane","Cortical","Lipid bilayer","Endothelial"],0],["A medical student studies a waste disposal system in human epithelial cells. During electron microscopy he reveals the spherical vesicles, surrounded by a membrane and containing many different hydrolytic enzymes. The main function of these organelles is to provide intracellular digestion and protective reactions of the cell. Which of the following organelles is mentioned above?",["Ribosomes","Mitochondria","Lysosomes","Centrosomes","Endoplasmic reticulum"],2],["During histologic examination of the skeletal muscle specimen, the investigator discovers an organelle that has 2 membranes: smooth outer membrane and internal, that forms multiple ridges of visible folds (crysts). Which of the following is the most likely function of this structure?",["Synthesis and energy accumulation in the form of ATP","Intracellular digestion of macromolecules","Synthesis fat","Formation of mitotic spindle","Synthesis of carbohydrates"],0],["A patient with chronic hepatitis undergoes blood test for serum protein fractions. Total protein levels are low, which indicates that in the hepatic cells the following organelles are functionally disturbed:",["Cytoskeleton","Golgi apparatus","Lysosomes","Granular endoplasmic reticulum","Mitochondria"],3],["A tissue sample of benign tumor was studied under the electron microscope. A lot of small (15-20 nm) spherical bodies, consisting of 2 unequal subunits were detected. These are:",["Ribosomes","Golgi complex","Smooth endoplasmic reticulum","Microtubules","Mitochondria"],0],["Ultramicroscopical examination of “dark” hepatocyte population in the cell cytoplasm detected a developed granular endoplasmic reticulum. What function has this organelle in these cells?",["Synthesis of blood plasma proteins","Carbohydrate synthesis","Deintoxicative function","Bile production","Calcium ion depositing"],0],["Cells of a healthy liver actively synthesize glycogen and proteins. What organelles are the most developed in them?",["Granular and agranular endoplasmic reticulums","Cell center","Lysosomes","Mitochondria","Peroxisomes"],0],["An 18-year-old student presents with enlarged thyroid gland accompanied by accelerated metabolism and increased heart rate. These signs can be observed during hypersecretion of thyroxin. What organelles of thyroid cells are primarily responsible for hormone production and secretion?",["Golgi apparatus","Mitochondria","Ribosomes","Centrosomes","Lysosomes"],2],["Long-term taking of medicines can affect cells of the liver. Particularly, it can cause marked hypertrophy of agranular endoplasmic reticulum due to the following function of this organelle:",["Formation of maturation spindle","Detoxication of harmful substances","Protein synthesis","Nucleic acid synthesis","Intracellular digestion"],1],["A college student goes to a fraternity party and consumes large quantities of beer. The alcohol in the beer is metabolized by the liver, with almost half the alcohol being oxidized to acetaldehyde. In which of the following sites does this reaction occur?",["Golgi bodies","Lysosomes","Mitochondrial matrix","Peroxisomes","Ribosomes"],3],["Студент коледжу на вечірці студентського братства випив багато пива. Алкоголь розщеплюється у печінці, більша його частина переважно розщеплюється до ацетальдегіду. Де в клітині відбувається цей процес?",["Апарат Гольджі","Лізосоми","Матрикс мітохондрій","Пероксисоми","Рибосоми"],3],["A pathologist is examining microscope slides of a skin biopsy from a patient with malignant melanoma. The pathologist notes in the microscopic description of the report that almost all of the melanoma cells have very large, visible nucleoli. This finding specifically suggests that these cells are making large amounts of which of the following?",["Cell surface markers","Golgi apparatus","Immunoglobulins","New DNA","Ribosomes"],4],["Патологоанатом досліджував мікроскопічні препарати шкіри у пацієнта із злоякісною меланомою. У своєму описі лікар вказує, що під мікроскопом майже всі клітини пухлини мають дуже великі ядерця, які добре візуалізуються. Кількість яких структур збільшена у даному випадку?",["Маркерів поверхні клітини","Апарату Гольджі","Імуноглобулінів","Нової ДНК","Рибосом"],4],["Liver cells in culture were kept at 0 °C (32.0 °F) and treated with trypsin to digest the receptors on the cell surface. The temperature was then raised to 37.0 °C (98.6 °F), and radioactive LDL was added to the culture media. Several hours later, the labeled LDL was found to be inside the cells. Which of the following represents the process of LDL uptake by hepatocytes?",["Active transport","Facilitated diffusion","Phagocytosis","Pinocytosis","Receptor-mediated endocytosis"],4],["Культуру клітин печінки утримували при температурі 32 °F, до неї додали трипсин для перетравлення рецепторів на поверхні клітини. Згодом температуру підняли до 37 °C (98,6 °F) та додали радіоактивні ліпопротеїни низької щільності (ЛПНЩ). Через декілька годин мічені ЛПНЩ були виявлені всередині клітини. Який із перелічених механізмів пояснює дане явище?",["Активний транспорт","Полегшена дифузія","Фагоцитоз","Піноцитоз","Рецептор-опосередкований ендоцитоз"],4],["A 25-year-old man and his wife go to a fertility clinic for evaluation. His wife has no significant past medical history and is given a “clean bill of health”. He has had bronchiectasis and a history of recurrent sinusitis, and was diagnosed with situs inversus as a child. He is found to be sterile. What is the most likely cause of his infertility?",["Abnormal levels of sphingomyelinase","Abnormal structure of cilia","Fibrillin deficiency","47, XXY karyotype","Hexosaminidase A deficiency"],1],["25-річний чоловік та його дружина звернулися у клініку для обстеження. Дружина здорова. З анамнезу відомо, що чоловік хворіє на бронхоектаз та рецидивуючий синусит, а у дитинстві йому діагностували situs inversus (дзеркальне розміщення внутрішніх органів). Дослідженнями встановлено, що чоловік не може стати батьком. Яка ймовірна причина стерильності чоловіка?",["Порушений вміст сфінгомієлінів","Порушення будови війок","Недостатність фібриліну","Каріотип 47, XXY","Недостатність гексамінідази А"],1]]},{"n":"Заняття №2","q":[["Виродженість генетичного коду – здатність декількох триплетів кодувати одну амінокислоту. Проте, одна амінокислота кодується одним триплетом. Оберіть її серед названих варіантів:",["Лейцин","Серин","Аланін","Метіонін","Лізин"],3],["Серед органічних речовин клітини знайдено полімер, який складається з десятків, сотень і тисяч мономерів. Молекула здатна самовідтворюватись та бути носієм інформації. За допомогою рентгеноструктурного аналізу виявлено, що молекула складається з двох спірально закручених ниток. Вкажіть цю сполуку:",["Целюлоза","РНК","ДНК","Гормон","Вуглевод"],2],["Під час секвенування ДНК і біохімічному аналізі поліпептиду було встановлено, що лінійна послідовність триплетів нуклеотидів відповідає послідовності амінокислот у поліпептидному ланцюзі. Визначте, яка властивість генетичного коду була встановлена?",["Колінеарність","Триплетність","Виродженість","Неперекривність","Універсальність"],0],["Під час реплікації ДНК один із її ланцюгів синтезується із запізненням. Що визначає дану особливість синтезу?",["Антипаралельність ланцюгів","Відсутність трифосфонуклеотидів","Великі розміри ДНК-полімерази","Комплементарність ланцюгів","Необхідність репарації"],0],["Під дією УФ-опромінення та інших факторів можуть відбуватися зміни в структурі ДНК. Репарація молекули ДНК досягається узгодженою дією всіх наступних ферментів, за винятком:",["Аміноацил-тРНК-синтетаза","ДНК-глікозидаза","ДНК-лігаза","ДНК-полімераза","Ендонуклеаза"],0],["Встановлено ураження вірусом ВІЛ Т-лімфоцитів. При цьому фермент вірусу зворотна транскриптаза (РНК-залежна ДНК-полімераза) каталізує синтез:",["Вірусного білку на матриці вірусної РНК","Вірусної РНК на матриці вірусної ДНК","ДНК на матриці вірусної РНК","Вірусної ДНК на матриці ДНК","і-РНК на матриці вірусного білку"],2],["РНК, що містить вірус СНІДу, проник всередину лейкоцита і за допомогою ферменту ревертази примусив клітину синтезувати вірусну ДНК. Що лежить в основі цього процесу?",["Зворотна транскрипція","Конваріантна реплікація","Зворотна трансляція","Репресія оперона","Дерепресія оперона"],0],["У процесі транскрипції здійснюється синтез комплементарної молекули РНК на матриці ДНК. Який фермент каталізує цей процес?",["ДНК-залежна РНК-полімераза","Праймаза","Геліказа","ДНК-полімераза","Топоізомераза"],0],["Згідно моделі подвійної спіралі ДНК, запропонованої Уотсоном і Кріком, було встановлено, що один із ланцюгів зберігається при реплікації, а інший синтезується комплементарно першому. Як називається цей спосіб реплікації?",["Напівконсервативний","Аналогічний","Ідентичний","Дисперсний","Консервативний"],0],["При отруєнні аманітином (отрутою блідої поганки) блокується РНК-полімераза В (II). Який процес при цьому припиняється?",["Синтез м-РНК","Синтез т-РНК","Дозрівання м-РНК","Синтез праймерів","Зворотна транскрипція"],0],["Реплікація ДНК здійснюється за допомогою комплексу ферментів. Який процес каталізує фермент праймаза?",["Синтез затравних ланцюгів РНК","Розплетення ланцюгів молекули ДНК","Розрив нитки ДНК у точці “огі”","Зшивання фрагментів Оказакі","Стабілізація однониткових ділянок ДНК"],0],["Після перебування в солярії у жінки виявлено збільшення кількості новоутворень на шкірі. Причиною виникнення новоутворень було порушення послідовності нуклеотидів внаслідок впливу ультрафіолетових променів. Яке з перелічених порушень призвело до виникнення новоутворень?",["Репарація ДНК","Транскрипція","Мутація ДНК","Реплікація ДНК","Термінація ДНК"],0],["В експерименті було показано, що опромінені ультрафіолетом клітини шкіри хворих на пігментну ксеродерму, через дефект ферменту репарації, повільніше відновлюють нативну структуру ДНК, ніж клітини здорових людей. За допомогою якого ферменту відбувається цей процес?",["Ендонуклеаза","РНК-лігаза","Праймаза","ДНК-полімераза III","ДНК-гіраза"],0],["На електронній мікрофотографії науковець виявив структуру, утворену вісьмома молекулами білків-гістонів і ділянкою молекули ДНК, що робить близько 1,75 обертів навколо них. Яку структуру виявив дослідник?",["Нуклеосома","Елементарна фібрила","Напівхроматида","Хроматида","Хромосома"],0],["У ядрі клітини є непостійні структури, які зникають на початку поділу клітини і знову з’являються в кінці. Вони містять білок і РНК, їх утворення пов’язане з хромосомами. Їх функція дуже важлива для утворення субодиниць рибосом. Назвіть ці структури.",["Ядерця","Нуклеосоми","Гістони","Мікрофібрили","Гетерохроматин"],0],["У ході регенерації епітелію слизової оболонки порожнини рота (розмноження клітин) відбулася реплікація (авторепродукція) ДНК за напівконсервативним механізмом. При цьому нуклеотиди нової нитки ДНК є комплементарними до:",["Материнської нитки","Змістовних кодонів","Ферменту ДНК-полімерази","Інтронних ділянок гену","Ферменту РНК-полімерази"],0],["Під впливом іонізуючої радіації виникають зміни нуклеотидів у молекулі ДНК. Для усунення цих мутацій ферменти екзонуклеази вирізають пошкоджені ділянки, а ДНК-лігази з’єднують новоутворені ДНК-полімеразою ланцюги. Як називається цей тип репарації?",["Ексцизійна","Фоторепарація","Рекомбінативна","Дореплікативна","Реплікативна"],0],["У результаті опромінення порушилась цілісність молекули ДНК, утворилися димери між двома тимінами. На світлі за участю фермента ДНК-фотоліази структура ДНК відновилася. Як називається цей тип репарації?",["Фоторепарація","Ексцизійна репарація","Рекомбінативна репарація","Дореплікативна репарація","Реплікативна репарація"],0],["У дитини дворічного віку спостерігається підвищена чутливість до ультрафіолетового опромінення. На відкритих ділянках шкіри відзначаються гіперемія та набряк, сухість, місцями атрофія. В результаті дослідження діагностовано пігментну ксеродерму – вроджену хронічну дистрофію шкіри. Наслідком порушення якого процесу є дана мутація?",["Репарації ДНК","Транскрипції","Реплікації ДНК","Посттрансляційної модифікації білків","Трансляції"],0],["Під час подвоєння материнського ланцюга фрагмента ДНК: АТТ-ГГЦ-ГЦТ-ТАЦ синтезувався дочірній ланцюг ТАА-ЦЦГ-ЦГА-ААТ. Спрацювала система відновлення пошкодженої ділянки. Як називається це явище?",["Реплікативна репарація","Постреплікативна репарація","Дореплікативна репарація","Неекцизійна репарація","Реплікація"],0],["На клітину, що знаходиться на стадії інтерфази, подіяли ультрафіолетовим промінням, в результаті чого в мітохондріях припинився синтез АТФ. Який процес реплікації ДНК зазнає змін в першу чергу?",["Ініціація","Елонгація","Термінація","Процесинг","Сплайсинг"],0],["При вивченні клітинного циклу з використанням електронного мікроскопа було помічено, що в синтетичному періоді інтерфази в клітині подвоїлась кількість ДНК. Внаслідок чого це відбувається?",["Реплікації ДНК","Коагуляції ДНК","Денатурації ДНК","Дисоціації ДНК","Репарації ДНК"],0],["Вивчаючи хімічний склад ДНК у 1950 році, Ервін Чаргафф сформулював важливі положення щодо структури ДНК. Вкажіть, чому дорівнює кількість тиміну у молекулі ДНК.",["Кількості аденіну ДНК","Кількості гуаніну ДНК","Кількості цитозину ДНК","Кількості урацилу РНК","Кількості амінокислот білку"],0],["Реплікація ДНК лежить в основі мітозу та мейозу у людини, забезпечуючи нащадків генетичною інформацією розвитку, функціонування та поведінки. Стабільність організації ДНК обумовлює її здатність до самоподвоєння. Яка особливість хімічної організації ДНК забезпечує цю здатність?",["Комплементарність ланцюгів","Висока хімічна стійкість","Функціональна спеціалізація","Здатність утворювати комплекси з гістонами","Одноланцюговість"],0],["У хворих на пігментну ксеродерму шкіра чутлива до світла, тому що порушена ексцизійна репарація. Який саме процес зазнає змін у хворих?",["Синтез іРНК","Синтез первинної структури білка","Дозрівання іРНК","Відновлення молекули ДНК","Вирізання інтронів і з’єднання екзонів"],3],["Проводиться каріотипування клітин здорової людини. В каріотипі знайдено дрібну акроцентричну непарну хромосому. Це може бути:",["Y-хромосома","X-хромосома","Хромосома групи A","Хромосома групи B","Хромосома групи C"],0],["В хромосомному наборі жінки виявлено хромосому, в якій плечі p і q мають однакову довжину. До якого морфологічного типу належить ця хромосома?",["Акроцентричний","Субметацентричний","Телоцентричний","Субакроцентричний","Метацентричний"],4],["У клітинах людини під дією ультрафіолетового випромінювання відбулося пошкодження молекули ДНК. Реалізувалася система відновлення пошкодженої ділянки молекули ДНК по непошкодженому ланцюгу за допомогою специфічного ферменту. Як називається це явище?",["Репарація","Дуплікація","Реплікація","Ініціація","Термінація"],0],["Серед органічних речовин клітини знайдено полімер, який складається з десятків, сотень і тисяч мономерів. Молекула здатна самовідтворюватись та бути носієм інформації. За допомогою рентгеноструктурного аналізу виявлено, що молекула складається з двох спірально закручених ниток. Вкажіть цю сполуку:",["ДНК","РНК","Целюлоза","Вуглевод","Гормон"],0],["У лабораторії група дослідників експериментально отримала без’ядерцеві мутантні клітини. Синтез яких сполук буде в них порушений у першу чергу?",["Рибосомних РНК","Транспортних РНК","Ліпідів","Моносахаридів","Полісахаридів"],0] chanisms for correction of damaged DNA molecules. This process is called:",["Reparation","Transcription","Translation","Replication","Processing"],0],["Nucleolus organizers of human chromosomes 13-15, 21, 22 include about 200 gene clusters that synthesize RNA. These chromosomal regions contain the information on the following type of RNA:",["rRNA","tRNA","mRNA","snRNA","tRNA + rRNA"],0],["Under the influence of physical factors there can develop defects in a DNA molecule. Ultraviolet irradiation, for instance, can cause development of dimers. Dimers are two adjacent pyrimidine bases joined together. Name these bases:",["Thymine and cytosine","Adenine and thymine","Guanine and cytosine","Adenine and guanine","Guanine and thymine"],0],["Patients suffering from xeroderma pigmentosum have extremely photosensitive skin due to disrupted excision repair. Specify the process that is affected in such patients:",["Repair of DNA molecule","Synthesis of iRNA","Maturation of iRNA","Synthesis of protein primary structure","Intron extraction and exon connection"],0],["Amino acids join to each other in ribosomes of granular endoplasmic reticulum. Knowing the sequence of amino acids and applying genetic code, it is possible to determine the sequence of nucleotides in:",["mRNA","Introns","Proteins","Carbohydrates","rRNA"],0],["Among organic substances of a cell there is a polymer composed of dozens, hundreds, and thousands of monomers. This molecule is capable of self-reproduction and can be an information carrier. X-ray structure analysis shows this molecule to consist of two complementary spiral threads. Name this compound:",["DNA","RNA","Cellulose","Carbohydrate","Hormone"],0],["During cell analysis, their cytoplasm was determined to have high content of aminoacyl tRNA synthetase. This enzyme ensures the following process:",["Amino acid activation","Repair","Elongation","Transcription","Replication"],0],["Ability to divide is characteristic of procariotic and eukariotic cells. Pro мах?",["3’ до 5’ полімеразна активність ДНК-полімерази δ","3’ до 5’ екзонуклеазна активність ДНК-полімерази γ","Праймазна активність ДНК-полімерази α","5’ до 3’ полімеразна активність ДНК-полімерази III","3’ до 5’ екзонуклеазна активність ДНК-полімерази δ"],4],["The proliferation of cytotoxic T-cells is markedly impaired upon infection with a newly discovered human immunodeficiency virus, designated HIV-V. The defect has been traced to the expression of a viral-encoded enzyme that inactivates a host-cell nuclear protein required for DNA replication. Which protein is a potential substrate for the viral enzyme?",["TATA-box binding protein (TBP)","Cap binding protein (CBP)","Catabolite activator protein (CAP)","Acyl-carrier protein (ACP)","Single-strand binding protein (SBP)"],4],["Проліферація цитотоксичних Т-клітин помітно погіршується при інфікуванні нововиявленим вірусом імунодефіциту людини, що позначається як ВІЛ-V. Дефект простежується до експресії ферменту, кодованого вірусом, який інактивує ядерний білок клітин-господарів, необхідний для реплікації ДНК. Який білок є потенційним субстратом для вірусного ферменту?",["ТАТА-зв’язуючий білок (TBP)","CAP-зв’язуючий білок (CBP)","Катаболітичний активаторний білок (CAP)","Білок-ацил-носій (ACP)","Однониткoвий зв’язуючий білок (SBP)"],4],["The deficiency of an excision endonuclease may produce an exquisite sensitivity to ultraviolet radiation in xeroderma pigmentosum. Which of the following functions would be absent in a patient deficient in this endonuclease?",["Removal of introns","Removal of pyrimidine dimers","Protection against DNA viruses","Repair of mismatched bases during DNA replication","Repair of mismatched bases during transcription"],1],["Дефіцит вирізаючої ендонуклеази може призвести до надмірної чутливості до ультрафіолетового випромінювання при пігментній ксеродермі. Які з наступних функцій були б відсутні у пацієнта з недостатністю цієї ендонуклеази?",["Видалення інтронів","Видалення димерів піримідину","Захист ДНК від вірусів","Репарація невідповідних основ під час реплікації ДНК","Відновлення невідповідних основ під час транскрипції"],1],["Single-strand breaks in DNA are frequently due to reactive oxygen species damaging the deoxyribose residues of the sugar phosphate backbone. This type of break is repaired by a series of enzymes that reconstruct the sugar and ultimately reform the phosphodiester bonds between nucleotides. Which class of enzyme catalyses the formation of the phosphodiester bond in DNA repair?",["DNA glycosylases","DNA helicases","DNA ligases","DNA phosphodiesterases","DNA polymerases"],2],["Одноланцюгові розриви в ДНК є найпоширенішим типом пошкодження ДНК. Ці розриви часто викликані реактивними видами кисню, що пошкоджують залишки дезоксирибози та фосфату. Цей тип розриву відновлюється серією ферментів, які реконструюють моносахарид і в кінцевому підсумку відновлюють фосфодиефірні зв’язки між нуклеотидами. Який клас ферментів каталізує відновлення фосфодиефірних зв’язків під час репарації?",["ДНК-глікозилази","Гелікази ДНК","ДНК-лігази","Фосфодіестерази ДНК","ДНК-полімерази"],2],["A lethal mutation occurs in a bacterium, rendering it incapable of replicating its chromosome. Because of this mutation, DNA synthesis produces many short fragments of DNA that have RNA sequences at their 5’ ends. The mutation is most likely in a gene encoding which of the following?",["DNA gyrase","DNA helicase","DNA ligase","DNA polymerase I","Primase"],3],["У бактерії сталася летальна мутація, наслідком якої є нездатність реплікації бактеріальної хромосоми. Результатом цієї мутації є те, що під час реплікації ДНК утворюються багато коротких фрагментів, що містять фрагменти РНК у їх 5’ кінці. Яку молекулу кодує ген, де відбулася мутація?",["ДНК-гіраза","ДНК-геліказа","ДНК-лігаза","ДНК-полімераза I","Праймаза"],3],["A 45-year-old man is diagnosed with cancer of the proximal portion of the colon. His father died of colon cancer at the age of 52. He has 3 siblings. His 55-year-old brother has not been diagnosed with colon cancer, but his 57-year-old sister has an endometrial carcinoma, and his other sister died of ovarian cancer. A diagnosis of hereditary nonpolyposis colorectal cancer (HNPCC) is made. Which of the following types of mutations most likely occurred in this family?",["A mutation causing defects in the mismatch repair system","A point mutation in the gene coding for an excision exonuclease","A reciprocal translocation between chromosomes 8 and 14","Associated with the Epstein-Barr virus","Loss of the retinoblastoma (RB) tumor suppressor gene"],0],["У 45-річного чоловіка діагностовано рак проксимального відділу товстої кишки. Його батько помер від цієї ж хвороби у віці 52 роки. Він має трьох родичів. Його 55-річний старший брат здоровий, а 57-річна старша сестра має карциному ендометрія, інша сестра померла від раку яєчника. Був встановлений спадковий неполіпозний колоректальний рак. Яка із перерахованих мутацій найбільш ймовірно спостерігається у цій сім’ї?",["Мутація, що викликає дефект у системі репарації","Точкова мутація гена, що кодує вирізаючу ендонуклеазу","Реципрокна транслокація між 8 і 14 хромосомами","Пов’язана із вірусом Епштейна-Бара","Втрата пухлинного супресора гена ретинобластоми"],0]]},{"n":"Заняття №3","q":[["Зчитування спадкової інформації з гена розпочинається з синтезу про-іРНК на фрагменті матричного ланцюга ДНК. Де відбувається цей процес у клітинах еукаріот?",["У ядрі","У цитоплазмі","У рибосомах","У центросомі","У лізосомі"],0],["Біохімічний аналіз амінокислотного складу щойно синтезованих поліпептидів показав, що в процесі трансляції перша амінокислота в кожному білку одна і та ж. Назвіть її:",["Серин","Гістидин","Метіонін","Ізолейцин","Фенілаланін"],2],["У клітину проник вірус грипу. Трансляція під час біосинтезу вірусного білка в клітині буде здійснюватися:",["На полірибосомах","У ядрі","На каналах гладенької ендоплазматичної сітки","У лізосомах","У клітинному центрі"],0],["Молекула зрілої інформаційної РНК має меншу довжину, ніж відповідний ген молекули ДНК. Неінформативні послідовності нуклеотидів про-іРНК видаляються під час процесингу. Яку назву мають ці ділянки?",["Транскриптони","Мутони","Екзони","Інтрони","Кластери"],3],["Яка амінокислота із нижченаведених кодується одним триплетом:",["Аланін","Серин","Лізин","Лейцин","Метіонін"],4],["На рибосомах відбувається трансляція. Рибосома дійшла до кодону УАА. Цей кодон у процесі біосинтезу поліпептиду не розпізнається жодною т-РНК, тому синтез поліпептидного ланцюга закінчився. Зробіть висновок, сигналом чого є кодон УАА:",["Термінації","Посттрансляційної модифікації","–","Ініціації","Елонгації"],0],["В ядрі клітини з молекули незрілої і-РНК утворилася молекула зрілої і-РНК, яка має менший розмір, ніж незріла і-РНК. Сукупність етапів цього перетворення має назву:",["Трансляція","Процесинг","Рекогніція","Реплікація","Термінація"],1],["Існують різні рівні регуляції експресії генів в еукаріотичній клітині. На якому рівні процес контролюють енхансери?",["Транскрипція","Трансляція","Посттрансляційна модифікація","Процесинг","Реплікація"],0],["У загальному вигляді генетичний апарат еукаріот є таким: екзон-інтрон-екзон. Така структурно-функціональна організація гена зумовлює особливості транскрипції. Якою буде про-і-РНК відповідно до згаданої схеми?",["Екзон-екзон-інтрон","Екзон-інтрон","Екзон-інтрон-екзон","Інтрон-екзон","Екзон-екзон"],2],["У процесі реалізації гена в ознаку приймають участь усі види РНК. Визначте РНК і її функцію за такими ознаками: має від 300 до 3000 нуклеотидів, масу від кількох сотень тисяч до двох мільйонів дальтон, існує у вигляді двох фракцій (зрілої і її попередника) та розташована між двома субодиницями рибосом.",["м-РНК – приймає участь у трансляції","р-РНК – забезпечує транскрипцію","т-РНК – визначає процес ініціації","р-РНК – забезпечує відщеплення білка від рибосом","т-РНК – приймає участь в активації амінокислот"],0],["Мутагенні чинники можуть мати специфічну форму впливу. Наприклад, акридини індукують зміщення рамки зчитування за рахунок вставок або втрат нуклеотидів. Як називаються мутації, пов’язані зі збільшенням або зменшенням генетичного матеріалу?",["Дуплікації і делеції","Генокопії і фенокопії","Лідируючі і відстаючі","Спонтанні і індуковані","Спадкові і не спадкові"],0],["Під час аналізу фрагменту ДНК, що був синтезований в процесі полімеразної ланцюгової реакції, було виявлено, що до його складу входить 180 пар нуклеотидів. Яку кількість мономерів білка кодує цей фрагмент?",["60","90","2","120","180"],0],["У хворого виявлено зниження вмісту іонів магнію, які потрібні для прикріплення рибосом до гранулярної ендоплазматичної сітки. Відомо, що це призводить до порушення біосинтезу білка. Який саме етап біосинтезу білка буде порушено?",["Трансляція","Транскрипція","Реплікація","Активація амінокислот","Термінація"],0],["Було доведено, що молекула незрілої і-РНК (про-і-РНК) містить більше триплетів, ніж знайдено амінокислот у синтезованому білку. Це пояснюється тим, що трансляції у нормі передує:",["Процесинг","Ініціація","Репарація","Мутація","Реплікація"],0],["Встановлено, що деякі сполуки, наприклад, токсини грибів та деякі антибіотики, можуть пригнічувати активність РНК-полімерази. Порушення якого процесу відбувається в клітині у випадку пригнічення даного ферменту?",["Транскрипція","Процесинг","Реплікація","Трансляція","Репарація"],0],["У клітині в гранулярній ЕПС відбувається етап трансляції, при якому спостерігається просування і-РНК щодо рибосоми. Амінокислоти з’єднуються пептидними зв’язками в певній послідовності – відбувається біосинтез поліпептиду. Послідовність амінокислот у поліпептиді буде відповідати послідовності:",["Кодонів і-РНК","Нуклеотидів т-РНК","Антикодонів т-РНК","Нуклеотидів р-РНК","Антикодонів р-РНК"],0],["Синтез і-РНК проходить на матриці ДНК з урахуванням принципу комплементарності. Якщо триплети у ДНК наступні – АТГ-ЦГТ, то відповідні кодони і-РНК будуть:",["УАЦ-ГЦА","АУГ-ЦГУ","АТГ-ЦГТ","УАГ-ЦГУ","ТАГ-УГУ"],0],["В ході експерименту було продемонстровано підвищення активності β-галактозидази після внесення лактози до культурального середовища з E. coli. Яка ділянка лактозного оперону стає розблокованою від репресора за цих умов?",["Оператор","Промотор","Структурний ген","Регуляторний ген","Праймер"],0],["Для вивчення локалізації біосинтезу білка в клітинах миші ввели мічені амінокислоти аланін та триптофан. Біля яких органел буде спостерігатися накопичення мічених амінокислот?",["Рибосоми","Гладенька ЕПС","Клітинний центр","Лізосоми","Апарат Гольджі"],0],["Молекула інсуліну складається із двох поліпептидних ланцюгів, що містять 21 та 30 амінокислот відповідно. Як називається матрична іРНК, що є шаблоном для синтезу даного гормону?",["Моноцистронна","Поліцистронна","Дицистронна","Транспортна","Рибосомальна"],0],["Під час реплікації фрагмента ДНК: АТТ-ГГЦ-ГЦТ-ТАЦ синтезувався дочірній ланцюг ТАА-ЦЦГ-ЦГА-ААТ. Яку властивість генетичного коду порушено?",["Колінеарність","Універсальність","Триплетність","Надлишковість","Неперекривність"],0],["Одним із центральних процесів метаболізму клітини, пов’язаних із потоком речовини, енергії та інформації, є синтез білка – формування складної молекули білка-полімера з амінокислот-мономерів. Як називається процес, що відбувається з білком після його утворення?",["Посттрансляційна модифікація","Транскрипція","Трансляція","Елонгація","Термінація"],0],["На початковому етапі транскрипції РНК-полімераза просувається вздовж нитки ДНК від промотора до термінатора. Послідовність ДНК від промотора до термінатора побудована з інформативних і неінформативних зон. Як називається процес з’єднання інформативних ділянок після вирізання неінформативних?",["Сплайсинг","Реплікація","Репарація","Процесинг","Трансляція"],0],["Вірус імунодефіциту людини може, паразитуючи в лімфоциті, застосовувати для своїх потреб генетичну систему лімфоцита, його білок-синтезуючий апарат. Завдяки якій властивості генетичного коду це можливо?",["Універсальність","Виродженість","Триплетність","Колінеарність","Неперекривність"],0],["До генетичної консультації звернулося молоде подружжя із проханням визначити особистість батька їх дитини. Чоловік стверджує, що дитина не схожа на нього і не може бути його. Що лежить в основі методу полімеразної ланцюгової реакції, завдяки якому можна визначити особистість?",["Місенс-мутація","Ампліфікація генів","Рекомбінація генів","Трансдукція","Делеція нуклеотидів"],1],["Транскрипція під час біосинтезу білка йде з ділянок еухроматину. Які зміни в цитоплазмі клітин виникають в разі зростання кількості еухроматину?",["Зменшується кількість полісом","Зростає активність лізосом","Зменшується активність клітинного центру","Зростає частка агранулярної ендоплазматичної сітки","Зростає кількість рибосом"],4],["Спадкова інформація зберігається в ДНК, але безпосередньої участі в синтезі клітинних білків ДНК не приймає. Який процес забезпечує реалізацію спадкової інформації в поліпептидний ланцюг?",["Утворення т-РНК","Трансляція","Утворення і-РНК","Реплікація","Утворення р-РНК"],1],["У результаті інтоксикації в епітеліальній клітині слизової оболонки порожнини рота не синтезуються ферменти, що забезпечують сплайсинг. Яка причина припинення біосинтезу білка в цьому випадку?",["Не утворюється зріла і-РНК","Не синтезується АТФ","Не утворюється р-РНК","Не активуються амінокислоти","Порушено транспорт амінокислот"],0],["У клітину людини в гранулярну ендоплазматичну сітку до рибосом доставлена і-РНК, що містить як екзонні, так і інтронні ділянки. Який процес НЕ ВІДБУВАЄТЬСЯ?",["Процесинг","Реплікація","Транскрипція","Трансляція","Пролонгація"],0],["В клітині відбувається процес трансляції. Коли рибосома доходить до кодонів УАА, УАГ або УГА, синтез поліпептидного ланцюга закінчується. Ці кодони у процесі біосинтезу поліпептиду не розпізнаються жодною т-РНК і тому є сигналом:",["Термінації","Посттрансляційної модифікації","Початку транскрипції","Елонгації","Ініціації"],0],["При цитологічних дослідженнях було виявлено велику кількість різних молекул т-РНК, які доставляють амінокислоти до рибосом. Кількість різних типів т-РНК у клітині буде дорівнювати кількості:",["Триплетів, що кодують амінокислоти","Нуклеотидів","Амінокислот","Білків, синтезованих у клітині","Різних типів і-РНК"],0],["Хворому на туберкульоз легень призначено рифампіцин, який пригнічує фермент РНК-полімеразу на стадії ініціації такого процесу:",["Транскрипція","Трансляція","Термінація","Елонгація","Реплікація"],0],["У дослідах англійського мікробіолога Гриффітса було проілюстровано включення чужорідної ДНК у геном клітини-хазяїна, що призвело до зміни її структурних і функціональних властивостей. Як називається це явище?",["Трансформація","Трансдукція","Реплікація","Кросинговер","Кон’югація"],0],["Formation of ribosome subunits in a cell was disturbed in course of an experiment (by means of activated mutagenic factors). This will have an effect on the following metabolic process:",["Protein biosynthesis","Carbohydrate biosynthesis","ATP synthesis","Photosynthesis","Biological oxidation"],0],["It was revealed that T-lymphocytes were affected by HIV. What type of synthesis is catalyzed by virus enzyme – reverse transcriptase (RNA-dependent DNA polymerase)?",["Virus information RNA on the matrix of DNA","DNA on virus ribosomal RNA","Viral DNA on DNA matrix","DNA on the matrix of virus mRNA","mRNA on the matrix of virus protein"],3],["RNA-polymerase B(II) is blocked due to amanitine poisoning (poison of death-cup). What does it disturb?",["Synthesis of t-RNA","Reverse transcription","Primers synthesis","Synthesis of m-RNA","Maturation of m-RNA"],3],["Protein synthesis occurs in several stages. During one of them, messenger RNA is being synthesized on one of the strands of a DNA segment. Name this process:",["Elongation","Transcription","Translation","Replication","Terminator"],4],["In the structure of prokaryotic DNA operons there is a fragment, to which RNA polymerase attaches at the stage of transcription initiation. Name this fragment:",["Operator gene","Primary transcript","Regulator gene","Promoter","Structural gene"],3],["RNA that contains AIDS virus penetrated into a leukocyte and by means of reverse transcriptase forced a cell to synthesize a viral DNA. Upon what is this process based on?",["Operon depression","Convariant replication","Reverse translation","Reverse transcription","Operon repression"],3],["It was found out that some compounds, for instance fungi toxins and some antibiotics can inhibit activity of RNA-polymerase. What process will be disturbed in a cell in case of inhibition of this enzyme?",["Reparation","Transcription","Processing","Translation","Replication"],1],["It was proved that a molecule of immature mRNA (precursor mRNA) contained more triplets than amino acids found in the synthesized protein. What normally precedes translation and is the reason for that?",["Initiation","Replication","Processing","Mutation","Reparation"],2],["You are studying functions of a bacteria operon. The operator gene has been released from the protein. What process will start in the cell immediately after this?",["Transcription","Repression","Replication","Processing","Translation"],0],["Inside a human cell the informational RNA containing both exons and introns was delivered to the granular endoplasmic reticulum to the ribosomes. What process does NOT take place?",["Processing","Replication","Transcription","Translation","Prolongation"],0],["During reproduction of some RNA-containing viruses that cause tumors in animals, genetic information can be transmitted in the opposite direction from the RNA to the DNA via a specific enzyme. The enzyme of reverse transcription is called:",["Reverse transcriptase","DNA polymerase","Ligase","Primase","Topoisomerase"],0],["Genetic information is stored in DNA but does not participate directly in protein synthesis within cells. What process ensures transfer of genetic information into polypeptide chain?",["Translation","Transcription","tRNA synthesis","rRNA synthesis","Replication"],0],["A man is a carrier of HIV that is an RNA virus. The cells of this patient synthesize viral DNA. This process is based on:",["Reverse transcription","Replication","Transcription","Repair","Translation"],0],["Testosterone and its analogs increase the mass of skeletal muscles that allows to use them for treatment of dystrophy. Due to interaction of the hormone with what cell substance is this action caused?",["Membrane receptors","Proteins-activators of transcription","Ribosomes","Nuclear receptors","Chromatin"],1],["At the stage of translation in the rough endoplasmic reticulum, the ribosome moves along the mRNA. Amino acids are joined together by peptide bonds in a specific sequence, and thus polypeptide synthesis takes place. The sequence of amino acids in a polypeptide corresponds to the sequence of:",["mRNA codons","tRNA nucleotides","tRNA anticodons","rRNA nucleotides","rRNA anticodons"],0],["General structure of eukaryotic genes is as follows: exon-intron-exon. Such functional structure of a gene leads to certain specifics of the transcription process. What sequence will correspond with precursor mRNA (immature)?",["Exon-intron-exon","Exon-exon-intron","Exon-exon","Intron-exon","Exon-intron"],0],["Genetic structure of eukaryote is «exon-intron-exon». This structure-functional organization of gene caused transcription peculiarities. What will be m-RNA (mature) according to the scheme?",["Intron-exon","Exon-intron","Exon-exon-intron","Exon-intron-exon","Exon-exon"],4],["Infectious diseases are treated with antibiotics (streptomycin, erythromycin, chloramphenicol). They inhibit the following stage of protein synthesis:",["Translation","Transcription","Replication","Processing","Splicing"],0],["Streptomycin and other aminoglycosides prevent the joining of formyl-methionyl-tRNA by bonding with the 30S ribosomal subunit. This effect leads to disruption of the following process:",["Translation initiation in procaryotes","Translation initiation in eucaryotes","Transcription initiation in procaryotes","Transcription initiation in eucaryotes","Replication initiation in procaryotes"],0],["A patient with pulmonary tuberculosis is prescribed rifampicin that inhibits RNA-polymerase enzyme at the stage of initiation of the following process:",["Transcription","Translation","Termination","Replication","Elongation"],0],["A patient has low rate of magnesium ions that are necessary for fixation of ribosomes to the rough endoplasmic reticulum. It is known that it causes disturbance of protein biosynthesis. At what stage is protein biosynthesis impaired?",["Replication","Termination","Transcription","Translation","Amino acid activation"],3],["Biochemical analysis of amino acid contents of freshly synthesized polypeptides shows that in the process of their translation the first amino acid in each of these proteins will be the same. Name this amino acid.",["Isoleucine","Histidine","Methionine","Serine","Phenylalanine"],2],["Formation of large amount of immunoglobulins with various antigen specificity from a small number of genes occurs due to:",["Recombination","Translocation","Replication","Deletion","Transcription"],0],["The process of translation occurs in a ribosome. The ribosome reached a UAA codon. No tRNA can recognize this codon in the process of polypeptide biosynthesis, which is why the synthesis of the polypeptide chain stopped. The UAA codon is a signal for:",["Codomination","Initiation","Termination","Post-translational modification","Elongation"],2],["Reading of hereditary information encoded within a gene begins with pre-mRNA synthesis on a fragment of DNA matrix chain. Where does this process occur in the eukaryotic cells?",["Ribosomes","Golgi complex","Centrosomes","Nucleus","Cytoplasm"],3],["The molecules of mRNA in a cell are the carriers of genetic information about the sequence in which certain amino acids must attach to each other. What is coded within the mRNA molecules?",["Primary structure of lipids","Primary structure of polynucleotides","Primary structure of carbohydrates","Primary structure of protein","Secondary structure of carbohydrates"],3],["Endonuclease activation and chromatin fragmentation are characteristic features of eukaryotic cell death by apoptosis. Which of the following chromosome structures would most likely be degraded first in an apoptotic cell?",["Barr body","10-nm fiber","30-nm fiber","Centromere","Heterochromatin"],1],["Активація ендонуклеази та фрагментація хроматину є характерними ознаками загибелі еукаріотичних клітин шляхом апоптозу. Які з наступних хромосомних структур, швидше за все, будуть деградовані першими в апоптотичній клітині?",["Тільце Барра","10-нм волокна","30-нм волокна","Центромера","Гетерохроматин"],3],["Transcription of the following sequence of the tryptophan operon occurs in the direction indicated by the arrow. What would be the base sequence of the mRNA produced? DNA: 3′ CGTCAGC 5′ … 5′…GCAGTCG…3′",["5′ GCAGUCG…3′","5′ CGUGAGC 3′","5′ GCUGACG…3′","5′ CGUCAGC 3′","5′ CGUGAGC 3′"],0],["The base sequence of codons 57-58 in the cytochrome β5 reductase gene is CAGCGC. The mRNA produced upon transcription of this gene will contain which sequence?",["GCGCTG","CUGCGC","GCGCUG","CAGCGC","GUCGCG"],3],["Базова послідовність кодонів 57-58 в гені редуктази цитохрому β5 є CAGCGC. Яку послідовність нуклеотидів буде містити іРНК, утворена при транскрипції цього гена?",["GCGCTG","CUGCGC","GCGCUG","CAGCGC","GUCGCG"],3],["A gene encodes a protein with 150 amino acids. There is one intron of 1,000 bps, a 5′-untranslated region of 100 bp, and a 3′-untranslated region of 200 bp. In the final processed mRNA, how many bases lie between the start AUG codon and the final termination codon?",["1,750","750","650","450","150"],3],["Ген кодує білок з 150 амінокислотами. Існує один інтрон 1000 bps, 5′-нетранслювана область 100 bp і 3′-нетранслювана область 200 bp. У зрілій іРНК, скільки азотистих основ міститься між старт-кодоном AUG і кінцевим кодоном термінації?",["1,750","750","650","450","150"],3],["In the genetic code of human nuclear DNA, one of the codons specifying the amino acid tyrosine is UAC. Another codon specifying this same amino acid is?",["AAC","UAG","UCC","AUG","UAU"],4],["У генетичному коді людської ядерної ДНК одним з кодонів, що визначає амінокислоту тирозин, є UAC. Іншим кодоном, що вказує на ту ж амінокислоту, є:",["AAC","UAG","UCC","AUG","UAU"],4],["A prokaryotic operon codes for 2 enzymes and 1 regulatory protein. The operon is expressed only in the presence of a particular sugar. Initial mapping of the operon has differentiated the nontranscribed sequences from the transcribed sequences. Deletion of 10 nucleotides from one of the nontranscribed sequences results in transcription of the operon in both the presence and absence of the sugar. Which of the following sequences was most likely affected?",["Activator binding site","Activator gene","Operator","Promoter","Repressor gene"],2],["Оперон прокаріот містить гени, що кодують 2 ферменти та білок-регулятор. Експресія оперона можлива лише за наявності специфічного вуглеводу. Дослідження показало, що оперон містить послідовності нуклеотидів, з яких відбувається транскрипція, та ті, що не транскрибуються. Втрата 10 нуклеотидів з однієї ділянки оперона, що не транскрибується, веде до транскрипції за присутності та відсутності вуглеводу. Яка з перелічених частин оперона була ймовірно уражена?",["Сайт зв’язування активатора","Ген активатор","Оператор","Промотор","Ген репресор"],2]]},{"n":"Заняття №4","q":[["На одній зі стадій клітинного циклу хромосоми досягають полюсів клітини, деспіралізуються, навколо них формуються ядерні оболонки, відновлюється ядерце. У якій фазі мітозу перебуває клітина?",["Телофаза","Метафаза","Профаза","Прометафаза","Інтерфаза"],0],["Соматичні клітини людини – диплоїдні (2n хромосом). Проте поліплоїдні клітини червоного кісткового мозку (мегакаріоцити) можуть мати до 64
