ули виявлені нейтрофільні лейкоцити з однією «барабанною паличкою». Наявність якого синдрому можна запідозрити у хлопчика?",["Синдром Клайнфельтера","Синдром Дауна","Синдром Шерешевського-Тернера","Синдром Едвардса","Синдром трисомії Х"],0],["При дослідженні амніотичної рідини, одержаної при амніоцентезі (прокол амніотичної оболонки), виявлені клітини, ядра яких містять статевий хроматин (тільце Барра). Про що з зазначеного це може свідчити?",["Трисомія","Генетичні порушення в розвитку плода","Розвиток плода жіночої статі","Розвиток плода чоловічої статі","Поліплоїдія"],2],["У новонародженої дитини виявлено наступну патологію: аномалія розвитку нижньої щелепи та гортані, що супроводжується характерними змінами голосу, а також мікроцефалія, вада серця, чотирипалість. Найбільш імовірною причиною таких аномалій є делеція:",["Короткого плеча 5-ої хромосоми","Короткого плеча 7-ої хромосоми","Короткого плеча 9-ої хромосоми","Короткого плеча 11-ої хромосоми","21-ої хромосоми"],0],["Для діагностування деяких хромосомних хвороб використовують визначення статевого хроматину. Назвіть хворобу, при якій потрібне це визначення:",["Синдром Шерешевського-Тернера","Хвороба Дауна","Гемофілія","Трисомія Е","Хвороба Брутона"],0],["При проведенні амніоцентезу в клітинах плоду виявлено по 2 тільця статевого хроматину (тільця Барра). Для якого захворювання характерна дана ознака?",["Трисомія Х","Синдром Клайнфельтера","Синдром Шерешевського-Тернера","Синдром Дауна","Синдром Патау"],0],["При обстеженні 2-місячної дитини педіатр звернула увагу, що плач дитини нагадує котячий крик. Діагностовані мікроцефалія і вада серця. За допомогою цитогенетичного методу з’ясований каріотип дитини 46,XX,5p-. Дане захворювання є наслідком такого процесу:",["Делеція","Дуплікація","Інверсія","Транслокація","Плейотропія"],0],["До медико-генетичної консультації звернулася жінка за рекомендацією гінеколога з приводу відхилень фізичного і статевого розвитку. В ході мікроскопії клітин слизової оболонки ротової порожнини не знайдено статевого хроматину. Який найбільш імовірний діагноз?",["Синдром Шерешевського-Тернера","Хвороба Дауна","Синдром Клайнфельтера","Хвороба Реклінгаузена","Трисомія за Х-хромосомою"],0],["An 18-year-old girl comes to her physician with concern about her health because she has not achieved menarche. She denies any significant weight loss, changes in mood, or changes in her appetite. She mentions that her mother told her about mild birth defects, but she cannot recall the specifics. Past medical history and family history are benign. On physical examination, the patient is short in stature, has a short and webbed neck and wide chest. Staining of buccal smear reveals absence of Barr bodies in the nucleus of epithelial cells. A urine pregnancy test is negative. Which of the following genetic disorders is the most likely cause of this patient’s condition?",["Turner syndrome","Patau syndrome","Klinefelter syndrome","Edwards syndrome","Cri du chat («cat-cry») syndrome"],0],["Analysis of amniotic fluid that was obtained as a result of amniocentesis (puncture of amniotic sac) revealed cells the nuclei of which contain sex chromatin (Barr’s body). What can it be evidence of?",["Genetic disorders of fetus development","Polyploidy","Trisomy","Development of female fetus","Development of male fetus"],3],["Cytogenetic analysis established that the patient had the 47,XYY karyotype. The extra chromosome in the karyotype has a centromere located very close to one of the chromosome ends so that one chromosomal arm is much shorter than the other one. Such a chromosome is called:",["Acrocentric","Metacentric","Submetacentric","Telocentric","Submetacentric with a satellite"],0],["A patient has chromosomal disorder – Klinefelter syndrome – with the total number of chromosomes being 47 (karyotype XXY). The patient’s somatic cells contain sex chromatin in the amount equal to X chromosome number minus 1. In somatic cells, sex chromatin is called:",["Doehle bodies","Barr bodies","Jolly bodies","Mallory bodies","Cabot rings"],1],["A 42-year-old man was examined. He has a slightly feminized stature, testicular atrophy, and sparse hair growth on his face and chest. His neutrophilic leukocytes contain drumstick-shaped sex chromatin. What is the most likely diagnosis in the case?",["Phenylketonuria","Klinefelter syndrome","Patau syndrome","Trisomy X","Down syndrome"],1],["Cytogenetic examination of a patient with reproductive dysfunction revealed normal karyotype 46,XY in some cells, but most cells have karyotype of Klinefelter’s syndrome – 47,XXY. How is such cell heterogeneity called?",["Mosaicism","Duplication","Transposition","Monomorphism","Inversion"],0],["The examination of a youth with mental retardation revealed eunuchoid body construction and genitals underdevelopment. The cells of the oral cavity contained chromatin. What method of genetic investigation should be performed to make a more specified diagnosis?",["Population-statistic","Dermatoglyphics","Biochemical","Cytological","Clinico-genealogical"],3],["An 18-year-old man with asthenic body constitution: tall, narrow shoulders, broad pelvis and with poor hair on his face came to the geneticist. There was marked mental retardation. The preliminary diagnosis was Klinefelter’s syndrome. What method of medical genetics can confirm the diagnosis?",["Dermatoglyphics","Population-statistic","Genealogic","Cytogenetic","Pedigree analysis"],3],["A 40-year-old pregnant woman underwent amniocentesis. The examination of fetus karyotype revealed 47,XY,+21. What pathology of the fetus was found out?",["Phenylketonuria","Patau’s disease","Klinefelter’s syndrome","Down’s syndrome","Turner’s disease"],3],["An individual is characterized by rounded face, broad forehead, a mongolian type of eyelid fold, flattened nasal bridge, permanently open mouth, projecting lower lip, protruding tongue, short neck, flat hands, and stubby fingers. What diagnosis can be put to the patient?",["Klinefelter’s syndrome","Down’s syndrome","Turner’s syndrome","Supermales","Alkaptonuria"],1],["A 32-year-old man is tall, he has gynecomastia, adult woman pattern of hair distribution, high voice, mental deficiency, sterility. What is it necessary to analyze to clarify the provisional diagnosis?",["Genealogy","Blood group","Leukogram","Karyotype","Spermatogenesis"],3],["Autopsy of a newborn boy revealed polydactyly, microcephalia, cheiloschisis and uranoschisis as well as hypertrophy of parenchymatous organs. These defects correspond with the description of Patau’s syndrome. What is the most probable cause of this pathology?",["Trisomy of the 21st chromosome","Trisomy of the 18th chromosome","Trisomy of the 13th chromosome","Partial monosomy","Nondisjunction of sex chromosomes"],2],["Medical examination at the military registration and enlistment office revealed that a 15-year-old boy was tall, with eunuchoid body proportions, gynecomastia, female pattern of pubic hair distribution. The boy had also fat deposits on the thighs, no facial hair, high voice, subnormal intelligence quotient. Which karyotype corresponds with this disease?",["46,XY","47,XXX","46,XX","47,XXY","45,XO"],3],["Sex chromosomes of a woman didn’t separate and move to the opposite poles of a cell during gametogenesis (meiosis). The ovum was fertilized by a normal spermatozoon. Which chromosomal disease can be found in her child?",["Down’s syndrome","Klinefelter’s syndrome","Edward’s syndrome","Patau’s syndrome","Cat cry syndrome"],1],["During the examination of a two-month-old boy a pediatrician noticed that the child’s cry sounds like cat’s mewing; he revealed also microcephalia and valvular defect. By means of cytogenetic method he determined the child’s karyotype – 46,XY,5p-. At what stage of mitosis was the patient’s karyotype analyzed?",["Metaphase","Prometaphase","Prophase","Anaphase","Telophase"],0],["There are trisomic, translocational and mosaic forms of Down’s syndrome. What method of human genetics can be applied to differentiate the said forms of Down’s syndrome?",["Cytogenetical","Gemellary","Genealogical","Biochemical","Population-statistical"],0],["An 8-month-old child has non-closed palate, a number of eye defects, microcephaly, disorder of cardiovascular system. Cytogenetic analysis revealed 47 chromosomes with an additional 13th chromosome. What diagnosis can be made on the basis of clinical observations and cytogenetic examinations?",["Patau’s syndrome","Cat cry syndrome","Edwards’ syndrome","Down’s syndrome","Klinefelter’s syndrome"],0],["Examination of a 7-year-old child revealed the following symptoms: small height, broad roundish face, closely placed eyes with narrow palpebral fissures, half-open mouth. Valvular defect has been also diagnosed. These clinical presentations are most likely typical for Down’s syndrome. Name the cause of such pathology:",["Trisomy of the 21 chromosome","Trisomy of the 13 chromosome","X-chromosome trisomy","Partial monosomy","Nondisjunction of sexual chromosomes"],0],["A patient has mental retardation, small height, brachydactyly, mongoloid slant. Analysis of his karyotype revealed trisomy 21. What chromosomal anomaly is it?",["Down’s disease","Klinefelter’s syndrome","Turner’s syndrome","Trisomy X","Specific fetopathy"],0],["Abnormal chromosome disjunction during meiosis resulted in formation of: an ovum with 22 autosomes and polar body with 24 chromosomes. If such an ovum would be fertilized with a normal spermatozoon (22 + X) the child might have the following syndrome:",["Turner’s syndrome","Klinefelter’s syndrome","Trisomy X","Down’s syndrome","None of the above"],0],["A 28-year-old woman consulted a doctor about sterility. Examination revealed underdeveloped ovaries and uterus, irregular menstrual cycle. Study of sex chromatin revealed 2 Barr’s bodies in most somatic cells. What chromosome disease is the most probable in this case?",["Triplo-X syndrome","Edwards’ syndrome","Patau’s syndrome","Klinefelter’s syndrome","Turner’s syndrome"],0],["A girl who was provisionally diagnosed with Turner’s syndrome came to a genetic consultation. The diagnosis can be specified by means of the following genetic method:",["Sex chromatin test","Genealogical","Hybridological","Biochemical","Dermatoglyphics"],0],["Detection of X-chromatin in somatic cells is used for the quick diagnosis of hereditary diseases associated with a change in the sex chromosome number. Vast majority of a man’s cells have three X-chromatin bodies. What is the man’s karyotype?",["49,XXXXY","45,X","46,XY","47,XXY","48,XXXY"],0],["Examination of an 18-year-old girl revealed the following features: ovarian hypoplasia, broad shoulders, narrow hips, shortening of the lower extremities, webbed neck. Mental development is normal. The patient has been diagnosed with Turner’s syndrome. What chromosomal abnormality does this patient have?",["Monosomy X","Trisomy X","Trisomy 13","Trisomy 18","Nullisomy X"],0],["Mother and father are healthy. Mother underwent amniocentesis for fetal karyotyping. The fetal karyotype turned out to be 45,X0. What syndrome can be expected in a newborn baby?",["Turner’s","Edwards’","Patau’s","Cri du chat","“Superwoman”"],0],["X-chromatin test of somatic cells is used for quick diagnostics of hereditary diseases caused by variations of sex chromosomes number. What is the karyotype of a male, whose cells mostly contain one X-chromatin body?",["47,XXY","45,X0","46,XY","48,XXXY","49,XXXXY"],0],["When examining a female patient a doctor observed the following: misshapen auricles, elevated palate, teeth growth disorder; mental retardation; no disruption of reproductive function. Provisional diagnosis is the “super woman” syndrome. Point out the karyotype of this disease.",["47,XXX","47,XXY","47,YYY","47,XYY","45,X0"],0],["Autosomal nondisjunction had occurred in a woman during meiosis. An ovum with the two copies of the 18th chromosome was formed. The ovum was impregnated by normal spermatozoon. The resulting child will suffer from:",["Edwards’ syndrome","Klinefelter’s syndrome","Patau’s syndrome","Turner’s syndrome","Down’s syndrome"],0],["A woman is diagnosed with Turner’s syndrome (karyotype 45,X0). How many autosomal pairs would her somatic cells contain?",["22","24","23","44","45"],0],["Mother of a 2-year-old child with delayed physical and mental development has made an appointment with the genetic consultation. What method allows the doctor to rule out chromosomal abnormalities?",["Cytogenetical","Population-statistical","Genealogical","Gemellary","Biochemical"],0],["The mother’s karyotype has 47 chromosomes. It was determined that translocation of chromosome 21 to chromosome 14 had occurred. What disorder is likely to be observed in the child of this woman if the father’s karyotype is normal?",["Patau syndrome","Klinefelter syndrome","Turner syndrome","Morris syndrome (androgen insensitivity)","Down syndrome"],4],["Clinical presentations of a woman allowed provisionally diagnosing her with X polysomy. Cytogenetic method is applied to clarify the diagnosis. The diagnosis will be confirmed if the patient’s karyotype is:",["47,XXX","48,XXXY","48,XXYY","47,XXY","46,XX"],0],["An 18-year-old girl comes to her physician with concern about her health because she has not achieved menarche. She denies any significant weight loss, changes in mood, or changes in her appetite. She mentions that her mother told her about mild birth defects, but she cannot recall the specifics. Past medical history and family history are benign. On physical examination, the patient is short in stature, has a short and webbed neck and wide chest. Staining of buccal smear reveals absence of Barr bodies in the nucleus of epithelial cells. A urine pregnancy test is negative. Which of the following genetic disorders is the most likely cause of this patient’s condition?",["Klinefelter syndrome","Cri-du-chat (“cat-cry”) syndrome","Edwards syndrome","Turner syndrome","Patau syndrome"],3],["A young man has come to the genetic consultation. He complains of abnormalities in his physical and reproductive development. Microscopy of his oral mucosa cells shows one Barr body. What karyotype is the most likely in this young man?",["47,XXY","47,XY,21+","47,XYY","45,XO","47,XY,18+"],0],["A couple had a child with Down’s disease. Mother is 42 years old. This disease is most probably caused by the following impairment of prenatal development:",["Gametopathy","Blastopathy","Embryopathy","Non-specific fetopathy","Specific fetopathy"],0],["A 35-year-old male patient has been referred by an andrologist for the genetic counselling for the deviations of physical and mental development. Objectively: the patient is tall, has asthenic constitution, gynecomastia, mental retardation. Microscopy of the oral mucosa cells revealed sex chromatin (single Barr body) in 30% of cells. What is the most likely diagnosis?",["Klinefelter syndrome","DiGeorge syndrome","Down syndrome","Recklinghausen’s disease","Cushing pituitary basophilism"],0],["A 25-year-old patient consulted a doctor about dysmenorrhea and infertility. Examination revealed that the patient was 145 cm high and had underdeveloped secondary sex characteristics, alar folds on the neck. Cytological study didn’t reveal any Barr bodies in the somatic cells. What diagnosis was made?",["Turner’s syndrome","Klinefelter syndrome","Morris syndrome","Trisomy X syndrome","None of the above"],0],["Amniocentesis revealed two sex chromatin bodies (Barr bodies) in each cell of the sample. What disease is this character typical for?",["Trisomy X","Klinefelter syndrome","Turner’s syndrome","Down’s syndrome","Patau syndrome"],0],["A female patient sought medical-genetic consultation. Physical examination revealed pterygium colli deformity (webbed neck), broad chest, underdeveloped breasts. Study of buccal epithelium cells revealed no X-chromatin in the nuclei. This indicates that the patient has the following syndrome:",["Turner’s","Klinefelter’s","Patau’s","Down’s","Edwards’"],0],["A 2-year-old boy is diagnosed with Down syndrome. What chromosomal changes may be the cause of this disease?",["Trisomy 21","Trisomy 13","Trisomy X","Trisomy 18","Monosomy X"],0],["Sex chromatin was detected during examination of a man’s buccal epithelium. It is characteristic of the following chromosome disease:",["Klinefelter’s syndrome","Down’s disease","Turner’s syndrome","Triple X syndrome","Hypophosphatemic rickets"],0],["A 45-year-old woman gave birth to a boy with cleft maxilla (cleft lip and palate). On additional examination there are significant disturbances of the boy’s nervous, cardiovascular, and visual systems. Karyotype investigation allowed diagnosing the patient with trisomy 13. What syndrome is present in the boy?",["Patau","Down","Klinefelter","Turner","DiGeorge"],0],["A woman gave birth to twins. One of them was provisionally diagnosed with Cri-du-chat syndrome that manifests as underdeveloped laryngeal muscles and “meowing” voice timbre. This syndrome occurs because of chromosome mutation. What method can verify or refute this diagnosis?",["Biochemical","Amniocentesis","Population statistics","Twin study","Cytogenetic"],4],["A girl with multiple abnormalities of development was born. She had scaphocephaly, hyper-tonicity, low-set, malformed ears, micrognathia, blepharoptosis, polydactyly and rocker-bottom feet, congenital heart defects. The preliminary diagnosis was Edwards syndrome. What method of medical genetics can confirm the diagnosis?",["Cytogenetic","Population-statistic","Gemellary","Genealogic","Dermatoglyphics"],0],["A baby was born with small skull, round face and a long protruding tongue, short, flat-bridge nose, a mongolian type of eyelid fold, short neck, short phalanges, flat hands, transverse palm crease. Chromosome analysis has shown that the karyotype is 47,XY,21+. What disorder does this child have?",["Down syndrome","Patau syndrome","Turner syndrome","Edwards syndrome","Phenylketonuria"],0],["A patient was diagnosed with Klinefelter’s syndrome. The patient with this disease will have the karyotype (47,XXY). How many sex chromosomes are in this complement?",["Three","Zero","One","Two","Forty four"],0],["Healthy parents gave birth to a child with cleft lip and cleft palate, abnormal thumbs, and microcephaly. The child’s karyotype is 47,18+. What mutation caused this hereditary disease?",["Polyploidy","Autosomal monosomy","Monosomy X","Autosomal trisomy","Nullisomy"],3],["A child was born with numerous maldevelopments: cleft lip and palate, microphthalmia, syndactyly, heart and kidney diseases. The child died at the age of one month. The child’s karyotype was 47,13+. What type of mutation caused this condition?",["Duplication","Polyploidy","Trisomy","Inversion","Translocation"],2],["Healthy parents with unremarkable family history have a child with multiple developmental defects. Cytogenetic analysis revealed the trisomy 13 in the somatic cells (Patau syndrome). What phenomenon has caused the defects?",["Recessive mutation","Abnormal gametogenesis","Dominant mutation","Somatic mutation","Chromosomal mutation"],4],["A 26-year-old woman has produced two children with Down syndrome, and she has also had two miscarriages. Which of the following would be the best explanation?",["Her first cousin has Down syndrome","Her husband is 62 years old","She carries a reciprocal translocation involving 14 and 18 chromosomes","She carries a Robertsonian translocation involving 14 and 21 chromosomes","She was exposed to multiple x-rays as a child"],3],["26-річна жінка народила двох дітей із синдромом Дауна і у неї також було два викидні. Що з наступного є найімовірнішим поясненням цього?",["Її двоюрідний брат має синдром Дауна","Її чоловікові 62 роки","Вона носій реципрокної транслокації між 14 і 18 хромосомами","Вона носій робертсонівської транслокації між 14 і 21 хромосомами","В дитинстві вона зазнала рентгенівського випромінювання"],3],["A woman brings her 16-year-old daughter to a physician because she has not yet begun menstruating. Although her parents are both 1.75 meters, the patient is 1.5 meters and has always been below the 50th percentile in height. Physical examination reveals no breast development. She has no problems in school and is of normal intelligence. What is the most likely underlying basis for her condition?",["A 45,X karyotype","A balanced reciprocal translocation","A balanced Robertsonian translocation","Two Barr bodies","Deletion of an imprinted locus"],0],["Жінка приводить свою 16-річну дочку до лікаря зі скаргами на відсутність менструацій у неї. Незважаючи на те, що батьки мають ріст 1,75 м, пацієнтка ростом 1,5 м. Молочні залози у дівчини недорозвинені. В школі проблеми з навчанням відсутні, а її інтелектуальний розвиток у нормі. Який найімовірніший діагноз?",["Каріотип 45,X","Збалансована транслокація","Збалансована робертсонівська транслокація","Два тільця Барра","Делеція ділянки імпринтингу"],0],["A 5-year-old, mentally retarded boy is brought to the city from a rural community for evaluation. A careful history reveals mental retardation in a number of other family members, especially the males. Physical examination is remarkable for a long face with large ears, a large jaw, and bilateral enlargement of the testes. This presentation is suggestive of:",["Down syndrome","Edward’s syndrome","Fragile X syndrome","Klinefelter syndrome","Turner syndrome"],2],["5-річний розумово-відсталий хлопчик направлений в місто для огляду. З анамнезу відомо, що у сім’ї дитини є кілька осіб зі схожими порушеннями, переважно чоловічої статі. При фізичному огляді у дитини виявлено довге обличчя, великі вуха, великі щелепи, білатеральне збільшення яєчок. Для якої спадкової хвороби характерні вказані особливості?",["Синдром Дауна","Синдром Едвардса","Синдром ламкої Х-хромосоми","Синдром Клайнфельтера","Синдром Тернера"],2],["On physical examination, a newborn is found to have micrognathia, a prominent occiput, low-set ears, and rocker-bottom feet. There is very little mental development during the first months of life, and the infant dies of cardiac complications after 8 months. A complete karyotype of this child would show which of the following?",["45,X","XXY","Trisomy 13","Trisomy 18","Trisomy 21"],3],["При фізичному огляді у новонародженого було виявлено мікрогнатію, виступаючу потилицю, низько посаджені вуха, ноги-качалки. Протягом перших місяців життя спостерігалася затримка у розумовому розвитку, дитина померла у віці 8 місяців від серцево-судинних ускладнень. Вкажіть каріотип описаної дитини:",["45,X","XXY","Трисомія 13","Трисомія 18","Трисомія 21"],3],["Examination of a late aborted fetus reveals a small head, small eyes, prominent cleft lip and palate, 6 fingers on each hand, and dextrocardia. The developmental abnormalities noted in this fetus were probably due to which of the following?",["5p-","45,XO","Trisomy 13","Trisomy 18","Trisomy 21"],2],["Дослідження абортивного матеріалу виявило у плода маленьку голову, маленькі очі, виступаючу заячу губу і вовчу пащу, шість пальців на кожній руці, декстрокардію. З якими змінами кількості хромосом пов’язана ця хвороба?",["5p-","45,X0","Трисомія за 13-ою хромосомою","Трисомія за 18-ою хромосомою","Трисомія за 21-ою хромосомою"],2],["У лейкоцитах хворого хлопчика з каріотипом 46,XY виявлена вкорочена 21 хромосома. До виникнення якого захворювання призводить така мутація?",["Хронічного білокрів’я","Хвороби Тея–Сакса","Фенілкетонурії","Синдрому Шерешевського-Тернера","Синдрому «крику кішки»"],0],["Під час обстеження дитини 7-ми років виявлено наступні ознаки: низький зріст, широке округле обличчя, близько розміщені очі із вузькими очними щілинами, напіввідкритий рот. Діагностовано також ваду серця. Ці клінічні ознаки найбільш характерні для хвороби Дауна. Вкажіть причину даної патології:",["Трисомія 21-ої хромосоми","Трисомія 13-ої хромосоми","Трисомія за Х-хромосомою","Часткова моносомія","Нерозходження статевих хромосом"],0],["Двомісячній дитині встановлено діагноз: синдром «котячого крику». Причиною цієї хвороби є делеція короткого плеча 5-ї автосоми. Яку загальну кількість хромосом виявлено у дитини?",["44","46","45","47","43"],1]]},{"n":"Заняття №11","q":[["На заняттях з молекулярної біології йде розгляд мутацій, які призводять до утворення аномального гемоглобіну. Яка заміна амінокислот відбувається при утворенні S-гемоглобіну, що спричиняє виникнення серповидноклітинної анемії?",["Глутамінова кислота валіном","Треонін лізином","Лізин глутаміном","Гістидин аргініном","Гліцин аспарагіном"],0],["У хворої дитини спостерігаються ознаки ахондроплазії (карликовості). Відомо, що це моногенне захворювання і ген, який відповідає за розвиток такої аномалії, домінантний. У рідного брата цієї дитини розвиток нормальний. За генотипом здорова дитина буде:",["aa","AABB","Aa","AA","AaBb"],0],["У людини діагностовано галактоземію – хворобу накопичення. Цю хворобу можливо діагностувати за допомогою наступного методу:",["Біохімічного","Цитогенетичного","Популяційно-статистичного","Близнюкового","Генеалогічного"],0],["Після народження у дитини виявлено позитивну реакцію сечі з 10% хлоридом заліза. Для якої спадкової патології це характерно?",["Цукровий діабет (спадкова форма)","Тирозиноз","Фенілкетонурія","Галактоземія","Алкаптонурія"],2],["Дитина 10-місячного віку, батьки якої брюнети, має світле волосся, дуже світлу шкіру та блакитні очі. Зовнішньо при народженні виглядала нормально, але протягом останніх 3 місяців спостерігалися порушення мозкового кровообігу, відставання у розумовому розвитку. Що може бути причиною такого стану?",["Глікогеноз","Гостра порфірія","Гістидинемія","Галактоземія","Фенілкетонурія"],4],["У дитини 6 місяців уповільнення моторного та психічного розвитку, посвітління шкірних покривів, волосся, райдужної оболонки очей, позитивна проба Фелінга. Яке спадкове захворювання виявлено у дитини?",["Фенілкетонурія","Альбінізм","Хвороба Дауна","Алкаптонурія","Галактоземія"],0],["У людини діагностовано галактоземію – хворобу накопичення. Внаслідок порушення якої клітинної структури виникла ця хвороба?",["Комплексу Гольджі","Лізосоми","Центросоми","Клітинного центру","Мітохондрії"],1],["Хлопчик 13 років скаржиться на загальну слабкість, запаморочення, втомлюваність. Спостерігається відставання у розумовому розвитку. В крові та сечі виявлено високу концентрацію валіну, ізолейцину, лейцину. Сеча специфічного запаху. Який найбільш імовірний діагноз?",["Хвороба кленового сиропу","Гістидинемія","Тирозиноз","Хвороба Аддісона","Базедова хвороба"],0],["У молодих здорових батьків народилася білява дівчинка з блакитними очима. У перші ж місяці життя у дитини розвинулися дратівливість, неспокій, порушення сну та харчування. Обстеження невропатолога показало відставання у розвитку дитини. Який метод генетичного обстеження слід застосувати для точного встановлення діагнозу дитини?",["Популяційно-статистичний","Цитологічний","Біохімічний","Близнюковий","Генеалогічний"],2],["Спостерігаючи за дитиною впродовж 1,5 року, мати стала помічати відставання у розумовому розвитку. Після ретельного обстеження у дитини було встановлено фенілкетонурію. Причиною цього захворювання може бути:",["Порушення будови структурних генів","Моносомія за Х-хромосомою","Недостатня кількість мітохондрій у клітинах","Зайва хромосома по 21 парі аутосом","Інша причина"],0],["Існує пряма залежність закономірностей успадкування та генетичної зумовленості прояву імунних реакцій організму людини, антигенної специфічності та імунітету. Яка наука вивчає ці процеси?",["Імуногенетика","Імунологія","Генетика","Імунопатологія","Екологічна генетика"],0],["Для ряду спадкових хвороб, які вважались невиліковними, з розвитком медичної генетики встановлено подавлення їх фенотипового прояву. В даний час це найбільше стосується:",["Фенілкетонурії","Анемії","Муковісцидозу","Цистинурії","Ахондроплазії"],0],["Фенілкетонурія – аутосомно-рецесивне захворювання, що супроводжується порушенням синтезу меланіну та адренергічних агоністів, розладами рухових функцій, розумовою відсталістю. Який метод вивчення спадковості людини слід використати з метою уточнення діагнозу?",["Біохімічний","Генеалогічний","Дерматогліфіки","Цитогенетичний","Популяційно-статистичний"],0],["У хворого на дні ока офтальмолог виявив пляму вишнево-червоного кольору поблизу виходу зорового нерва. Яке спадкове захворювання обміну речовин можна припустити у цього хворого?",["Хвороба Німана-Піка","Фенілкетонурія","Галактоземія","Хвороба Коновалова-Вільсона","Альбінізм"],0],["У хворого при обстеженні в сечі і крові знайдена фенілпіровиноградна кислота. З приводу чого і був встановлений діагноз – фенілкетонурія. Яким методом її визначили?",["Біохімічним","Статистичним","Близнюковим","Генеалогічним","Популяційним"],0],["Жінці був встановлений діагноз – хвороба Тея-Сакса, яка пов’язана з порушенням обміну речовин. Яке порушення обміну речовин викликає ця хвороба?",["Ліпідного","Мінерального","Вуглеводного","Амінокислотного","Білкового"],0],["Під час огляду дитини педіатр відзначив відставання у фізичному та розумовому розвитку. У сечі різко підвищений вміст кетокислоти, що дає якісну кольорову реакцію з хлорним залізом. Яке порушення обміну речовин було виявлено?",["Фенілкетонурія","Алкаптонурія","Тирозинемія","Цистинурія","Альбінізм"],0],["У дитини грудного віку спостерігається забарвлення склер, слизових оболонок. Виділяється сеча, яка темніє на повітрі. В крові та сечі виявили гомогентизинову кислоту. Що може бути причиною даного стану?",["Алкаптонурія","Альбінізм","Галактоземія","Цистинурія","Гістидинемія"],0],["Альбіноси погано переносять вплив сонця – засмага не розвивається, а з’являються опіки. Порушення метаболізму якої амінокислоти лежить в основі цього явища?",["Фенілаланін","Метіонін","Триптофан","Глутамінова","Гістидин"],0],["У новонародженої дитини на пелюшках виявлені темні плями, що свідчать про утворення гомогентизинової кислоти. З порушенням обміну якої речовини це пов’язано?",["Тирозин","Галактоза","Метіонін","Холестерин","Триптофан"],0],["У культурі клітин, отриманих від хворого з лізосомною патологією, виявлено накопичення значної кількості ліпідів у лізосомах. При якому з перелічених захворювань має місце це порушення?",["Хвороба Тея-Сакса","Подагра","Фенілкетонурія","Хвороба Вільсона-Коновалова","Галактоземія"],0],["До лікарні надійшла дитина 6-ти років. Під час обстеження було виявлено, що дитина не може фіксувати погляд, не слідкує за іграшками, на очному дні відзначається симптом «вишневої кісточки». Лабораторні аналізи показали, що у мозку, печінці та селезінці – підвищений рівень гангліозиду. Яке спадкове захворювання у дитини?",["Хвороба Тея-Сакса","Хвороба Вільсона-Коновалова","Синдром Шерешевського-Тернера","Хвороба Німана-Піка","Хвороба Мак-Ардля"],0],["У хворого діагностовано алкаптонурію. Вкажіть фермент, дефект якого є причиною цієї патології:",["Оксидаза гомогентизинової кислоти","Фенілаланінгідроксилаза","Глутаматдегідрогеназа","Піруватдегідрогеназа","ДОФА-декарбоксилаза"],0],["Батьки дитини 3-х років звернули увагу на потемніння кольору її сечі при відстоюванні. Об’єктивно: температура у нормі, шкірні покриви чисті, рожеві, печінка не збільшена. Назвіть імовірну причину даного стану:",["Алкаптонурія","Гемоліз","Синдром Іценка-Кушинга","Фенілкетонурія","Подагра"],0],["У новонародженої дитини спостерігаються: судоми, блювання, жовтяниця, специфічний запах сечі. Лікар-генетик висловив підозру про спадкову хворобу обміну речовин. Який метод дослідження необхідно використати для постановки точного діагнозу?",["Біохімічний","Дерматогліфіка","Популяційно-статистичний","Цитогенетичний","Близнюковий"],0],["При алкаптонурії відбувається надмірне виділення гомогентизинової кислоти із сечею. З порушенням метаболізму якої амінокислоти пов’язано виникнення цього захворювання?",["Тирозин","Фенілаланін","Аланін","Метіонін","Аспарагін"],0],["У хлопчика 2-х років спостерігаються збільшення в розмірах печінки та селезінки, катаракта. В крові підвищена концентрація цукру, але тест толерантності до глюкози в нормі. Спадкове порушення обміну якої речовини є причиною цього стану?",["Галактоза","Фруктоза","Глюкоза","Мальтоза","Сахароза"],0],["Мати зауважила занадто темну сечу у її 5-річної дитини. Дитина скарг не висловлює. Жовчних пігментів у сечі не виявлено. Поставлено діагноз алкаптонурія. Дефіцит якого ферменту має місце у дитини?",["Оксидаза гомогентизинової кислоти","Фенілаланінгідроксилаза","Тирозиназа","Оксидаза оксифенілпірувату","Декарбоксилаза фенілпірувату"],0],["У дитини з білявим волоссям, блідою шкірою відмічається збільшений тонус м’язів, судоми та розумова відсталість. В крові підвищений рівень фенілаланіну. Який з перелічених методів необхідно застосувати для встановлення діагнозу цієї ензимопатії?",["Біохімічний","Цитогенетичний","Популяційно-статистичний","Електрофізіологічний","Генеалогічний"],0],["У дитини 6-ти місяців спостерігається різке відставання в психомоторному розвитку, бліда шкіра з екзематозними змінами, біляве волосся, блакитні очі, напади судом. Найточніше встановити діагноз у цієї дитини дозволить визначення в крові і сечі концентрації такої речовини:",["Фенілпіруват","Триптофан","Гістидин","Лейцин","Валін"],0],["Внаслідок дефіциту УФО-ендонуклеази порушується репарація ДНК і виникає таке захворювання, як:",["Пігментна ксеродерма","Альбінізм","Фенілкетонурія","Подагра","Серповидноклітинна анемія"],0],["До лікаря звернувся хворий зі скаргами на непереносимість сонячної радіації. Мають місце опіки шкіри та порушення зору. Попередній діагноз: альбінізм. Порушення обміну якої амінокислоти відзначається у цього пацієнта?",["Тирозин","Пролін","Лізин","Аланін","Триптофан"],0],["У медико-генетичну консультацію звернулося подружжя. У них є 5-річна дитина, яка хвора на фенілкетонурію. Жінка перебуває на 15-му тижні вагітності. Родину цікавить питання про наявність фенілкетонурії у майбутньої дитини. Яким інвазивним методом можливо пренатально встановити діагноз?",["Амніоцентезом","Цитогенетичним","Генеалогічним","Гібридологічним","Ультразвуковим"],0],["На судово-медичну експертизу поступила кров дитини та особи чоловічої статі для встановлення батьківства. Які компоненти необхідно ідентифікувати в дослідній крові?",["ДНК","тРНК","рРНК","іРНК","мРНК"],0],["До лікаря звернулася дівчинка 8 років із наступними клінічними симптомами: розумова відсталість, підвивих кришталиків, кісткові деформації, тромбоемболія та ознаки серцево-судинної патології. В сечі виявлено гомоцистин. Яке захворювання діагностував лікар?",["Гомоцистинурію","Хворобу Тея-Сакса","Фенілкетонурію","Синдром Дауна","Фруктоземію"],0],["У пацієнта діагностовано захворювання, яке успадковується за аутосомно-рецесивним типом. Воно зумовлене нестачею ферменту гомогентизинази, внаслідок чого відбувається накопичення в організмі та екскреція із сечею гомогентизинової кислоти. Що це за захворювання?",["Алкаптонурія","Фенілкетонурія","Альбінізм","Гемофілія","Гістидинемія"],0],["У новонародженого спостерігається ранішній кашель при пробудженні або кашель після їжі. При дослідженні секрету слинних залоз виявлено в’язкий слиз. Яке найбільш ймовірне захворювання у дитини?",["Муковісцидоз","Галактоземія","Фенілкетонурія","Гемофілія","Фруктоземія"],0],["Для діагностики хромосомних, гематологічних спадкових хвороб і внутрішньоутробних інфекцій використовують метод пренатальної діагностики, який передбачає взяття крові з пуповини. Назвіть цей метод.",["Кордоцентез","Амніоцентез","Генеалогічний","Дерматогліфіки","Біохімічний"],0],["Відомо, що одним із клінічних проявів хвороби кленового сиропу є специфічний запах сечі та поту. Діагноз підтверджується тонкошаровою хроматографією амінокислот. Який метод генетики використовують у цьому випадку?",["Біохімічний","Цитогенетичний","Імунологічний","Генеалогічний","Популяційно-статистичний"],0],["У 10-річного хлопчика з диспропорційною статурою та аномаліями скелету виявлено еритематозні плями на верхніх та нижніх кінцівках. З анамнезу відомо, що у хворого діагностовано міопію та катаракту. При обстеженні виявлено, що при швидкому русі голови тремтять райдужки ока. Яку генну хворобу можна запідозрити?",["Гомоцистинурію","Гістидинемію","Алкаптонурію","Хворобу кленового сиропу","Фенілкетонурію"],0],["Відомо, що у більшості випадків уроджені порушення обміну речовин у дітей клінічно проявляються (або можуть бути виявленими) в період новонародженості. Ранні клінічні прояви звичайно неспецифічні і можуть бути віднесені до перинатальної патології. До порушення обміну яких речовин відноситься фенілкетонурія?",["Амінокислот","Вуглеводів","Ліпідів","Пігментів","Гормонів"],0],["Відомо, що у більшості випадків уроджені порушення обміну речовин у дітей клінічно проявляються (або можуть бути виявленими) в період новонародженості. Ранні клінічні прояви звичайно неспецифічні і можуть бути віднесені до перинатальної патології. До порушення обміну яких речовин відноситься хвороба Тея-Сакса?",["Амінокислот","Вуглеводів","Ліпідів","Пігментів","Гормонів"],2],["Відомо, що у більшості випадків уроджені порушення обміну речовин у дітей клінічно проявляються (або можуть бути виявленими) в період новонародженості. Ранні клінічні прояви звичайно неспецифічні і можуть бути віднесені до перинатальної патології. До порушення обміну яких речовин відноситься хвороба «кленового сиропу»?",["Амінокислот","Вуглеводів","Ліпідів","Пігментів","Гормонів"],0],["Відомо, що у більшості випадків уроджені порушення обміну речовин у дітей клінічно проявляються (або можуть бути виявленими) в період новонародженості. Ранні клінічні прояви звичайно неспецифічні і можуть бути віднесені до перинатальної патології. До порушення обміну яких речовин відноситься галактоземія?",["Амінокислот","Вуглеводів","Ліпідів","Пігментів","Гормонів"],1],["Відомо, що у більшості випадків уроджені порушення обміну речовин у дітей клінічно проявляються (або можуть бути виявленими) в період новонародженості. Ранні клінічні прояви звичайно неспецифічні і можуть бути віднесені до перинатальної патології. До порушення обміну яких речовин відноситься фруктоземія?",["Амінокислот","Вуглеводів","Ліпідів","Пігментів","Гормонів"],1],["У лікарню звернулася мати, дитина якої неохоче приймає молоко, у неї відсутній апетит, часто виникає блювота, здуття живота. При обстеженні виявлено, що немовля недобирає у масі та зрості, методом уринолізису виявлено галактозурію. Яке спадкове захворювання виявлено у дитини?",["Галактоземію","Фруктоземію","Фенілкетонурію","Мукополісахаридоз","Муковісцидоз"],0],["При обстеженні 10-місячної дитини було встановлено спадкове захворювання, патогенез якого зумовлений блоком у процесі розпаду галактози до глюкози. Діагноз захворювання було уточнено шляхом проведення тонкошарової хроматографії вуглеводів. Яке спадкове захворювання у дитини?",["Галактоземія","Алкаптонурія","Фенілкетонурія","Мукополісахаридоз","Муковісцидоз"],0],["При обстеженні дитини 1-го року було встановлено захворювання, яке успадковується за аутосомно-рецесивним типом і пов’язане з порушенням обміну цистину. Клінічно захворювання проявляється симптомокомплексом, який включає гіпотрофію, втрату апетиту, неспроможність дитини стояти та ходити. В рогівці і нирках виявлено кристали цистеїну, в сечі – білок і глюкозу. Яке спадкове захворювання у дитини?",["Цистинурія","Алкаптонурія","Фенілкетонурія","Мукополісахаридоз","Муковісцидоз"],0],["При огляді новонародженої дитини лікар виявив наступну клінічну картину: судоми, блювота, гіпотонія, жовтяниця, специфічний запах сечі, ацидоз, припинення росту. Який метод діагностики необхідно застосувати, щоб поставити діагноз?",["Біохімічний метод","Цитогенетичний метод","Близнюковий метод","Популяційно-статистичний метод","Метод дерматогліфіки"],0],["З метою встановлення батьківства було взято кров дитини та ймовірного батька. Які хімічні компоненти необхідно ідентифікувати в досліджуваній крові?",["ДНК","іРНК","рРНК","мРНК","тРНК"],0],["У крові дитини виявлено високий вміст галактози, концентрація глюкози знижена. Спостерігається катаракта, розумова відсталість, розвивається жирове переродження печінки. Яке захворювання має місце у дитини?",["Фруктоземія","Лактоземія","Стероїдний діабет","Галактоземія","Цукровий діабет"],3],["У хлопчика трьох років спостерігається затримка розумового розвитку, сліпота, неврологічні розлади. Діагностовано хворобу Тея-Сакса. Які речовини накопичуються в головному мозку дитини?",["Глікоген","Цереброзиди","Гангліозиди","Сульфатиди","Стероїди"],2],["У хворої дитини від рідин організму, особливо від сечі, йде специфічний запах. Це пов’язано з порушенням обміну таких амінокислот, як лейцин, ізолейцин і валін. Який діагноз поставить дитині лікар?",["Фруктозурія","Хвороба «кленового сиропу»","Алкаптонурія","Галактоземія","Фенілкетонурія"],1],["До лікаря-генетика звернувся юнак 18 років астенічної будови тіла: вузькі плечі, широкий таз, високий зріст. У пацієнта виражена розумова відсталість. Було поставлено попередній діагноз: синдром Клайнфельтера. За допомогою якого методу медичної генетики можна підтвердити цей діагноз?",["Дерматогліфіки","Близнюкового","Цитогенетичного","Популяційно-статистичного","Генеалогічного"],2],["У медико-генетичну консультацію звернулась мати 2-річної дитини з відставанням у фізичному і розумовому розвитку. При обстеженні дитини лікарем виявлено риси обличчя, характерні для алкогольного синдрому плода. З анамнезу відомо, що мати впродовж вагітності вживала алкоголь. Який метод дослідження дозволить виключити хромосомну патологію?",["Цитогенетичний","Генеалогічний","Біохімічний","Цитологічний","Дерматогліфічний"],0],["У хлопчика 8 років хвороба Леша-Наяна. У крові збільшена концентрація сечової кислоти. Порушення якого процесу є причиною цього спадкового захворювання?",["Розпаду пуринових нуклеотидів","Синтезу пуринових нуклеотидів","Утворення дезоксирибонуклеотидів","Синтезу піримідинових нуклеотидів","Розпаду піримідинових нуклеотидів"],0],["У новонародженої дитини вивих кришталика, довгі кінцівки з видовженими і тонкими пальцями, аневризма аорти, виділення із сечею окремих амінокислот. Для якого захворювання характерні дані ознаки?",["Синдрому Марфана","Фруктозурії","Галактоземії","Фенілкетонурії","Гіпофосфатемії"],0],["До клініки надійшла дитина віком 1,5 роки. Під час обстеження було відзначено недоумкуватість, розлади регуляції рухових функцій, слабка пігментація шкіри, у крові високий вміст фенілаланіну. Який найбільш вірогідний діагноз?",["Фенілкетонурія","Галактоземія","Тирозиноз","Синдром Дауна","Муковісцидоз"],0],["До лікарні звернулися батьки, дитина яких хворіє на галактоземію. Впродовж тривалого часу немовля лікували шляхом виключення із харчового раціону лактози. Що є критерієм ефективності лікування?",["Відсутність галактози в сечі","Присутність галактози в сечі","Збільшення кількості лейкоцитів у крові","Зменшення кількості еритроцитів у крові","Зменшення кількості тромбоцитів у крові"],0],["Хвора 46-ти років довгий час страждає на прогресуючу м’язову дистрофію (Дюшена). Зміни рівня якого ферменту крові є діагностичним тестом в даному випадку?",["Креатинфосфокіназа","Лактатдегідрогеназа","Піруватдегідрогеназа","Глутаматдегідрогеназа","Аденілаткіназа"],0],["У клінічно здорових батьків народилася дитина, хвора на фенілкетонурію (аутосомно-рецесивне спадкове захворювання). Які генотипи батьків?",["Aa × Aa","AA × AA","AA × Aa","Aa × aa","aa × aa"],0],["До лікарні доставлено дитину 2-х років з уповільненим розумовим і фізичним розвитком, що страждає на часте блювання після прийому їжі. У сечі визначена фенілпіровиноградна кислота. Наслідком якого порушення є дана патологія?",["Обмін амінокислот","Ліпідний обмін","Вуглеводний обмін","Водно-сольовий обмін","Фосфорно-кальцієвий обмін"],0],["У 12-річного хлопчика в сечі виявлено високий вміст усіх амінокислот аліфатичного ряду. При цьому відмічена найбільш висока екскреція цистину та цистеїну. Крім того, УЗД нирок показало наявність каменів у них. Яка патологія найбільш вірогідна?",["Цистинурія","Алкаптонурія","Цистит","Фенілкетонурія","Хвороба Хартнупа"],0],["У хворої дитини виявлена затримка розумового розвитку, збільшення печінки, погіршення зору. Лікар пов’язує ці симптоми з дефіцитом в організмі галактозо-1-фосфатуридилтрансферази. Який патологічний процес має місце у дитини?",["Галактоземія","Фруктоземія","Гіперглікемія","Гіпоглікемія","Гіперлактатацидемія"],0],["При хворобі Вільсона-Коновалова порушується транспорт міді, що призводить до накопичення цього металу в клітинах мозку та печінки. З порушенням синтезу якого білка це пов’язано?",["Церулоплазміну","Металотіонеїну","Транскобаламіну","Гаптоглобіну","Сидерофіліну"],0],["Біохімічний аналіз сироватки крові пацієнта з гепатолентикулярною дегенерацією (хвороба Вільсона-Коновалова) виявив зниження вмісту церулоплазміну. У цього пацієнта в сироватці крові буде підвищена концентрація таких іонів:",["Мідь","Кальцій","Фосфор","Калій","Натрій"],0],["Мати зауважила занадто темну сечу у її 5-річної дитини. Дитина скарг не висловлює. Жовчних пігментів у сечі не виявлено. Поставлено діагноз алкаптонурія. Дефіцит якого ферменту має місце у дитини?",["Оксидаза гомогентизинової кислоти","Фенілаланінгідроксилаза","Тирозиназа","Оксидаза оксифенілпірувату","Декарбоксилаза фенілпірувату"],0],["Одна з форм вродженої патології супроводжується гальмуванням перетворення фенілаланіну в тирозин. Біохімічною ознакою хвороби є накопичення в організмі деяких органічних кислот, у тому числі такої кислоти:",["Фенілпіровиноградна","Лимонна","Піровиноградна","Молочна","Глутамінова"],0],["У хворого виявлено вивих кришталика та павукоподібні пальці. Який синдром діагностує лікар, беручи до уваги ще й порушення розвитку сполучної тканини, форми кисті та стопи хворого?",["Дауна","Трисомії Х","Шерешевського-Тернера","Клайнфельтера","Марфана"],4],["Юнак віком 15 років скаржиться на загальну слабкість, запаморочення, швидку стомлюваність. Під час обстеження виявлено еритроцити зміненої форми, кількість їх знижена. Попередній діагноз: серповидноклітинна анемія. Яка амінокислотна заміна в гемоглобіні зумовлює розвиток цього патологічного стану?",["Валіну на глутамат","Глутамату на аспартат","Глутамату на аланін","Валіну на аспартат","Глутамату на валін"],4],["In some regions of South Africa there is a spread of sickle-shaped cell anemia, in which erythrocytes have the shape of a sickle as a result of substitution of glutamine by valine in the hemoglobin molecule. What is the cause of this disease?",["Transduction","Gene mutation","Genomic mutation","Crossing-over","Disturbance of mechanism of genetic information realization"],1],["A 6-year-old child was delivered to a hospital. Examination revealed that the child couldn’t fix his eyes, didn’t keep his eyes on toys, eye ground had the cherry-red spot sign. Laboratory analyses showed that brain, liver and spleen had a high rate of ganglioside glycometide. What congenital disease is the child ill with?",["Tay-Sachs disease","Turner’s syndrome","Wilson’s syndrome","Fragile syndrome","Down’s syndrome"],0],["An infant presents with colored sclerae and mucous membranes. The infant’s urine becomes dark when exposed to air. Homogentisic acid was detected in blood and urine. What disease is likely to be the cause of the infant’s condition?",["Alcaptonuria","Cystinuria","Albinism","Histidinemia","Galactosemia"],0],["Examination of a 12-year-old boy with developmental lag revealed achondroplasia: disproportional constitution with evident shortening of upper and lower limbs, as a result of growth disorder of epiphyseal cartilages of long tubal bones. What is the type of this disease?",["Inherited, dominant","Inherited, sex-linked","Inherited, recessive","Congenital","Acquired"],0],["Which of the following is an X-linked recessive disease?",["Acute intermittent porphyria","Duchenne muscular dystrophy","Huntington disease","Marfan syndrome"],1],["A 46-year-old female patient has a continuous history of progressive muscular (Duchenne’s) dystrophy. Which blood enzyme changes will be of diagnostic value in this case?",["Creatine phosphokinase","Lactate dehydrogenase","Pyruvate dehydrogenase","Glutamate dehydrogenase","Adenylate cyclase"],0],["Albinos can’t stand sun impact – they don’t acquire sun tan but get sunburns. Disturbed metabolism of what amino acid underlies this phenomenon?",["Histidine","Methionine","Tryptophan","Glutamic acid","Tyrosine"],4],["Healthy parents have got a fair-haired, blue-eyed girl. Irritability, anxiety, sleep and feeding disturbance developed in the first months of the infant’s life. Neurological examination revealed developmental lag. What method of genetic investigation should be used for exact diagnosis?",["Population-statistical","Cytological","Genealogical","Gemellary","Biochemical"],4],["A 1.5-year-old child presents with both mental and physical lag, decolorizing of skin and hair, decrease in catecholamine concentration in blood. When a few drops of 5% solution of trichloroacetic iron had been added to the child’s urine it turned olive green. What of the following pathology is the result of the amino acid metabolism?",["Tyrosinosis","Alkaptonuria","Phenylketonuria","Albinism","Xanthinuria"],2],["A 1.5-year-old child was taken to the hospital. The examination revealed dementia, disorder of motor functions regulation, hypopigmentation of skin, high rate of phenylalanine in blood. What is the most probable diagnosis?",["Phenylketonuria","Galactosemia","Tyrosinosis","Down’s syndrome","Mucoviscidosis"],0],["A 20-year-old patient complains of general weakness, dizziness, rapid fatigability. Examination results: Hb 80 g/l; microscopical analysis results: erythrocytes are deformed. These symptoms might be caused by:",["Sickle-cell anemia","Parenchymatous jaundice","Acute intermittent porphyria","Obturative jaundice","Addison’s disease"],0],["In the mountains some clinically healthy people present with anaemia symptoms. Blood test can reveal sickle cells. What is the genotype of such people?",["Aa","aa","AA","XcXc","XCXc"],0],["Analysis of a newborn’s urine revealed phenylpyruvic acid. Its presence in urine is associated with the following pathology:",["Phenylketonuria","Alkaptonuria","Albinism","Tyrosinosis","Gout"],0],["A 1.7-year-old child with a developmental delay and manifestations of self-aggression has the concentration of uric acid in blood at the rate of 1.96 millimole/l. What metabolic disorder is this typical for?",["Lesch-Nyhan syndrome","Podagra","Acquired immunodeficiency syndrome","Gierke’s disease","Cushing’s basophilism"],0],["A patient was diagnosed with a monogenic hereditary disease. Name this disease:",["Hemophilia","Hypertension","Peptic ulcer disease of the stomach","Poliomyelitis","Hymenolepiasis"],0],["Substitution of the glutamic acid on valine was revealed while examining initial molecular structure. For what inherited pathology is this symptom typical?",["Sickle-cell anemia","Thalassemia","Minkowsky-Shauffard disease","Favism","Hemoglobinosis"],0],["Nappies of a newborn have dark spots that witness of formation of homogentisic acid. Metabolic imbalance of which substance is it connected with?",["Tyrosine","Galactose","Methionine","Cholesterine","Tryptophane"],0],["A child’s blood presents high content of galactose, glucose concentration is low. There are such clinical symptoms as cataract, mental deficiency, adipose degeneration of liver. What disease is it?",["Galactosemia","Diabetes mellitus","Lactosemia","Steroid diabetes","Fructosemia"],0],["Examination of cell culture got from a patient with lysosomal pathology revealed accumulation of great quantity of lipids in the lysosomes. What of the following diseases is this disturbance typical for?",["Tay-Sachs disease","Gout","Phenylketonuria","Wilson disease","Galactosemia"],0],["Urine analysis of a 12-year-old boy reveals high concentration of all aliphatic amino acids with the highest excretion of cystine and cysteine. US of kidneys revealed kidney concrements. What is the most likely pathology?",["Cystinuria","Alkaptonuria","Cystitis","Phenylketonuria","Hartnup disease"],0],["A patient has been diagnosed with alkaptonuria. Choose an enzyme whose deficiency can be the reason for this pathology:",["Homogentisic acid oxidase","Phenylalanine hydroxylase","Glutamate dehydrogenase","Pyruvate dehydrogenase","Dioxyphenylalanine decarboxylase"],0],["In case of alkaptonuria, homogentisic acid is excreted in urine in large amounts. The development of this disease is associated with a disorder of metabolism of the following amino acid:",["Tyrosine","Phenylalanine","Alanine","Methionine","Asparagine"],0],["During a class in molecular biology, the mutations resulting in production of abnormal hemoglobin are being studied. What amino acid substitution occurs when S-hemoglobin is being produced, resulting in the development of sickle-cell anemia?",["Glutamic acid is substituted with valine","Threonine is substituted with lysine","Histidine is substituted with arginine","Glycine is substituted with asparagine","Lysine is substituted with glutamine"],0],["After a tooth extraction, a child developed bleeding that persisted for the next 6 hours. Analysis of the hemostasis system revealed a sharp decrease in the levels of blood coagulation factor VIII. What pattern of inheritance does this disease have?",["Autosomal-dominant","Autosomal-recessive","Dominant, sex-linked","Incomplete domination","Recessive, sex-linked"],4],["A sick child presents with high concentration of phenylpyruvate in urine (normally it is practically absent). Blood phenylalanine level is 350 mg/L (norm – 15 mg/L). What disease are these symptoms characteristic of?",["Phenylketonuria","Albinism","Tyrosinosis","Alkaptonuria","Gout"],0],["A 3-year-old girl with mental retardation has been diagnosed with sphingomyelin lipidosis (Niemann-Pick disease). In this condition the synthesis of the following substance is disturbed:",["Glycosyltransferase","Ceramides","Sphingosine","Gangliosides","Sphingomyelinase"],4],["A mother of a 4-month-old male infant brought him to pediatrician with complaints of food rejection and weight loss. He started having trouble latching onto his bottle. He has also become extremely lethargic. Examination reveals diminished muscle tone in all four limbs, and hepatosplenomegaly. An ophthalmoscopic exam reveals macular cherry red spots. During the next few weeks, hepatosplenomegaly progresses, the boy fails to thrive, and he continues to reject food. Chest X-ray shows a reticulonodular pattern and calcified nodules. Biopsy of the liver shows foamy histiocytes. Niemann-Pick disease is suspected. Which of the following is the most likely deficient enzyme in this patient?",["Sphingomyelinase","Glucose-6-phosphatase","Galactocerebrosidase","Phenylalanine-hydroxylase","Glucocerebrosidase"],0],["A 17-year-old high-school student comes to the school health clinic. She has missed her last menstrual period and is worried about being pregnant. In the past history, it is noted that she has sickle cell trait and mild asthma but is otherwise healthy. She has never been pregnant before and is sexually active with one boyfriend. They use barrier contraception on an irregular basis. She reports that her boyfriend once told her that he too had sickle cell trait. She is determined to continue with the pregnancy if the urine pregnancy test turns out to be positive. Her main concern is whether her child will have sickle cell anemia. At this stage, it is appropriate to counsel her that in cases where both parents have sickle cell trait the risk of having a baby born with sickle cell anemia is which of the following?",["5%","25%","50%","75%","100%"],1],["Fructosuria is known to be connected with inherited deficiency of fructose 1-phosphate aldolase. What product of fructose metabolism will accumulate in the organism resulting in toxic action?",["Fructose 1-phosphate","Glucose 1-phosphate","Glucose 6-phosphate","Fructose 1,6-biphosphate","Fructose 6-phosphate"],0],["A newborn develops dyspepsia after the milk feeding. When the milk is substituted by the glucose solution the dyspepsia symptoms disappear. The newborn has the subnormal activity of the following enzyme:",["Lactase","Invertase","Maltase","Amylase","Isomaltase"],0],["A 1-year-old boy came to the hospital. He was born healthy, but after 10 months he had paralysis of limbs. DNA diagnostics showed that there was an autosomal recessive mutation on the Hexosaminidase A (HEXA) gene in the chromosome 15. In brain is visible accumulation of ganglioside in the nerve cells. What is the name of this disease?",["Tay-Sachs disease","Mucoviscidosis","Phenylketonuria","Albinism","Sickle-cell anaemia"],0],["A 2-year-old boy came to the hospital with lung infection and greasy stool. DNA diagnostics showed that there was an autosomal recessive mutation on the gene cystic fibrosis transmembrane conductance regulator (CFTR). What is the name of this disease?",["Mucoviscidosis","Tay-Sachs disease","Phenylketonuria","Albinism","Sickle-cell anaemia"],0],["During examination of a 1-year-old child a disease was established, which is inherited in an autosomal recessive type and is associated with cystine metabolism. Clinically the disease manifests with a symptom complex that includes hypotrophy, loss of appetite, the inability of a child to stand and walk. In the cornea and kidney cystine crystals were detected, in urine – protein and glucose. What hereditary disease is in a child?",["Cystinuria","Alcaptonuria","Phenylketonuria","Mucopolysaccharidosis","Mucoviscidosis"],0],["17-річна школярка звернулася у шкільний медпункт із підозрою на вагітність, оскільки місячні не настали. З анамнезу відомо, що вона мала ознаки серповидноклітинної анемії та астму середньої важкості, але на даний час симптоми відсутні. Попередні вагітності заперечує, але відмічає, що знаходиться у нерегулярних інтимних стосунках з хлопцем та використовує бар’єрні засоби контрацепції. Дівчина відмічає, що її хлопець згадував про наявність ознак серповидноклітинної анемії function listView(){
  const k=listKind,list=listItems(k),title=k==="fav"?"Обрані питання":"Помилки";
  const cards=list.map(q=>`<div class="lc"><div class="fm">${esc(q.g)}</div><div class="lh"><div class="lq"><span class="ln">${q.n}.</span> ${esc(q.t)}</div><button class="star ${isFav(q.id)?"on":""}" data-id="${q.id}" onclick="toggleFav('${q.id}')" aria-label="В обрані">${isFav(q.id)?"★":"☆"}</button></div>${q.img?`<img class="fig" style="margin-top:10px" src="${q.img}" alt="">`:""}<div class="lo">${q.o.map((o,i)=>`<div class="lopt ${i===q.c?"c":""}"><b>${LET[i]})</b><span>${esc(o)}</span>${i===q.c?"<i>✓</i>":""}</div>`).join("")}</div></div>`).join("");
  $.innerHTML=`<div class="top"><button class="back" onclick="home()" aria-label="Назад">‹</button><h2 style="margin:0;flex:1">${title}</h2>${themeBtn()}</div>
  <div class="mut" style="margin:8px 4px">${k==="wrong"?esc(rsName())+" · ":""}Всього питань: <b>${list.length}</b></div>
  ${list.length?`<button class="go" style="margin:12px 0" onclick="${k==="fav"?"startFav()":"start('wrong')"}">Тренувати (${list.length})</button>${cards}`:`<div class="res" style="margin-top:14px"><div class="e">${k==="fav"?"⭐":"🎉"}</div><h1>Поки порожньо</h1><div style="color:var(--mut)">${k==="fav"?"Натискай зірочку біля питання під час проходження, щоб додати його сюди.":"Помилок немає, чудово!"}</div></div>`}`;
}
function openFav(){if(favs().length)startFav();else{view="fav";render();window.scrollTo(0,0)}}
function favView(){
  const list=QS.filter(q=>isFav(q.id));
  const items=list.map(q=>`<div class="fi"><div class="fm">${esc(q.g)} · питання №${q.n}</div><div class="ft">${esc(q.t)}</div><div class="fa">✓ ${esc(q.o[q.c])}</div><button class="star on" onclick="toggleFav('${q.id}')" aria-label="Прибрати з обраних">★</button></div>`).join("");
  $.innerHTML=`<div class="top"><button class="back" onclick="home()" aria-label="Назад">‹</button><h2 style="margin:0;flex:1">Обрані питання</h2>${themeBtn()}</div>
  ${list.length?`<button class="go" style="margin:14px 0" onclick="startFav()">Пройти обрані (${list.length})</button>${items}`:`<div class="res" style="margin-top:14px"><div class="e">⭐</div><h1>Поки порожньо</h1><div style="color:var(--mut)">Натискай зірочку біля питання під час проходження, щоб додати його сюди.</div></div>`}`;
}
const tgSel=()=>Array.isArray(P.s.tg)?P.s.tg:[];
function tgTog(i){const a=tgSel().slice(),k=a.indexOf(i);if(k>=0)a.splice(k,1);else a.push(i);P.s.tg=a;save();render()}
function tgAll(){P.s.tg=[];save();render()}
const tPool=()=>{const a=tgSel();return QS.filter(q=>!a.length||a.includes(q.gi))};
function startTest(n){const ids=shuf(tPool().map(q=>q.id)).slice(0,n);if(ids.length)startIds(ids,"test")}
const ring=(p,s)=>{const r=42,c=2*Math.PI*r;return`<svg class="ring" width="${s}" height="${s}" viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="${r}" fill="none" stroke-width="10"/><circle class="fg" cx="50" cy="50" r="${r}" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" font-size="23" font-weight="800">${p}%</text></svg>`};
function render(){
  applyTheme();
  $.className=view==="quiz"&&run&&run.ids.length&&!run.done?"q":"";
  if(view==="quiz")return quiz();
  if(view==="board")return boardView();
  if(view==="fav")return favView();
  if(view==="list")return listView();
  if(view==="map")return mapView();
  const S=st(),pct=S.tot?Math.round(S.seen/S.tot*100):0,nw=S.tot-S.seen,SA=stAll();
  const hist=P.h.slice(-5).reverse().map(h=>{const p=Math.round(h.ok/h.n*100);return`<div class="hi"><em>${new Date(h.t).toLocaleDateString("uk-UA",{day:"numeric",month:"short"})}</em><i><u style="width:${p}%"></u></i><b>${h.ok}/${h.n}</b></div>`}).join("");
  const chips=G.length>1?`<div class="chips"><button class="chip ${gsel<0?"on":""}" onclick="gsel=-1;rsAsk=false;render()">Усі</button>${G.map((g,i)=>`<button class="chip ${gsel===i?"on":""}" onclick="gsel=${i};rsAsk=false;render()">${esc(g.n)}</button>`).join("")}</div>`:"";
  $.innerHTML=`<div class="hero">${themeBtn()}<small>${me&&me.name?"Привіт, "+esc(me.name.split(" ")[0])+" 👋":"Привіт 👋"}</small><h1>Тренажер тестів</h1>
  <div class="hrow"><div class="rwrap">${ring(pct,104)}<div class="rcap">пройдено</div></div><div class="stats"><div><b>${S.ok}</b><span>вивчено</span></div><div><b>${S.wr}</b><span>помилки</span></div><div><b>${nw}</b><span>нових</span></div></div></div></div>
  <div class="sec">Готовність</div>
  <div class="tcard">${gsel>=0?rdRow(rsName(),S):""}${rdRow("Вся база",SA)}</div>
  ${db&&uid?"":`<div class="sec" style="margin-bottom:0">Прогрес зберігається лише на цьому пристрої</div>`}
  <div class="sec">Іспит</div>
  <div class="tcard"><div class="mut" style="margin-bottom:8px">Випадкові питання з бази. Обери заняття (можна кілька) і кількість:</div>
  <div class="chips tgc"><button class="chip ${!tgSel().length?"on":""}" onclick="tgAll()">Вся база</button>${G.map((g,i)=>`<button class="chip ${tgSel().includes(i)?"on":""}" onclick="tgTog(${i})">${esc(g.n.replace("Заняття ",""))}</button>`).join("")}</div>
  <div class="mut" style="margin:6px 0 12px">У вибраному: ${tPool().length} питань</div>
  <div class="tn">${[24,48,96].map(n=>`<button onclick="startTest(${n})" ${tPool().length?"":"disabled"}>${n}<small>питань</small></button>`).join("")}</div></div>
  <div class="sec">Порядок</div>
  <div class="seg"><span>Питання</span><button class="${qOrd()?"on":""}" onclick="setS('q',1)">Як у книзі</button><button class="${!qOrd()?"on":""}" onclick="setS('q',0)">Випадково</button></div>
  <div class="seg"><span>Варіанти</span><button class="${oOrd()?"on":""}" onclick="setS('o',1)">Як у книзі</button><button class="${!oOrd()?"on":""}" onclick="setS('o',0)">Перемішані</button></div>
  <div class="sec">Навчання</div>${chips}
  <div class="mode sp ${S.wr?"hot":"off"}"><button class="mb" onclick="start('wrong')" ${S.wr?"":"disabled"}><div class="ic">🎯</div><div><b>Робота над помилками</b><span class="s">${S.wr?"Тільки те, що ще не вдалося":"Помилок немає, чудово!"}</span></div><div class="n">${S.wr}</div></button>${S.wr?eyeBtn("wrong"):""}</div>
  <button class="mode" onclick="start('new')" ${nw?"":"disabled"}><div class="ic">✨</div><div><b>Нові питання</b><span class="s">Ще без відповіді</span></div><div class="n">${nw}</div></button>
  <button class="mode" onclick="start('all')"><div class="ic">🔀</div><div><b>Усі питання</b><span class="s">${qOrd()?"За порядком у книзі":"Перемішані"}, з нуля</span></div><div class="n">${S.tot}</div></button>
  <div class="mode sp ${favs().length?"":"off"}"><button class="mb" onclick="openFav()" ${favs().length?"":"disabled"}><div class="ic">⭐</div><div><b>Обрані</b><span class="s">${favs().length?"Починається одразу, з усіх збережених":"Додай питання зірочкою ★"}</span></div><div class="n">${favs().length}</div></button>${favs().length?eyeBtn("fav"):""}</div>
  ${owner?`<button class="mode" onclick="openBoard()"><div class="ic">👥</div><div><b>Учасники</b><span class="s">Хто як просувається</span></div></button>`:""}
  <div class="sec">Карта питань</div>
  <div class="tcard"><div class="mut" style="margin-bottom:8px">Сітка всіх питань: зелені — правильні, червоні — помилки, сірі — не пройдені, ★ — збережені.</div><div class="chips tgc"><button class="chip" onclick="openMap(-1)">Вся база</button>${G.map((g,i)=>`<button class="chip" onclick="openMap(${i})">${esc(g.n.replace("Заняття ",""))}</button>`).join("")}</div></div>
  <div class="sec">Почати заново</div>
  ${rsAsk?`<div class="tcard"><div style="font-weight:700;margin-bottom:6px">Почати заново: ${esc(rsName())}?</div><div class="mut" style="margin-bottom:12px">Позначки «вивчено», «помилки» і «нові» для цього обсягу очистяться. Історія спроб збережеться.</div><div class="navrow"><button class="nb" onclick="rsCancel()">Скасувати</button><button class="go" ${rsReady?"":"disabled"} onclick="rsDo()">${rsReady?"Так, почати заново":"Зачекай…"}</button></div></div>`:`<button class="mode" onclick="rsAskOpen()"><div class="ic">↻</div><div><b>Почати заново</b><span class="s">${esc(rsName())} · історія спроб збережеться</span></div></button>`}
  <div class="hint" style="margin-top:6px;display:block">Обсяг: кнопки заняття над картками «Навчання». Потрібне підтвердження.</div>
  <div class="hint">Клавіші: 1 — помилки · 2 — нові · 3 — усі питання · T — тема</div>
  ${hist?`<div class="sec">Останні спроби</div><div class="hist">${hist}</div>`:""}
  <button class="link" onclick="resetP()">${rst?"Точно скинути? Натисни ще раз":"Скинути мій прогрес"}</button>`;
}
let rsAsk=false,rsReady=false;
const rsName=()=>gsel<0?"Вся база":G[gsel].n;
function rsAskOpen(){rsAsk=true;rsReady=false;render();setTimeout(()=>{rsReady=true;if(view==="home"&&rsAsk)render()},1500)}
function rsCancel(){rsAsk=false;rsReady=false;render()}
function rsDo(){if(!rsReady)return;rsAsk=false;rsReady=false;QS.filter(q=>gsel<0||q.gi===gsel).forEach(q=>{const a=P.a[q.id];if(a)a.ok=null});save();render()}
function resetP(){if(!rst){rst=true;render();setTimeout(()=>{rst=false;if(view==="home")render()},4000);return}rst=false;P={a:{},h:[],s:P.s};save();render()}
function quiz(){
  if(!run.ids.length){$.innerHTML=`<div class="res"><div class="e">🎉</div><h1>Тут порожньо</h1><div style="color:var(--mut)">${run.mode==="wrong"?"Помилок немає, чудово!":"Усе вже пройдено."}</div></div><button class="btn" onclick="home()">На головну</button>`;return}
  if(run.done){
    const n=Math.max(1,run.ids.length-(run.skip||[]).length),p=Math.round(run.right/n*100),e=p>=90?"🏆":p>=70?"🎉":p>=50?"👍":"💪";
    $.innerHTML=`<div class="res">${ring(p,130)}<div class="e" style="margin-top:8px">${e}</div><h1>${p>=70?"Чудовий результат":"Є що підтягнути"}</h1><div style="color:var(--mut)">${MN[run.mode]}</div>
    <div class="two"><div><b style="color:var(--ok)">${run.right}</b><span style="color:var(--mut)">правильно</span></div><div><b style="color:var(--er)">${run.wrong.length}</b><span style="color:var(--mut)">помилок</span></div></div></div>
    ${(run.skip||[]).length?`<button class="go" style="margin-top:16px" onclick="startIds(run.skip,run.mode)">Пройти пропущені (${run.skip.length})</button>`:""}${run.wrong.length?`<button class="${(run.skip||[]).length?"btn":"go"}" style="margin-top:16px" onclick="start('wrong')">Попрацювати над помилками</button>`:""}<button class="btn" onclick="home()">На головну</button>`;return}
  const q=cur(),pk=run.picked,n=run.ids.length;
  const opts=run.ord.map((r,k)=>{let c="";if(pk!==null){c=r===q.c?"ok":k===pk?"er":"dim"}
    return`<button class="opt ${c}${k===run.sel&&pk===null?" sel":""}" style="animation-delay:${k*40}ms" onclick="pick(${k})" ${pk!==null?"disabled":""}><span class="l">${c==="ok"?"✓":c==="er"?"✕":LET[k]}</span><span>${esc(q.o[r])}</span><kbd>${k+1}</kbd></button>`}).join("");
  let fb="",bar="";
  if(pk!==null){const ok=run.ord[pk]===q.c;fb=`<div class="fb ${ok?"ok":"er"}">${ok?"Правильно!":"Неправильно. Правильна відповідь: <b>"+esc(q.o[q.c])+"</b>"}</div>`;}
  const last=run.i+1>=n;
  bar=`<div class="bar"><div class="navrow"><button class="nb" onclick="back()" ${run.i<=0?"disabled":""}>‹ Назад</button><button class="${pk!==null?"go":"nb f"}" onclick="next()">${last?"Завершити":pk!==null?"Далі ›":"Пропустити ›"}</button></div></div>`;
  $.innerHTML=`<div class="top"><button class="back" onclick="home()" aria-label="Вийти">‹</button><div class="pb"><i style="width:${(run.i+(pk!==null?1:0))/n*100}%"></i></div><div class="cnt">${run.i+1}/${n}</div><button class="back" onclick="openQMap()" aria-label="Карта питань" title="Карта питань (M)">${GRID}</button>${themeBtn()}</div>
  <div class="trow"><span class="tag">${esc(MN[run.mode])} · ${esc(q.g)} · питання №${q.n}</span><button class="star ${isFav(q.id)?"on":""}" data-id="${q.id}" onclick="toggleFav('${q.id}')" aria-label="В обрані">${isFav(q.id)?"★":"☆"}</button></div><div class="qc">${esc(q.t)}</div>${q.img?`<img class="fig" src="${q.img}" alt="">`:""}${opts}${fb}<div class="hint">1–${q.o.length} — вибрати · ↑ ↓ — переміщення · Enter — підтвердити / далі · ← назад · → далі / пропустити · F — в обрані · M — карта · T — тема · Esc — вийти</div>${bar}${mapOpen?qMapHTML():""}`;
}
function home(){view="home";run=null;rsAsk=false;mapOpen=false;render()}
async function openBoard(){
  view="board";board=null;render();
  try{
    const s=await db.collection("summary").get(),ids=s.docs.map(d=>d.id);
    const pr=user?await user.profiles(ids):{};
    board=s.docs.map(d=>({id:d.id,name:(pr[d.id]&&pr[d.id].name)||"Учасник",...d.data()}));
  }catch(e){board=[]}
  render();
}
function boardView(){
  $.innerHTML=`<div class="top"><button class="back" onclick="home()" aria-label="Назад">‹</button><h2 style="margin:0;flex:1">Учасники</h2>${themeBtn()}</div><div class="hist" style="margin-top:12px"><table id="bt"><tr><th>Ім’я</th><th>Вивчено</th><th>Востаннє</th></tr></table></div>`;
  const t=document.getElementById("bt");
  if(board===null){t.insertRow().insertCell().textContent="Завантаження…";return}
  if(!board.length){t.insertRow().insertCell().textContent="Поки що нікого";return}
  board.sort((a,b)=>b.t-a.t).forEach(b=>{const r=t.insertRow();r.insertCell().textContent=b.name;r.insertCell().textContent=b.ok+" з "+QS.length+" (відповідей: "+b.n+")";r.insertCell().textContent=new Date(b.t).toLocaleDateString("uk-UA")});
}
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(k==="t"||k==="T"||k==="е"||k==="Е"){toggleTheme();return}
  if(view==="quiz"&&run&&!run.done&&run.ids.length&&(k==="m"||k==="M"||k==="ь"||k==="Ь")){mapOpen?closeQMap():openQMap();return}
  if(mapOpen&&k==="Escape"){closeQMap();return}
  if(view==="quiz"&&run&&!run.done&&run.ids.length&&(k==="f"||k==="F"||k==="а"||k==="А")){toggleFav(cur().id);return}
  if(view==="quiz"&&run){
    if(run.done){if(k==="Enter"){e.preventDefault();run.wrong.length?start("wrong"):home()}else if(k==="Escape")home();return}
    if(!run.ids.length){if(k==="Enter"||k==="Escape")home();return}
    const n=cur().o.length;
    if(/^[1-9]$/.test(k)){const i=+k-1;if(i<n){e.preventDefault();pick(i)}return}
    if(k==="ArrowDown"||k==="ArrowUp"){e.preventDefault();if(run.picked===null){run.sel=run.sel<0?(k==="ArrowDown"?0:n-1):(run.sel+(k==="ArrowDown"?1:n-1))%n;markSel()}return}
    if(k==="ArrowRight"){e.preventDefault();next();return}
    if(k==="ArrowLeft"){e.preventDefault();back();return}
    if(k==="Enter"||k===" "){e.preventDefault();if(run.picked===null){if(run.sel>=0)pick(run.sel)}else next();return}
    if(k==="Escape")home();
  }else if(view==="board"||view==="fav"||view==="list"||view==="map"){if(k==="Escape")home()}
  else if(view==="home"){const S=st();
    if(k==="1"&&S.wr)start("wrong");else if(k==="2"&&S.tot-S.seen)start("new");else if(k==="3")start("all")}
});
window.focus();
(async()=>{
  render();
  user=await use("user");db=await use("db");
  if(user){try{uid=await user.id();me=await user.me();owner=await user.isOwner()}catch(e){}}
  await Promise.race([load(),new Promise(r=>setTimeout(r,10000))]);
  render();
})();
</script></body></html>
